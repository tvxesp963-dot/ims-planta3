function moSemanaISO(d) {
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dia = x.getUTCDay() || 7;
  x.setUTCDate(x.getUTCDate() + 4 - dia);
  const ini = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
  return { anio: x.getUTCFullYear(), sem: Math.ceil(((x - ini) / 86400000 + 1) / 7) };
}

function moEjeMax(v) {
  if (!(v > 0)) return 4;
  const raw = v / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  const paso = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  return paso * 4;
}

// Gráfica de barras con línea de meta mínima (verde = cumple, ámbar = bajo meta)
function moGrafica(items, meta, conLinea) {
  const H = 240;
  const maxV = Math.max(meta || 0, ...items.map(x => x.monto), 1);
  const eje = moEjeMax(maxV * 1.08);
  const px = v => Math.round(v / eje * H);
  const ticks = [0, 1, 2, 3, 4].map(i => { const v = eje * i / 4; return { label: '$' + (v >= 1000 ? (Math.round(v / 100) / 10) + 'k' : Math.round(v)), pos: Math.round(H * i / 4) }; });
  const minW = Math.max(items.length * 82, 300);
  const barras = items.map(x => {
    const ok = meta > 0 ? x.monto >= meta : true;
    const fondo = meta > 0 ? (ok ? 'linear-gradient(180deg,#6cc496,#2f7d57)' : 'linear-gradient(180deg,#e3c077,#b98d37)') : 'linear-gradient(180deg,#6fa0f7,#3b66c2)';
    return `<div style="flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px">
      <div style="text-align:center;line-height:1.25;position:relative;z-index:4;background:rgba(16,23,42,.82);padding:1px 6px;border-radius:5px"><div style="font-size:12px;font-weight:800">${moUsd(x.monto)}</div><div style="font-size:10px;font-weight:700;color:#facc15">${moFmt(x.pcs)} ${t('mo_pzas')}</div></div>
      <div style="position:relative;z-index:1;width:46%;max-width:64px;height:${px(x.monto)}px;border-radius:5px 5px 0 0;background:${fondo};${x.estimado ? 'opacity:.5' : ''}"></div></div>`;
  }).join('');
  const pies = items.map(x => {
    const dif = meta > 0 ? (x.monto >= meta ? '▲ +' : '▼ −') + moUsd(Math.abs(x.monto - meta)) : '';
    const chip = x.monto >= meta ? 'background:#0f2a1f;color:#6cc496;border:1px solid #2a6a4b' : 'background:#2a210b;color:#e3c077;border:1px solid #6b5420';
    return `<div style="flex:1 1 0;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px">
      <div style="font-size:${x.sub ? 11 : 12}px;font-weight:700;word-break:break-all">${moEsc(x.label)}</div>
      ${x.sub ? `<div style="font-size:10px;color:#9aa6b2">${moEsc(x.sub)}</div>` : ''}
      ${meta > 0 ? `<div style="font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;${chip}">${dif}</div>` : ''}</div>`;
  }).join('');
  return `<div style="overflow-x:auto"><div style="min-width:${minW}px">
    <div style="display:flex;gap:10px;padding-top:8px">
      <div style="position:relative;width:50px;height:${H}px;flex:0 0 50px">${ticks.map(k => `<div style="position:absolute;right:0;bottom:${k.pos}px;font-size:10px;color:#7f8c9a;transform:translateY(50%)">${k.label}</div>`).join('')}</div>
      <div style="position:relative;flex:1 1 0;min-width:0;height:${H}px;border-bottom:1px solid #3a4a73;background:linear-gradient(180deg,#10172a,#141a2b)">
        ${ticks.map(k => `<div style="position:absolute;left:0;right:0;bottom:${k.pos}px;border-top:1px solid #1f2a47"></div>`).join('')}
        ${meta > 0 ? `<div style="position:absolute;left:0;right:0;bottom:${px(meta)}px;border-top:2px dashed #facc15;z-index:2"></div>
        <div style="position:absolute;right:0;bottom:${px(meta) + 4}px;z-index:3;background:#facc15;color:#1a1400;font-size:11px;font-weight:800;padding:2px 8px;border-radius:4px 0 0 4px">${t('mo_meta')} ${moUsd(meta)}</div>` : ''}
        <div style="position:absolute;inset:0;display:flex">${barras}</div>
        ${conLinea && items.length > 1 ? `<svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" style="position:absolute;left:0;top:0;width:100%;height:${H}px;z-index:2;pointer-events:none"><polyline fill="none" stroke="#f2f3f5" stroke-opacity=".75" stroke-width="2" vector-effect="non-scaling-stroke" points="${items.map((x, i) => ((i + 0.5) / items.length * 100).toFixed(2) + ',' + (H - px(x.monto))).join(' ')}"/></svg>
        ${items.map((x, i) => `<div style="position:absolute;z-index:2;left:${((i + 0.5) / items.length * 100).toFixed(2)}%;bottom:${px(x.monto)}px;width:8px;height:8px;margin:0 0 -4px -4px;border-radius:50%;background:#f2f3f5;pointer-events:none"></div>`).join('')}` : ''}
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:4px"><div style="flex:0 0 50px"></div><div style="flex:1 1 0;min-width:0;display:flex">${pies}</div></div>
  </div></div>`;
}

// Familia del modelo: "SM-S741UZKAVZW" -> S741 · "S711 CRN" -> S711 (junta las variantes VZW / XAA / XAU...)
function moFamilia(modelo) {
  const m = String(modelo || '').toUpperCase().match(/(?:SM-)?([A-Z]\d{3})/);
  return m ? m[1] : (String(modelo || '').toUpperCase() || '—');
}
function moAgregarPorFamilia(filt) {
  const ff = {};
  filt.forEach(e => (e.monto_resumen.por_modelo || []).forEach(r => {
    const k = moFamilia(r.modelo);
    const g = ff[k] || (ff[k] = { fam: k, monto: 0, pcs: 0, sinPrecioPcs: 0, vars: new Set() });
    g.monto += r.monto || 0; g.pcs += r.pcs || 0; if (!(r.precio > 0)) g.sinPrecioPcs += r.pcs || 0;
    if (r.modelo) g.vars.add(String(r.modelo).toUpperCase());
  }));
  return Object.values(ff).sort((a, b) => b.monto - a.monto || b.pcs - a.pcs);
}
// Barras horizontales por familia de modelo (mismo estilo que "Enviados por modelo" del Dashboard)
function moGraficaFamilia(filt) {
  const fam = moAgregarPorFamilia(filt);
  const total = fam.reduce((x, g) => x + g.monto, 0);
  const maxM = Math.max(1, ...fam.map(g => g.monto));
  const filas = fam.map(g => `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;flex-wrap:wrap">
      <div style="flex:0 0 190px;min-width:0">
        <div style="font-family:monospace;color:#9db8ff;font-size:14px;font-weight:700">${moEsc(g.fam)}</div>

    ${kpi(t('mo_k_acum').replace('{fecha}', todos.length ? moDMY(todos[0].cierre) : '—'), moUsd(sum(todos, e => e.monto_resumen.total_usd)), t('mo_envios_n').replace('{n}', todos.length).replace('{p}', moFmt(sum(todos, e => e.monto_resumen.piezas))), '#2e3347')}

    const sw = (c, txt, v) => `<span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${c};vertical-align:middle"></span> ${txt}: <b>${moUsd(v)}</b></span>`;

    activoHtml = `<div class="card" style="margin-bottom:14px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div style="font-size:14px;font-weight:700">${t('mo_act_titulo').replace('{pl}', moEsc(act.folio)).replace('{dest}', moEsc(act.destino))}</div>
        <div style="font-size:12px;color:#7f8c9a">${t('mo_act_sub')}</div></div>
      <div style="display:flex;height:22px;background:#0b0f1a;border-radius:11px;overflow:hidden;border:1px solid #2e3347">
        <div style="width:${w(act.seg.cargado)};background:#22c55e"></div><div style="width:${w(act.seg.recibido)};background:#4f8cff"></div><div style="width:${w(act.seg.proceso)};background:#facc15"></div></div>
      <div style="display:flex;gap:22px;flex-wrap:wrap;font-size:13px">${sw('#22c55e', t('mo_seg_cargado'), act.seg.cargado)}${sw('#4f8cff', t('mo_seg_recibido'), act.seg.recibido)}${sw('#facc15', t('mo_seg_proceso'), act.seg.proceso)}</div>
      ${aviso}</div>`;
  }

  // Semanal (rango seleccionado)
  const sem = {};
  filt.forEach(e => {
    const s = moSemanaISO(e.cierre), k = s.anio + '-' + String(s.sem).padStart(2, '0');
    const g = sem[k] || (sem[k] = { sem: s.sem, monto: 0, pcs: 0, min: e.cierre, max: e.cierre });
    g.monto += e.monto_resumen.total_usd; g.pcs += e.monto_resumen.piezas;
    if (e.cierre < g.min) g.min = e.cierre; if (e.cierre > g.max) g.max = e.cierre;
  });
  const sActual = moSemanaISO(hoy), kActual = sActual.anio + '-' + String(sActual.sem).padStart(2, '0');
  const semItems = Object.keys(sem).sort().map(k => {
    const g = sem[k];
    return { label: t('mo_sem') + ' ' + g.sem + ' · ' + moDM(g.min) + (moDM(g.min) !== moDM(g.max) ? '–' + moDM(g.max) : '') + (k === kActual ? ' (' + t('mo_en_curso') + ')' : ''), monto: g.monto, pcs: g.pcs };
  });
  // Mensual (todo el historial)
  const mes = {};
  todos.forEach(e => {
    const k = e.cierre.getFullYear() + '-' + String(e.cierre.getMonth() + 1).padStart(2, '0');
    const g = mes[k] || (mes[k] = { y: e.cierre.getFullYear(), m: e.cierre.getMonth(), monto: 0, pcs: 0 });
    g.monto += e.monto_resumen.total_usd; g.pcs += e.monto_resumen.piezas;
  });
  const kMes = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0');
  const mesItems = Object.keys(mes).sort().map(k => {
    const g = mes[k];
    return { label: new Date(g.y, g.m, 1).toLocaleDateString(moLocale(), { month: 'short', year: 'numeric' }) + (k === kMes ? ' (' + t('mo_en_curso') + ')' : ''), monto: g.monto, pcs: g.pcs };

  const vacio = `<div style="color:#7f8c9a;font-size:13px;padding:20px;text-align:center">${t('mo_vacio')}</div>`;
  const avisoS = !mS ? `<div style="font-size:11px;color:#facc15">${t('mo_sin_meta_g')}</div>` : '';
  const avisoM = !mM ? `<div style="font-size:11px;color:#facc15">${t('mo_sin_meta_g')}</div>` : '';

  const ultimos = filt.slice(-12); // cronológico: del más antiguo al más reciente
  const graficaPL = moGraficaPL(ultimos);
  const tabla = `<div class="card" style="display:none"><div style="font-size:14px;font-weight:700;margin-bottom:8px">${t('mo_ult_titulo')}</div>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;min-width:520px">
      <thead><tr style="text-align:left;color:#7f8c9a;text-transform:uppercase;font-size:10px;letter-spacing:.5px"><th style="padding:6px 4px">${t('mo_th_pl')}</th><th>${t('mo_th_fecha')}</th><th style="text-align:right">${t('mo_th_pzas')}</th><th style="text-align:right">${t('mo_th_monto')}</th><th style="padding-left:12px">${t('mo_th_precio')}</th></tr></thead>
      <tbody>${ultimos.map(e => `<tr style="border-top:1px solid #1d2742"><td style="padding:8px 4px;font-family:monospace;color:#9db8ff">${moEsc(folioEmb(e))}</td><td>${moDiaTxt(e.cierre)}</td><td style="text-align:right">${moFmt(e.monto_resumen.piezas)}</td><td style="text-align:right;font-weight:700">${moUsd(e.monto_resumen.total_usd)}</td><td style="padding-left:12px">${moChip(e.monto_resumen.estimado)}</td></tr>`).join('')}</tbody>
    </table></div></div>`;

  // Trimestral y anual (todo el historial)
  const tri = {}, anio = {};
  todos.forEach(e => {
    const y = e.cierre.getFullYear(), q = Math.floor(e.cierre.getMonth() / 3) + 1;
    const kt = y + '-' + q, g = tri[kt] || (tri[kt] = { y, q, monto: 0, pcs: 0 });
    g.monto += e.monto_resumen.total_usd; g.pcs += e.monto_resumen.piezas;
    const ga = anio[y] || (anio[y] = { y, monto: 0, pcs: 0 });
    ga.monto += e.monto_resumen.total_usd; ga.pcs += e.monto_resumen.piezas;
  });
  const kTri = hoy.getFullYear() + '-' + (Math.floor(hoy.getMonth() / 3) + 1);
  const triItems = Object.keys(tri).sort().map(k => { const g = tri[k]; return { label: t('mo_trim') + g.q + ' ' + g.y + (k === kTri ? ' (' + t('mo_en_curso') + ')' : ''), monto: g.monto, pcs: g.pcs }; });

  const mT = Number(moData.metas.trimestre) || 0, mA = Number(moData.metas.anio) || 0;
  const P = {
    sem: { tit: 'mo_sem_titulo', d: 'mo_sem_d', items: semItems, meta: mS },

function moAgregarPorModelo(filt) {
  const mm = {};
  filt.forEach(e => (e.monto_resumen.por_modelo || []).forEach(r => {
    const g = mm[r.pn] || (mm[r.pn] = { modelo: r.modelo, pn: r.pn, pcs: 0, monto: 0, pcsPrecio: 0 });
    g.pcs += r.pcs || 0; g.monto += r.monto || 0; if (r.precio > 0) g.pcsPrecio += r.pcs || 0;
  }));
  return Object.values(mm).sort((a, b) => b.monto - a.monto);
}

  const kpi = (titulo, valor, sub, borde, color, subColor) => `<div style="flex:1 1 200px;background:#0f1524;border:1px solid ${borde};border-radius:10px;padding:12px 14px"><div style="font-size:10px;color:#7f8c9a;text-transform:uppercase;letter-spacing:.5px">${titulo}</div><div style="font-size:26px;font-weight:800;${color ? 'color:' + color : ''}">${valor}</div><div style="font-size:11px;color:${subColor || '#7f8c9a'}">${sub}</div></div>`;

    ${kpi(t('mo_h_envios'), filt.length, '&nbsp;', '#2e3347')}
    ${kpi(t('mo_h_prom'), pcsPrecio ? '$' + (totMonto / pcsPrecio).toFixed(2) : '—', t('mo_h_prom_d'), '#2e3347')}</div>`;
  const vacio = `<div style="color:#7f8c9a;font-size:13px;padding:20px;text-align:center">${t('mo_vacio')}</div>`;

  const filasModelo = modelos.map(m => {

      <td style="text-align:right">${precio ? moPrecioTxt(precio) : t('mo_sin_precio')}</td>

// ══════════ REPORTE EXCEL PARA CFO (ExcelJS, con gráficas) ══════════
function moPNGBarras(items, meta, W, H) {
  const S = 2, cv = document.createElement('canvas');
  cv.width = W * S; cv.height = H * S;
  const g = cv.getContext('2d'); g.scale(S, S);
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
  const L = 72, R = 24, T = 34, B = items.length > 12 ? 70 : 44;
  const pw = W - L - R, ph = H - T - B;
  const maxV = Math.max(meta || 0, ...items.map(x => x.monto), 1);
  const eje = moEjeMax(maxV * 1.12);
  g.font = '11px Arial'; g.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const y = T + ph - ph * i / 4, v = eje * i / 4;
    g.strokeStyle = '#e1e6f0'; g.lineWidth = 1; g.beginPath(); g.moveTo(L, y); g.lineTo(L + pw, y); g.stroke();
    g.fillStyle = '#5b6784'; g.textAlign = 'right';
    g.fillText('$' + (v >= 1000 ? (Math.round(v / 100) / 10) + 'k' : Math.round(v)), L - 8, y);
  }
  const n = items.length, slot = pw / n, bw = Math.min(56, slot * 0.62);
  if (meta > 0) {
    const y = T + ph - meta / eje * ph;
    g.setLineDash([7, 4]); g.strokeStyle = '#ca8a04'; g.lineWidth = 2; g.beginPath(); g.moveTo(L, y); g.lineTo(L + pw, y); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#ca8a04'; g.textAlign = 'right'; g.font = 'bold 11px Arial';
    g.fillText(t('mo_meta') + ' $' + moFmt(meta), L + pw, y - 9);
  }
  items.forEach((x, i) => {
    const cx = L + slot * (i + 0.5), h = x.monto / eje * ph;
    const ok = meta > 0 ? x.monto >= meta : null;
    g.fillStyle = ok === null ? '#4a6fb5' : ok ? '#3f8f6b' : '#d9a441';
    g.fillRect(cx - bw / 2, T + ph - h, bw, h);
    g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(cx - 40, T + ph - h - 26, 80, 24);
    g.fillStyle = '#1a2238'; g.textAlign = 'center'; g.font = 'bold 11px Arial';
    g.fillText('$' + moFmt(x.monto), cx, T + ph - h - 18);
    if (x.pcs != null) { g.fillStyle = '#a16207'; g.font = 'bold 10px Arial'; g.fillText(moFmt(x.pcs) + ' ' + t('mo_pzas'), cx, T + ph - h - 7); }
    g.save(); g.translate(cx, T + ph + 8); const rot = n > 12;
    if (rot) g.rotate(-Math.PI / 4);
    g.textAlign = rot ? 'right' : 'center'; g.textBaseline = 'top'; g.font = '10px Arial'; g.fillStyle = '#44506e';
    g.fillText(x.label, 0, 0); g.restore(); g.textBaseline = 'middle';
  });
  g.strokeStyle = '#8a94ad'; g.lineWidth = 1; g.beginPath(); g.moveTo(L, T + ph); g.lineTo(L + pw, T + ph); g.stroke();
  return cv.toDataURL('image/png').split(',')[1];
}

function moPNGHoriz(items, W) {
  const rowH = 30, T = 14, H = T + items.length * rowH + 14, S = 2, cv = document.createElement('canvas');
  cv.width = W * S; cv.height = H * S;
  const g = cv.getContext('2d'); g.scale(S, S);
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
  const L = 80, R = 230, pw = W - L - R, maxM = Math.max(1, ...items.map(x => x.monto)), tot = items.reduce((s, x) => s + x.monto, 0);
  g.textBaseline = 'middle';
  items.forEach((x, i) => {
    const y = T + i * rowH + rowH / 2;
    g.fillStyle = '#1a2f5e'; g.font = 'bold 13px Arial'; g.textAlign = 'left'; g.fillText(x.label, 8, y);
    g.fillStyle = '#eef1f8'; g.fillRect(L, y - 9, pw, 18);
    g.fillStyle = '#4a6fb5'; g.fillRect(L, y - 9, Math.max(x.monto > 0 ? 3 : 0, pw * x.monto / maxM), 18);
    g.fillStyle = '#1a2238'; g.font = 'bold 12px Arial'; g.textAlign = 'left';
    g.fillText(x.monto > 0 ? '$' + moFmt(x.monto) + '  ' + (tot ? (x.monto / tot * 100).toFixed(1) + '%' : '') : '—', L + pw + 10, y - 6);
    g.fillStyle = '#a16207'; g.font = 'bold 10px Arial'; g.fillText(moFmt(x.pcs) + ' ' + t('mo_pzas'), L + pw + 10, y + 8);
  });
  return { b64: cv.toDataURL('image/png').split(',')[1], h: H };
}

// Agrupa los envíos en semanas / meses / trimestres / años (cronológico)
function moPeriodosDe(lista) {
  const multi = new Set(lista.map(e => e.cierre.getFullYear())).size > 1;
  const sem = {}, mes = {}, tri = {}, anio = {};
  const suma = (o, k, base, e) => { const g = o[k] || (o[k] = { ...base, envios: 0, pcs: 0, monto: 0 }); g.envios++; g.pcs += e.monto_resumen.piezas || 0; g.monto += e.monto_resumen.total_usd || 0; return g; };
  lista.forEach(e => {
    const d = e.cierre, y = d.getFullYear(), s = moSemanaISO(d), q = Math.floor(d.getMonth() / 3) + 1;
    const gs = suma(sem, s.anio + '-' + String(s.sem).padStart(2, '0'), { s: s.sem, y: s.anio, min: d, max: d }, e);
    if (d < gs.min) gs.min = d; if (d > gs.max) gs.max = d;
    suma(mes, y + '-' + String(d.getMonth() + 1).padStart(2, '0'), { y, m: d.getMonth() }, e);
    suma(tri, y + '-' + q, { y, q }, e);
    suma(anio, String(y), { y }, e);
  });
  const ord = o => Object.keys(o).sort().map(k => o[k]);
  return {
    sem: ord(sem).map(g => ({ label: t('mo_sem') + ' ' + g.s + ' · ' + moDM(g.min) + (moDM(g.min) !== moDM(g.max) ? '–' + moDM(g.max) : ''), corto: t('mo_sem') + ' ' + g.s + (multi ? '/' + String(g.y).slice(2) : ''), envios: g.envios, pcs: g.pcs, monto: g.monto })),
    mes: ord(mes).map(g => { const l = new Date(g.y, g.m, 1).toLocaleDateString(moLocale(), { month: 'short', year: 'numeric' }); return { label: l, corto: l, envios: g.envios, pcs: g.pcs, monto: g.monto }; }),
    tri: ord(tri).map(g => { const l = t('mo_trim') + g.q + ' ' + g.y; return { label: l, corto: l, envios: g.envios, pcs: g.pcs, monto: g.monto }; }),
    anio: ord(anio).map(g => ({ label: String(g.y), corto: String(g.y), envios: g.envios, pcs: g.pcs, monto: g.monto })),
  };
}

async function moExcelReporte(lista, nombreArchivo, tituloExtra) {

  };
  const NF_USD = '"$"#,##0', NF_USD2 = '"$"#,##0.00', NF_PX = '"$"#,##0.0000', NF_PCS = '#,##0', NF_PCT = '0.0%';
  const preparar = (ws, anchos, ultimaCol) => {

    ws.pageSetup = { paperSize: 1, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.6, header: 0.3, footer: 0.3 }, horizontalCentered: true };

  };
  // Encabezado del reporte
  const encabezado = (ws, ultima, titulo, sub) => {

  lista.forEach((e, i) => {
    const m = e.monto_resumen.total_usd, dif = metaEnv > 0 ? m - metaEnv : '';
    const colDif = metaEnv > 0 ? { color: dif >= 0 ? VERDE : 'FFB45309', bold: true } : {};
    filaTabla(ws, r, [String(folioEmb(e)), moDMY(e.cierre), e.monto_resumen.piezas, m, total ? m / total : 0, dif, e.monto_resumen.estimado ? t('mo_estimado') : t('mo_congelado')], A1, N1, i % 2, { 5: colDif, 3: { bold: true }, 6: { color: e.monto_resumen.estimado ? 'FFB45309' : VERDE, size: 10 } });
    r++;
  });
  filaTotal(ws, r, [t('mo_total'), '', piezas, total, 1, '', ''], A1, N1); r += 2;

  // 2. Detalle por modelo
  tituloSec(ws, r, '2. ' + t('mo_x_s2'), U); r++;
  const mod = moAgregarPorModelo(lista);
  const A2 = ['left', 'left', 'right', 'right', 'right', 'right'], N2 = [null, null, NF_PX, NF_PCS, NF_USD, NF_PCT];
  cabTabla(ws, r, [t('mo_th_modelo'), t('mo_th_pn'), t('mo_x_th_precio'), t('mo_th_pzas'), t('mo_th_monto'), t('mo_x_th_pct')], A2); r++;
  mod.forEach((m, i) => {
    filaTabla(ws, r, [m.modelo, m.pn, m.pcsPrecio ? m.monto / m.pcsPrecio : '', m.pcs, Math.round(m.monto * 100) / 100, total ? m.monto / total : 0], A2, N2, i % 2, { 1: { size: 10 }, 4: { bold: true } });
    r++;
  });
  filaTotal(ws, r, [t('mo_total'), '', '', mod.reduce((s, m) => s + m.pcs, 0), Math.round(total * 100) / 100, 1], A2, N2); r += 2;

  // 3. Por familia (barras horizontales + tabla)
  ws.getRow(r - 1).addPageBreak();
  tituloSec(ws, r, '3. ' + t('mo_x_s3'), U); r += 2;
  const fam = moAgregarPorFamilia(lista);
  const hz = moPNGHoriz(fam.map(g => ({ label: g.fam, monto: g.monto, pcs: g.pcs })), 1000);
  const hzH = Math.round(800 * hz.h / 1000);
  poner(ws, hz.b64, 2, r, 800, hzH);
  r += filasImg(hzH) + 1;
  const A3 = ['left', 'left', 'right', 'right', 'right'], N3 = [null, null, NF_PCS, NF_USD, NF_PCT];
  cabTabla(ws, r, [t('mo_th_familia'), t('mo_x_th_variantes'), t('mo_th_pzas'), t('mo_th_monto'), t('mo_x_th_pct')], A3); r++;
  fam.forEach((g, i) => {
    filaTabla(ws, r, [g.fam, [...g.vars].map(v => v.replace(/^SM-/, '')).join(' · '), g.pcs, Math.round(g.monto * 100) / 100, total ? g.monto / total : 0], A3, N3, i % 2, { 1: { size: 9, color: GRIS }, 3: { bold: true } });
    r++;
  });
  r += 1;

  // Notas
  ws.mergeCells(r, 2, r + 3, U);
  setC(ws, r, 2, t('mo_x_notas') + ' ' + t('mo_x_notas_txt') + (hayEstimado ? ' ' + t('mo_x_notas_est') : '') + (sinPrecio > 0 ? ' ' + t('mo_x_notas_sp').replace('{n}', moFmt(sinPrecio)) : ''), { size: 10, color: 'FF44506E', wrap: true, v: 'top', fill: 'FFF6F8FC', border: { top: borde, bottom: borde, left: borde, right: borde } });
  r += 5;
  // Firmas
  [[2, 3, t('mo_x_firma_e') + ' · ' + usuario], [4, 5, t('mo_x_firma_r') + ' · ' + t('mo_x_rol_sup')], [7, 8, t('mo_x_firma_a') + ' · ' + t('mo_x_rol_cfo')]].forEach(([a, b, txt]) => {
    ws.mergeCells(r + 2, a, r + 2, b);
    setC(ws, r + 2, a, txt, { size: 10, color: GRIS, h: 'center', v: 'top' });
    for (let c = a; c <= b; c++) ws.getCell(r + 1, c).border = { bottom: { style: 'thin', color: { argb: TXT } } };
  });
  ws.getRow(r + 1).height = 28;
  r += 4;
  ws.mergeCells(r, 2, r, U); setC(ws, r, 2, t('mo_x_conf'), { size: 9, color: 'FF8A94AD', h: 'center' });

  // ═════════ HOJA 2: POR PERIODO ═════════
  const wp = wb.addWorksheet(t('mo_x_h_periodo'));
  preparar(wp, [2, 24, 12, 16, 16, 16, 16, 16, 2]);
  encabezado(wp, U, t('mo_x_titulo'), t('mo_x_periodo') + ' ' + moDMY(desde) + ' – ' + moDMY(hasta) + ' · ' + t('mo_x_h_periodo'));
  const P = moPeriodosDe(lista);
  const bloques = [
    ['sem', t('mo_sem_titulo'), Number(metas.semana) || 0],
    ['mes', t('mo_mes_titulo'), Number(metas.mes) || 0],
    ['tri', t('mo_tri_titulo'), Number(metas.trimestre) || 0],
    ['anio', t('mo_anio_titulo'), Number(metas.anio) || 0],
  ];
  const A4 = ['left', 'center', 'right', 'right', 'right', 'right', 'center'], N4 = [null, '0', NF_PCS, NF_USD, NF_USD, NF_USD, null];
  let rp = 7;
  bloques.forEach(([k, titulo, meta], bi) => {
    const datos = P[k];
    if (!datos.length) return;
    if (bi === 2) wp.getRow(rp - 1).addPageBreak();
    tituloSec(wp, rp, (bi + 1) + '. ' + titulo, U); rp += 2;
    const ph = 270;
    poner(wp, moPNGBarras(datos.slice(-24).map(x => ({ label: x.corto, monto: x.monto, pcs: x.pcs })), meta, 1000, ph), 2, rp, 800, Math.round(800 * ph / 1000));
    rp += filasImg(Math.round(800 * ph / 1000)) + 1;
    cabTabla(wp, rp, [t('mo_x_th_periodo'), t('mo_x_k_envios'), t('mo_th_pzas'), t('mo_th_monto'), t('mo_x_th_meta'), t('mo_x_th_dif'), t('mo_x_th_estado')], A4); rp++;
    datos.forEach((x, i) => {
      const dif = meta > 0 ? x.monto - meta : '';
      filaTabla(wp, rp, [x.label, x.envios, x.pcs, Math.round(x.monto * 100) / 100, meta > 0 ? meta : '', dif, meta > 0 ? (x.monto >= meta ? t('mo_cumple') : t('mo_bajo')) : '—'], A4, N4, i % 2, { 3: { bold: true }, 5: meta > 0 ? { color: dif >= 0 ? VERDE : 'FFB45309', bold: true } : {}, 6: meta > 0 ? { color: x.monto >= meta ? VERDE : 'FFB45309', bold: true, size: 10 } : {} });
      rp++;
    });
    filaTotal(wp, rp, [t('mo_total'), datos.reduce((s, x) => s + x.envios, 0), datos.reduce((s, x) => s + x.pcs, 0), Math.round(datos.reduce((s, x) => s + x.monto, 0) * 100) / 100, '', '', ''], A4, N4);
    rp += 3;
  });
  wp.mergeCells(rp, 2, rp, U); setC(wp, rp, 2, t('mo_x_conf'), { size: 9, color: 'FF8A94AD', h: 'center' });

  // ═════════ HOJA 3: DETALLE (filtrable) ═════════
  const wd = wb.addWorksheet(t('mo_x_h_detalle'));
  preparar(wd, [2, 16, 13, 24, 18, 10, 12, 12, 15, 14, 2]);
  wd.pageSetup.orientation = 'landscape';
  encabezado(wd, 10, t('mo_x_titulo'), t('mo_x_periodo') + ' ' + moDMY(desde) + ' – ' + moDMY(hasta) + ' · ' + t('mo_x_h_detalle'));
  const A5 = ['left', 'center', 'left', 'left', 'right', 'right', 'right', 'right', 'center'], N5 = [null, null, null, null, '0', NF_PCS, NF_PX, NF_USD2, null];
  cabTabla(wd, 7, [t('mo_th_pl'), t('mo_th_fecha'), t('mo_th_modelo'), t('mo_th_pn'), t('mo_th_pallets'), t('mo_th_pzas'), t('mo_th_ppz'), t('mo_th_monto'), t('mo_x_th_estado')], A5);
  let rd = 8;
  lista.forEach(e => (e.monto_resumen.por_modelo || []).forEach(x => {
    filaTabla(wd, rd, [String(folioEmb(e)), moDMY(e.cierre), x.modelo, x.pn, x.pallets != null ? x.pallets : '', x.pcs, x.precio || '', x.monto, e.monto_resumen.estimado ? t('mo_estimado') : t('mo_congelado')], A5, N5, (rd - 8) % 2, { 3: { size: 10 }, 7: { bold: true }, 8: { size: 10 } });
    rd++;
  }));
  filaTotal(wd, rd, [t('mo_total'), '', '', '', '', piezas, '', Math.round(total * 100) / 100, ''], A5, N5);
  wd.autoFilter = { from: { row: 7, column: 2 }, to: { row: Math.max(7, rd - 1), column: 10 } };
  wd.views = [{ showGridLines: false, state: 'frozen', ySplit: 7 }];
  wd.pageSetup.printTitlesRow = '7:7';

  // ═════════ HOJA 4: EN PISO (si hay) ═════════
  const piso = (moData && moData.piso) || [];
  if (piso.length) {
    const wf = wb.addWorksheet(t('mo_x_h_piso'));
    preparar(wf, [2, 20, 24, 18, 12, 14, 14, 30, 2]);
    encabezado(wf, 8, t('mo_piso_titulo'), t('mo_piso_d'));
    const A6 = ['left', 'left', 'left', 'right', 'right', 'right', 'left'], N6 = [null, null, null, NF_PCS, NF_PX, NF_USD, null];
    cabTabla(wf, 7, [t('mo_th_lote') + ' · ' + t('mo_th_pallet'), t('mo_th_modelo'), t('mo_th_pn'), t('mo_th_pzas'), t('mo_x_th_precio'), t('mo_th_monto'), t('mo_th_estado')], A6);
    let rf = 8;
    piso.forEach((x, i) => {
      filaTabla(wf, rf, [x.lote + ' · ' + x.pallet, x.modelo, x.pn, x.pcs, x.precio > 0 ? x.precio : '', x.precio > 0 ? x.monto : t('mo_sin_precio_c'), x.cerrado ? t('mo_piso_cerrado').replace('{pl}', x.pl) : t('mo_piso_libre')], A6, N6, i % 2, { 2: { size: 10 }, 5: { bold: true }, 6: { size: 10 } });
      rf++;
    });
    filaTotal(wf, rf, [t('mo_piso_total'), '', '', piso.reduce((s, x) => s + x.pcs, 0), '', Math.round(piso.reduce((s, x) => s + x.monto, 0) * 100) / 100, ''], A6, N6);
  }

  const buffer = await wb.xlsx.writeBuffer();
  moGuardarBlob(buffer, nombreArchivo + '_' + moISO(new Date()) + '.xlsx');
}

function moGuardarBlob(buffer, nombre) {
  const url = URL.createObjectURL(new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  const a = document.createElement('a');
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

window.moAdminCargar = async function() {
  try {
    const { db, doc, getDoc, getDocs, collection, query, orderBy, limit } = window.fb;
    const [m, a] = await Promise.all([getDoc(doc(db, 'shipqr_config', 'montos_metas')), getDoc(doc(db, 'shipqr_config', 'montos_acceso'))]);
    const metas = m.exists() ? m.data() : {};
    [['envio', 'mo-meta-env'], ['semana', 'mo-meta-sem'], ['mes', 'mo-meta-mes'], ['trimestre', 'mo-meta-tri'], ['anio', 'mo-meta-anio']].forEach(([k, id]) => { const i = document.getElementById(id); if (i) i.value = metas[k] || ''; });
    const inf = document.getElementById('mo-pw-info');
    if (inf) inf.textContent = a.exists() && a.data().updated_at ? t('mo_pw_ultimo').replace('{f}', moDMY(new Date(a.data().updated_at))).replace('{u}', a.data().updated_by || '') : t('mo_pw_ninguna');
    const lista = document.getElementById('mo-audit-lista');
    if (lista) {
      const s = await getDocs(query(collection(db, 'shipqr_auditoria_montos'), orderBy('at', 'desc'), limit(15)));
      lista.innerHTML = s.empty ? `<div style="color:#7f8c9a;font-size:12px">${t('mo_audit_vacio')}</div>` : s.docs.map(d => {
        const x = d.data(), f = x.at_iso ? new Date(x.at_iso) : null;
        return `<div style="display:flex;gap:10px;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)"><span style="color:#7f8c9a;min-width:130px">${f ? moDMY(f) + ' ' + f.toLocaleTimeString(moLocale(), { hour: '2-digit', minute: '2-digit' }) : ''}</span><span style="min-width:90px">${moEsc(x.usuario)}</span><span style="color:${x.accion === 'ACCESO_FALLIDO' ? '#f87171' : '#9aa6b2'}">${moEsc(x.accion)} ${moEsc(x.detalle)}</span></div>`;
      }).join('');
    }
  } catch (e) { console.error('Admin montos', e); }
};

window.moAdminGuardarPassword = async function() {
  const msg = document.getElementById('mo-pw-msg');
  try {
    const err = await moGuardarPassword(document.getElementById('mo-apw1').value, document.getElementById('mo-apw2').value);

    await moAuditoria('CAMBIO_METAS', `env ${metas.envio} · sem ${metas.semana} · mes ${metas.mes} · tri ${metas.trimestre} · año ${metas.anio}`);

    <div id="us-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;align-items:center;justify-content:center;padding:16px">

        <div id="us-err" style="color:#e74c3c;font-size:12px;margin-top:10px;text-align:center"></div>
      </div>
    </div>
  `;

  window.abrirModalUsuario = () => { document.getElementById('us-modal').style.display = 'flex'; };
  window.cerrarModalUsuario = () => { document.getElementById('us-modal').style.display = 'none'; };

  // Guarda en memoria la lista completa de lotes (con su conteo de pallets) para poder filtrar sin volver a leer Firestore
  let _lotesParaBorrarCache = [];

  window.cargarListaLotesBorrar = async function() {
    const tbody = document.getElementById('borrar-lotes-tbody');
    const statusEl = document.getElementById('borrar-lotes-status');
    if (!tbody) return;
    tbody.innerHTML = `<tr><td colspan="8" style="padding:16px;text-align:center;color:#7f8c9a">${t('cargando_lotes')}</td></tr>`;
    if (statusEl) statusEl.textContent = '';
    try {
      const { db, collection, getDocs } = window.fb;
      const [lotesSnap, palletsSnap] = await Promise.all([
        getDocs(collection(db, 'shipqr_lotes')),
        getDocs(collection(db, 'shipqr_pallets'))
      ]);
      // Conteo de pallets por lote, hecho una sola vez en memoria (evita 1 consulta por lote)
      const conteoPallets = {};
      palletsSnap.forEach(p => {
        const lt = p.data().lot_number;
        if (lt) conteoPallets[lt] = (conteoPallets[lt] || 0) + 1;
      });
      _lotesParaBorrarCache = lotesSnap.docs.map(d => ({
        id: d.id,
        lot_number: d.data().lot_number || d.id,
        modelo: d.data().modelo || '—',
        part_number: d.data().part_number || '—',
        quantity: d.data().quantity || 0,
        status: d.data().status || '—',
        created_at: d.data().created_at || null,
        numPallets: conteoPallets[d.id] || 0
      })).sort((a, b) => (b.created_at?.toMillis?.() || 0) - (a.created_at?.toMillis?.() || 0));
      renderListaLotesBorrar(_lotesParaBorrarCache);
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="8" style="padding:16px;text-align:center;color:#e74c3c">Error cargando lotes: ${e.message}</td></tr>`;
      console.error('Error cargando lista de lotes para borrar:', e);
    }
  };

  function formatearFechaBorrarLotes(ts) {
    if (!ts || !ts.toDate) return '—';
    const d = ts.toDate();
    const fecha = d.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const hora = d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    return `${fecha} ${hora}`;
  }

  function renderListaLotesBorrar(lista) {
    const tbody = document.getElementById('borrar-lotes-tbody');
    if (!tbody) return;
    if (lista.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="padding:16px;text-align:center;color:#7f8c9a">${t('sin_lotes_reg')}</td></tr>`;
      actualizarContadorSeleccionBorrar();
      return;
    }
    tbody.innerHTML = lista.map(l => `
      <tr style="border-top:1px solid var(--border)">
        <td style="padding:6px"><input type="checkbox" class="borrar-lote-check" value="${l.id}" onchange="actualizarContadorSeleccionBorrar()"></td>
        <td style="padding:6px;font-family:monospace;color:var(--accent);font-weight:600">${l.lot_number}</td>
        <td style="padding:6px;text-transform:uppercase">${l.modelo}</td>
        <td style="padding:6px;text-transform:uppercase;color:#7f8c9a">${l.part_number}</td>
        <td style="padding:6px;text-align:right">${fmtNum(l.quantity)}</td>
        <td style="padding:6px">${statusTag(l.status)}</td>
        <td style="padding:6px;text-align:right">${l.numPallets}</td>
        <td style="padding:6px;white-space:nowrap;color:#7f8c9a;font-size:11px">${formatearFechaBorrarLotes(l.created_at)}</td>
      </tr>
    `).join('');
    document.getElementById('borrar-lote-check-all').checked = false;
    actualizarContadorSeleccionBorrar();
  }

  window.filtrarListaLotesBorrar = function() {
    const texto = (document.getElementById('borrar-lote-filtro').value || '').trim().toUpperCase();
    if (!texto) { renderListaLotesBorrar(_lotesParaBorrarCache); return; }
    const filtrados = _lotesParaBorrarCache.filter(l =>
      (l.lot_number || '').toUpperCase().includes(texto) || (l.modelo || '').toUpperCase().includes(texto) || (l.part_number || '').toUpperCase().includes(texto)
    );
    renderListaLotesBorrar(filtrados);
  };

  window.toggleTodosLotesBorrar = function(checkboxTodos) {
    document.querySelectorAll('.borrar-lote-check').forEach(chk => { chk.checked = checkboxTodos.checked; });
    actualizarContadorSeleccionBorrar();
  };

  window.actualizarContadorSeleccionBorrar = function() {
    const marcados = document.querySelectorAll('.borrar-lote-check:checked').length;
    const el = document.getElementById('borrar-lotes-seleccion');
    if (el) el.textContent = `${marcados} ${t('suf_seleccionados')}`;
  };

  window.borrarLotesSeleccionados = async function() {
    const statusEl = document.getElementById('borrar-lotes-status');
    const marcados = Array.from(document.querySelectorAll('.borrar-lote-check:checked')).map(chk => chk.value);
    const total = marcados.length;

    if (total === 0) { statusEl.style.color = '#f1c40f'; statusEl.textContent = 'No seleccionaste ningún lote.'; return; }

    const { db, collection, getDocs, query, where, writeBatch, doc } = window.fb;

    // Junta también los pallets de los lotes marcados, para no dejar huérfanos
    const palletDocs = [];
    for (const lotId of marcados) {
      const palletsSnap = await getDocs(query(collection(db, 'shipqr_pallets'), where('lot_number', '==', lotId)));
      palletsSnap.forEach(p => palletDocs.push(p.id));
    }

    const listaLotes = marcados.join(', ');
    if (!confirm(`Vas a borrar ${total} lote(s) seleccionado(s) (${listaLotes}) y sus ${palletDocs.length} pallet(s). Esta acción NO se puede deshacer. ¿Continuar?`)) return;
    const confirmacion = prompt(`Para confirmar, escribe BORRAR (en mayúsculas):`);
    if (confirmacion !== 'BORRAR') { statusEl.style.color = '#f1c40f'; statusEl.textContent = 'Cancelado, no se borró nada.'; return; }

    statusEl.style.color = '#7f8c9a';
    statusEl.textContent = `Borrando ${total} lote(s) y ${palletDocs.length} pallet(s)...`;
    try {
      // Firestore permite máximo 500 operaciones por batch, se procesa en lotes de 400
      const todosLosIds = [...marcados.map(id => ({ col: 'shipqr_lotes', id })), ...palletDocs.map(id => ({ col: 'shipqr_pallets', id }))];
      for (let i = 0; i < todosLosIds.length; i += 400) {
        const batch = writeBatch(db);
        todosLosIds.slice(i, i + 400).forEach(item => batch.delete(doc(db, item.col, item.id)));
        await batch.commit();
      }
      statusEl.style.color = '#2ecc71';
      statusEl.textContent = `✅ ${total} lote(s) y ${palletDocs.length} pallet(s) borrado(s).`;
      cargarListaLotesBorrar();
    } catch (e) {
      statusEl.style.color = '#e74c3c';
      statusEl.textContent = 'Error al borrar: ' + e.message;
      console.error('Error borrando lotes:', e);
    }
  };

  window.reinicioCompletoSistema = async function() {
    const statusEl = document.getElementById('reinicio-status');
    const { db, collection, getDocs, writeBatch, doc } = window.fb;

    const [lotesSnap, palletsSnap, embarquesSnap] = await Promise.all([
      getDocs(collection(db, 'shipqr_lotes')),
      getDocs(collection(db, 'shipqr_pallets')),
      getDocs(collection(db, 'shipqr_embarques'))
    ]);
    const total = lotesSnap.size + palletsSnap.size + embarquesSnap.size;
    if (total === 0) { statusEl.style.color = '#7f8c9a'; statusEl.textContent = 'No hay nada que borrar, el sistema ya está limpio.'; return; }

    if (!confirm(`Vas a borrar TODO: ${lotesSnap.size} lote(s), ${palletsSnap.size} pallet(s) y ${embarquesSnap.size} embarque(s). Esta acción NO se puede deshacer. ¿Continuar?`)) return;
    const confirmacion = prompt(`Para confirmar, escribe REINICIAR (en mayúsculas):`);
    if (confirmacion !== 'REINICIAR') { statusEl.style.color = '#f1c40f'; statusEl.textContent = 'Cancelado, no se borró nada.'; return; }

    statusEl.style.color = '#7f8c9a';
    statusEl.textContent = `Borrando ${total} documento(s)...`;
    try {
      const todos = [
        ...lotesSnap.docs.map(d => ({ col: 'shipqr_lotes', id: d.id })),
        ...palletsSnap.docs.map(d => ({ col: 'shipqr_pallets', id: d.id })),
        ...embarquesSnap.docs.map(d => ({ col: 'shipqr_embarques', id: d.id }))
      ];
      for (let i = 0; i < todos.length; i += 400) {
        const batch = writeBatch(db);
        todos.slice(i, i + 400).forEach(item => batch.delete(doc(db, item.col, item.id)));
        await batch.commit();
      }
      statusEl.style.color = '#2ecc71';
      statusEl.textContent = `✅ Sistema reiniciado: ${total} documento(s) borrados. Listo para empezar de cero.`;
      cargarListaLotesBorrar();
    } catch (e) {
      statusEl.style.color = '#e74c3c';
      statusEl.textContent = 'Error al reiniciar: ' + e.message;
      console.error('Error en reinicio completo:', e);
    }
  };

  // ── Tarjetas colapsables: el título de cada tarjeta se puede tocar para abrir/cerrar; se recuerda el estado en este equipo ──
  const admLeerEstado = () => { try { return JSON.parse(localStorage.getItem('shipqr_adm_abiertas') || '{}'); } catch (e) { return {}; } };
  const admGuardarEstado = (o) => { try { localStorage.setItem('shipqr_adm_abiertas', JSON.stringify(o)); } catch (e) {} };
  const admPintar = (card, abierta) => {
    const body = card.querySelector(':scope > .col-body');
    const chev = card.querySelector('.col-chev');
    const head = card.firstElementChild;
    if (body) body.style.display = abierta ? '' : 'none';
    if (chev) chev.textContent = abierta ? '▼ ' : '▶ ';
    if (head) head.style.marginBottom = abierta ? (head.dataset.mb || '') : '0';
    card.dataset.abierta = abierta ? '1' : '0';
  };
  const estadoInicial = admLeerEstado();
  document.querySelectorAll('#app [data-col]').forEach(card => {
    const key = card.getAttribute('data-col');
    const head = card.firstElementChild;
    head.dataset.mb = head.style.marginBottom || '';
    const body = document.createElement('div');
    body.className = 'col-body';
    while (head.nextSibling) body.appendChild(head.nextSibling);
    card.appendChild(body);
    const chev = document.createElement('span');
    chev.className = 'col-chev';
    chev.style.cssText = 'color:#7f8c9a;font-size:11px;user-select:none';
    const tgt = getComputedStyle(head).display === 'flex' ? head.firstElementChild : head;
    tgt.insertBefore(chev, tgt.firstChild);
    head.style.cursor = 'pointer';
    head.addEventListener('click', ev => {
      if (ev.target.closest('button, input, select, label, a')) return;
      const abrir = card.dataset.abierta !== '1';
      admPintar(card, abrir);
      const st = admLeerEstado(); st[key] = abrir; admGuardarEstado(st);
    });
    admPintar(card, estadoInicial[key] === true);
  });
  window.admToggleTodo = function() {
    const cards = Array.from(document.querySelectorAll('#app [data-col]'));
    const abrir = cards.some(c => c.dataset.abierta !== '1');
    const st = {};
    cards.forEach(c => { admPintar(c, abrir); st[c.getAttribute('data-col')] = abrir; });
    admGuardarEstado(st);
  };

  loadModelosShipqr();
  renderEmpaqueMaster();
  renderPreciosMaster();
  moAdminCargar();
  cargarListaLotesBorrar();

  document.getElementById('us-crear-btn').onclick = async () => {
    const username = document.getElementById('us-username').value.trim().toLowerCase();
    const nombre = document.getElementById('us-nombre').value.trim();
    const password = document.getElementById('us-password').value;
    const role = document.getElementById('us-role').value;
    const errEl = document.getElementById('us-err');
    errEl.textContent = '';
    if (!username || !nombre || !password) { errEl.textContent = 'Completa todos los campos'; return; }

    const { db, doc, getDoc, setDoc } = window.fb;
    const ref = doc(db, 'shipqr_usuarios', username);
    const existing = await getDoc(ref);
    if (existing.exists()) { errEl.textContent = 'Ese usuario ya existe'; return; }

    await setDoc(ref, { username, nombre, password, role, activo: true });
    cerrarModalUsuario();
    document.getElementById('us-username').value = '';
    document.getElementById('us-nombre').value = '';
    document.getElementById('us-password').value = '';
  };

  seedUsuariosSiVacio().then(() => {
    const { db, collection, onSnapshot } = window.fb;
    if (unsubUsuarios) unsubUsuarios();
    unsubUsuarios = onSnapshot(collection(db, 'shipqr_usuarios'), (snap) => {
      const usuarios = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      pintarAdmin(usuarios);
    }, (err) => console.error('Error al cargar usuarios', err));
  });
}

function pintarAdmin(usuarios) {
  const statsEl = document.getElementById('admin-stats');
  if (statsEl) {
    statsEl.innerHTML = ALL_ROLES.map(r => {
      const count = usuarios.filter(u => u.role === r).length;

// Llave para Firestore: si hay número de parte, es una excepción específica modelo+parte;
// si no, es la llave simple del modelo (igual que como se guardaba antes, para no perder los datos ya capturados)
function claveEmpaque(modelo, numeroParte) {
  const m = (modelo || '').trim().toUpperCase();
  const p = (numeroParte || '').trim().toUpperCase();
  return p ? `${m}__${p}` : m;
}

async function renderEmpaqueMaster() {
  const tbody = document.getElementById('empaque-tbody');
  if (!tbody) return;
  tbody.innerHTML = `<tr><td colspan="12" style="padding:16px;text-align:center;color:#7f8c9a">${t('word_cargando')}</td></tr>`;
  try {
    const { db, doc, getDoc, collection, getDocs } = window.fb;
    cargarMaxLbContenedor();
    const bomDoc = await getDoc(doc(db, 'bom_simulator_p4', 'bom_activo'));
    let modelos = [];
    const partesPorModelo = {};
    if (bomDoc.exists()) {
      const BOM = JSON.parse(bomDoc.data().bom || '[]');
      modelos = [...new Set(BOM.map(r => r.sm).filter(Boolean).map(s => s.trim().toUpperCase()))].sort();
      // Toma el primer número de parte (pn) que el BOM tenga registrado para cada modelo, solo como referencia
      BOM.forEach(r => {
        if (r.sm && r.pn) {
          const m = r.sm.trim().toUpperCase();
          if (!partesPorModelo[m]) partesPorModelo[m] = r.pn.trim().toUpperCase();
        }
      });
    }
    const masterSnap = await getDocs(collection(db, 'shipqr_empaque_master'));
    const master = {};
    masterSnap.forEach(d => { master[d.id] = d.data(); });
    if (modelos.length === 0) {
      tbody.innerHTML = `<tr><td colspan="12" style="padding:16px;text-align:center;color:#7f8c9a">Sin modelos en el BOM activo</td></tr>`;
      return;
    }
    tbody.innerHTML = modelos.map(m => {
      const key = claveEmpaque(m, '');
      const d = master[key] || {};
      const idSafe = key.replace(/[^A-Z0-9]/g, '_');
      const numeroParte = partesPorModelo[m] || '—';
      return `
        <tr style="border-top:1px solid var(--border)">
          <td style="padding:6px 4px;font-family:monospace;color:var(--accent)">${m}</td>
          <td style="padding:6px 4px;font-family:monospace;color:#7f8c9a" title="Se toma automático del BOM activo">${numeroParte}</td>
          <td style="padding:4px"><input id="em-desc-${idSafe}" value="${d.descripcionDallas||''}" style="min-width:110px"></td>
          <td style="padding:4px"><input id="em-tipo-${idSafe}" value="${d.tipo||''}" style="min-width:100px"></td>
          <td style="padding:4px"><input id="em-fsc-${idSafe}" value="${d.fscType||''}" style="min-width:100px"></td>
          <td style="padding:4px"><input id="em-rev-${idSafe}" value="${d.rev||'0'}" style="min-width:50px"></td>
          <td style="padding:4px"><input id="em-pcs-${idSafe}" type="number" value="${d.pcsPorCaja||''}" style="min-width:70px"></td>
          <td style="padding:4px"><input id="em-peso-${idSafe}" type="number" step="0.01" value="${d.pesoCajaCompleta||''}" style="min-width:80px"></td>
          <td style="padding:4px"><input id="em-pallet-${idSafe}" type="number" value="${d.cajasPorPallet||''}" style="min-width:60px"></td>
          <td style="padding:4px"><input id="em-boxno-${idSafe}" value="${d.boxNo||''}" style="min-width:50px"></td>
          <td style="padding:4px"><input id="em-dim-${idSafe}" value="${d.dimension||''}" style="min-width:150px"></td>
          <td style="padding:4px"><button class="btn-secondary" style="padding:5px 10px;font-size:11px" onclick="guardarEmpaqueModelo('${m}','')">Guardar</button></td>
        </tr>
      `;
    }).join('');
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="12" style="padding:16px;text-align:center;color:#e74c3c">Error: ${e.message}</td></tr>`;
    console.error('Error cargando empaque maestro:', e);
  }
}

// ══════════ MASTER DE PRECIOS (USD por pieza) ══════════
// Colección shipqr_precios, un documento por número de parte: { pn, descripcion, precio, vigente_desde, fuente, historial[] }
function precioHoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function esPrekitSAP(desc) { return /pre-?kit/i.test(desc || ''); }
function precioFuenteTxt(f) { return f === 'SAP' ? t('pr_f_sap') : f === 'SAP_PROM' ? t('pr_f_prom') : f === 'MANUAL' ? t('pr_f_manual') : t('pr_f_sin'); }
function precioFuenteChip(f) {
  const c = f === 'SAP' ? ['#2ecc71', 'rgba(46,204,113,.12)'] : f === 'SAP_PROM' ? ['#f1c40f', 'rgba(241,196,15,.12)'] : f === 'MANUAL' ? ['#4f8ef7', 'rgba(79,142,247,.12)'] : ['#c9a24a', 'rgba(201,162,74,.12)'];
  return `<span style="font-size:11px;border-radius:20px;padding:2px 9px;color:${c[0]};background:${c[1]};border:1px solid ${c[0]}55">${precioFuenteTxt(f)}</span>`;
}
async function leerPreciosMaster() {
  const { db, collection, getDocs } = window.fb;
  const snap = await getDocs(collection(db, 'shipqr_precios'));
  const m = {};
  snap.forEach(d => { m[d.id] = d.data(); });
  window._preciosCache = m;
  return m;
}

window.renderPreciosMaster = async function() {
  const tbody = document.getElementById('precios-tbody');
  if (!tbody) return;
  try {
    const { db, doc, getDoc } = window.fb;
    const precios = await leerPreciosMaster();
    // Una fila por modelo del BOM activo (igual que Empaque): solo los modelos pre-kit que se envían
    const porModelo = {};
    const bomDoc = await getDoc(doc(db, 'bom_simulator_p4', 'bom_activo'));
    if (bomDoc.exists()) {
      JSON.parse(bomDoc.data().bom || '[]').forEach(r => {
        if (!r.sm) return;
        const m = r.sm.trim().toUpperCase();
        const lista = porModelo[m] || (porModelo[m] = []);
        const pn = (r.pn || '').trim().toUpperCase();
        if (pn && !lista.includes(pn)) lista.push(pn);
      });
    }
    const soloSin = !!document.getElementById('precios-solo-sin')?.checked;
    const todos = Object.keys(porModelo).sort().map(m => {
      const pns = porModelo[m];
      const pn = pns.find(x => precios[x] && precios[x].precio > 0) || pns[0] || '';
      return { modelo: m, pn, extra: Math.max(0, pns.length - 1) };
    });
    const cnt = document.getElementById('precios-count');
    if (cnt) cnt.textContent = todos.length + ' ' + t('pr_modelos') + ' · ' + todos.filter(r => r.pn && precios[r.pn] && precios[r.pn].precio > 0).length + ' ' + t('pr_con_precio');
    const lista = todos.filter(r => !soloSin || !(r.pn && precios[r.pn] && precios[r.pn].precio > 0));
    if (!lista.length) { tbody.innerHTML = `<tr><td colspan="7" style="padding:16px;text-align:center;color:#7f8c9a">—</td></tr>`; return; }
    tbody.innerHTML = lista.map(r => {
      if (!r.pn) return `
        <tr style="border-top:1px solid var(--border)">
          <td style="padding:6px 4px;font-family:monospace;color:var(--accent)">${r.modelo}</td>
          <td colspan="6" style="padding:6px 4px;color:#c9a24a">${t('pr_sin_pn')}</td>
        </tr>`;
      const d = precios[r.pn] || {};
      const idSafe = r.pn.replace(/[^A-Z0-9]/g, '_');
      const tiene = d.precio > 0;
      return `
        <tr style="border-top:1px solid var(--border)">
          <td style="padding:6px 4px;font-family:monospace;color:var(--accent)">${r.modelo || '—'}</td>
          <td style="padding:6px 4px;font-family:monospace;color:#7f8c9a">${r.pn}</td>
          <td style="padding:6px 4px;color:#9aa6b2">${(d.descripcion || '').replace(/</g, '&lt;')}</td>
          <td style="padding:4px"><input id="pr-${idSafe}" type="number" step="0.0001" min="0" value="${tiene ? d.precio : ''}" style="width:110px"></td>
          <td style="padding:6px 4px;color:#9aa6b2">${d.vigente_desde || '—'}</td>
          <td style="padding:6px 4px">${precioFuenteChip(tiene ? d.fuente : '')}</td>
          <td style="padding:4px;white-space:nowrap">
            <button class="btn-secondary" style="padding:5px 10px;font-size:11px" onclick="guardarPrecioManual('${r.pn}')">${t('pr_guardar')}</button>
            <button class="btn-secondary" style="padding:5px 10px;font-size:11px" onclick="verHistorialPrecio('${r.pn}')">${t('pr_hist')}</button>
          </td>
        </tr>`;
    }).join('');
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="7" style="padding:16px;text-align:center;color:#e74c3c">${t('pr_err')}${e.message}</td></tr>`;
    console.error('Error cargando master de precios:', e);
  }
};

// Escribe un precio y agrega la entrada al historial (sin borrar lo anterior)
async function escribirPrecio(pn, precio, fuente, descripcion, prev) {
  const { db, doc, setDoc } = window.fb;
  const hoy = precioHoyISO();
  const user = (window.currentUser && window.currentUser.username) || '';
  const hist = [...((prev && prev.historial) || []), { precio, desde: hoy, fuente, por: user, at: new Date().toISOString() }];
  await setDoc(doc(db, 'shipqr_precios', pn), {
    pn, descripcion: descripcion || (prev && prev.descripcion) || '', precio, vigente_desde: hoy, fuente,
    actualizado_por: user, actualizado_at: new Date().toISOString(), historial: hist
  });
}

window.guardarPrecioManual = async function(pn) {
  const idSafe = pn.replace(/[^A-Z0-9]/g, '_');
  const v = parseFloat(document.getElementById('pr-' + idSafe)?.value);
  const st = document.getElementById('precios-status');
  if (!(v > 0)) { alert(t('pr_invalido')); return; }
  try {
    const prev = (window._preciosCache || {})[pn];
    if (prev && prev.precio === v) { renderPreciosMaster(); return; }
    await escribirPrecio(pn, Math.round(v * 10000) / 10000, 'MANUAL', '', prev);
    if (st) { st.style.color = '#2ecc71'; st.textContent = t('pr_guardado') + ' · ' + pn; }
    renderPreciosMaster();
  } catch (e) { if (st) { st.style.color = '#e74c3c'; st.textContent = t('pr_err') + e.message; } console.error(e); }
};

window.verHistorialPrecio = function(pn) {
  const d = (window._preciosCache || {})[pn];
  const h = (d && d.historial) || [];
  if (!h.length) { alert(t('pr_hist_titulo') + ' · ' + pn + '\n\n' + t('pr_hist_vacio')); return; }
  const lineas = h.slice().reverse().map(x => `${x.desde}   $${Number(x.precio).toFixed(4)}   ${precioFuenteTxt(x.fuente)}   ${x.por || ''}`).join('\n');
  alert(t('pr_hist_titulo') + ' · ' + pn + '\n\n' + lineas);
};

// Lee el GR Summary de SAP (Material, Description, U/Price, GR Qty) y propone el promedio ponderado por PN pre-kit
window.cargarPreciosDesdeExcel = async function(inputEl) {
  const st = document.getElementById('precios-status');
  const pv = document.getElementById('precios-preview');
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  st.style.color = '#7f8c9a'; st.textContent = t('pr_leyendo'); pv.innerHTML = '';
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    let rows = null;
    for (const name of wb.SheetNames) {
      // Los encabezados de SAP traen espacios (" GR Qty "): se limpian antes de buscar las columnas
      const r = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: '' }).map(x => { const o = {}; Object.keys(x).forEach(k => { o[String(k).trim()] = x[k]; }); return o; });
      if (r.length && 'Material' in r[0] && 'U/Price' in r[0] && 'GR Qty' in r[0]) { rows = r; break; }
    }
    if (!rows) { st.style.color = '#e74c3c'; st.textContent = t('pr_vacio'); inputEl.value = ''; return; }
    const grupos = {};
    let ignoradas = 0;
    rows.forEach(r => {
      const pn = String(r['Material'] || '').trim().toUpperCase();
      const desc = String(r['Description'] || '').trim();
      const p = parseFloat(r['U/Price']);
      const q = parseFloat(r['GR Qty']);
      if (!pn || !esPrekitSAP(desc) || !(p > 0) || !(q > 0)) { ignoradas++; return; }
      const g = grupos[pn] || (grupos[pn] = { pn, desc: desc.replace(/^\*/, '').trim(), precios: [], suma: 0, qty: 0 });
      g.precios.push(p); g.suma += p * q; g.qty += q;
    });
    const precios = await leerPreciosMaster();
    // Solo se proponen los PN que existen en el BOM activo (los demás se ignoran)
    let pnBom = null;
    try {
      const { db, doc, getDoc } = window.fb;
      const bd = await getDoc(doc(db, 'bom_simulator_p4', 'bom_activo'));
      if (bd.exists()) {
        pnBom = new Set();
        JSON.parse(bd.data().bom || '[]').forEach(r => { if (r.pn) pnBom.add(String(r.pn).trim().toUpperCase()); });
      }
    } catch (e) { console.error('No se pudo leer el BOM para filtrar precios', e); }
    let fuera = 0;
    const gruposOk = Object.values(grupos).filter(g => { if (pnBom && !pnBom.has(g.pn)) { fuera++; return false; } return true; });
    const lista = gruposOk.map(g => {
      const prom = Math.round(g.suma / g.qty * 10000) / 10000;
      const unicos = [...new Set(g.precios)];
      const act = precios[g.pn] && precios[g.pn].precio > 0 ? precios[g.pn].precio : null;
      const estado = act === null ? 'nuevo' : Math.abs(act - prom) < 0.00005 ? 'igual' : 'cambia';
      return { ...g, prom, unicos, act, estado, fuente: unicos.length > 1 ? 'SAP_PROM' : 'SAP' };
    }).sort((a, b) => a.pn.localeCompare(b.pn));
    window._preciosPreview = lista;
    const multi = lista.filter(g => g.unicos.length > 1).length;
    const aplicables = lista.filter(g => g.estado !== 'igual');
    st.style.color = '#9aa6b2';
    st.textContent = t('pr_resumen').replace('{n}', lista.length).replace('{m}', multi).replace('{i}', ignoradas) + (fuera ? ' · ' + t('pr_fuera').replace('{o}', fuera) : '');
    const col = e => e === 'nuevo' ? '#2ecc71' : e === 'cambia' ? '#f1c40f' : '#7f8c9a';
    pv.innerHTML = `
      <div style="overflow-x:auto;border:1px solid var(--border);border-radius:8px;padding:6px 10px;max-height:320px;overflow-y:auto">
        <table style="width:100%;border-collapse:collapse;font-size:12px;min-width:760px">
          <thead><tr style="text-align:left;color:#7f8c9a;text-transform:uppercase;font-size:10px">
            <th style="padding:6px 4px">${t('pr_prev_pn')}</th><th>${t('pr_prev_desc')}</th><th>${t('pr_prev_precios')}</th><th style="text-align:right">${t('pr_prev_prom')}</th><th style="text-align:right">${t('pr_prev_actual')}</th><th style="padding-left:10px">${t('pr_prev_estado')}</th></tr></thead>
          <tbody>${lista.map(g => `
            <tr style="border-top:1px solid var(--border)">
              <td style="padding:5px 4px;font-family:monospace;color:var(--accent)">${g.pn}</td>
              <td style="color:#9aa6b2">${g.desc.replace(/</g, '&lt;')}</td>
              <td style="font-family:monospace;color:#9aa6b2">${g.unicos.map(x => x.toFixed(4)).join(' · ')}</td>
              <td style="text-align:right;font-weight:700">$${g.prom.toFixed(4)}</td>
              <td style="text-align:right;color:#9aa6b2">${g.act === null ? '—' : '$' + g.act.toFixed(4)}</td>
              <td style="padding-left:10px;color:${col(g.estado)}">${t('pr_' + g.estado)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn-primary" ${aplicables.length ? '' : 'disabled'} onclick="aplicarPreciosSAP()">${t('pr_btn_aplicar').replace('{n}', aplicables.length)}</button>
        <button class="btn-secondary" onclick="document.getElementById('precios-preview').innerHTML='';window._preciosPreview=null">${t('pr_btn_cancelar')}</button>
      </div>`;
    inputEl.value = '';
  } catch (e) { st.style.color = '#e74c3c'; st.textContent = t('pr_err') + e.message; console.error(e); inputEl.value = ''; }
};

window.aplicarPreciosSAP = async function() {
  const st = document.getElementById('precios-status');
  const lista = (window._preciosPreview || []).filter(g => g.estado !== 'igual');
  if (!lista.length) { alert(t('pr_nada')); return; }
  try {
    const cache = window._preciosCache || {};
    for (const g of lista) await escribirPrecio(g.pn, g.prom, g.fuente, g.desc, cache[g.pn]);
    window._preciosPreview = null;
    document.getElementById('precios-preview').innerHTML = '';
    st.style.color = '#2ecc71'; st.textContent = t('pr_aplicados').replace('{n}', lista.length);
    renderPreciosMaster();
  } catch (e) { st.style.color = '#e74c3c'; st.textContent = t('pr_err') + e.message; console.error(e); }
};

window.descargarPreciosExcel = async function() {
  try {
    const precios = await leerPreciosMaster();
    const data = [[t('th_pr_pn'), t('th_pr_desc'), t('th_pr_precio'), t('th_pr_desde'), t('th_pr_fuente')]];
    Object.values(precios).sort((a, b) => a.pn.localeCompare(b.pn)).forEach(d => data.push([d.pn, d.descripcion || '', d.precio, d.vigente_desde || '', precioFuenteTxt(d.fuente)]));
    const ws = XLSX.utils.aoa_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Precios');
    XLSX.writeFile(wb, 'Master_Precios_ShipQR_' + precioHoyISO() + '.xlsx');
  } catch (e) { alert(t('pr_err') + e.message); console.error(e); }
};

window.agregarModeloManual = function() {
  const input = document.getElementById('nuevo-modelo-input');
  const modelo = (input?.value || '').trim().toUpperCase();
  if (!modelo) { alert('Escribe un modelo'); return; }
  input.value = '';
  const tbody = document.getElementById('empaque-tbody');
  if (tbody && tbody.innerHTML.includes('Sin modelos')) tbody.innerHTML = '';
  const key = claveEmpaque(modelo, '');
  const idSafe = key.replace(/[^A-Z0-9]/g, '_');
  if (document.getElementById(`em-pcs-${idSafe}`)) { alert('Ese modelo ya está en la lista'); return; }

};

window.guardarEmpaqueModelo = async function(modelo, numeroParte) {
  const key = claveEmpaque(modelo, numeroParte);
  const idSafe = key.replace(/[^A-Z0-9]/g, '_');
  const get = id => document.getElementById(id)?.value || '';
  const pcsPorCaja = parseInt(get(`em-pcs-${idSafe}`)) || 0;
  const pesoCajaCompleta = parseFloat(get(`em-peso-${idSafe}`)) || 0;
  const cajasPorPallet = parseInt(get(`em-pallet-${idSafe}`)) || 0;
  if (!pcsPorCaja) { alert('Captura Pcs/caja antes de guardar'); return; }
  try {
    const { db, doc, setDoc } = window.fb;
    await setDoc(doc(db, 'shipqr_empaque_master', key), {
      modelo: (modelo || '').trim().toUpperCase(),
      numeroParte: (numeroParte || '').trim().toUpperCase(),
      descripcionDallas: get(`em-desc-${idSafe}`).trim(),
      tipo: get(`em-tipo-${idSafe}`).trim(),
      fscType: get(`em-fsc-${idSafe}`).trim(),
      rev: get(`em-rev-${idSafe}`).trim() || '0',
      pcsPorCaja, pesoCajaCompleta, cajasPorPallet,
      boxNo: get(`em-boxno-${idSafe}`).trim(),
      dimension: get(`em-dim-${idSafe}`).trim(),
      updated_by: window.currentUser.username, updated_at: new Date().toISOString()
    }, { merge: true });
    window._empaqueCache = {};
  } catch (e) { alert('Error al guardar: ' + e.message); console.error(e); }
};

// Encabezados esperados en el Excel de carga masiva (en este orden)
// Formato oficial (plantilla 07.10.26): pesos en LIBRAS. La carga también acepta los encabezados anteriores en español.
const EMPAQUE_EXCEL_HEADERS = ['Model', 'Part No.', 'Description', 'Type', 'FSC type', 'Rev', 'pc/box', 'weight (lbs)', 'box/pallet', 'Box No.', 'Dimension (in)\nLxWxH'];

window.descargarPlantillaEmpaque = async function() {
  const statusEl = document.getElementById('empaque-excel-status');
  if (statusEl) { statusEl.style.color = '#7f8c9a'; statusEl.textContent = 'Generando plantilla...'; }
  try {
    const { db, doc, getDoc, collection, getDocs } = window.fb;
    const bomDoc = await getDoc(doc(db, 'bom_simulator_p4', 'bom_activo'));
    let modelos = [];
    const partesPorModelo = {};
    if (bomDoc.exists()) {
      const BOM = JSON.parse(bomDoc.data().bom || '[]');
      modelos = [...new Set(BOM.map(r => r.sm).filter(Boolean).map(s => s.trim().toUpperCase()))].sort();
      BOM.forEach(r => {
        if (r.sm && r.pn) {
          const m = r.sm.trim().toUpperCase();
          if (!partesPorModelo[m]) partesPorModelo[m] = r.pn.trim().toUpperCase();
        }
      });
    }
    const masterSnap = await getDocs(collection(db, 'shipqr_empaque_master'));
    const master = {};
    masterSnap.forEach(d => { master[d.id] = d.data(); });

    const wsData = [EMPAQUE_EXCEL_HEADERS];
    if (modelos.length) {
      modelos.forEach(m => {
        const d = master[claveEmpaque(m, '')] || {};
        wsData.push([m, partesPorModelo[m] || '', d.descripcionDallas || '', d.tipo || '', d.fscType || '', d.rev || '0', d.pcsPorCaja || '', d.pesoCajaCompleta || '', d.cajasPorPallet || '', d.boxNo || '', d.dimension || '']);
      });
    } else {
      wsData.push(['SM-EJEMPLO123', 'GH90-67591A', 'Descripción de ejemplo', 'Caja Master', 'FSC Mix', '0', 40, 12.5, 48, 4, '19 3/4 x 14 1/8 x 11 1/4']);
    }

    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols'] = [{wch:20},{wch:16},{wch:26},{wch:14},{wch:12},{wch:8},{wch:10},{wch:14},{wch:12},{wch:9},{wch:26}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Empaque por modelo');
    XLSX.writeFile(wb, 'Plantilla_Empaque_ShipQR.xlsx');
    if (statusEl) { statusEl.style.color = '#2ecc71'; statusEl.textContent = `Plantilla generada con ${modelos.length} modelo(s) del BOM activo.`; }
  } catch (e) {
    if (statusEl) { statusEl.style.color = '#e74c3c'; statusEl.textContent = 'Error generando plantilla: ' + e.message; }
    console.error('Error generando plantilla de empaque:', e);
  }
};

// Quita acentos y normaliza texto para poder emparejar encabezados sin importar mayúsculas/tildes
function normalizarTexto(txt) {
  return (txt || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
}

window.cargarEmpaqueDesdeExcel = async function(inputEl) {
  const statusEl = document.getElementById('empaque-excel-status');
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  statusEl.style.color = '#7f8c9a';
  statusEl.textContent = 'Leyendo archivo...';

  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

    if (!rows.length) { statusEl.style.color = '#e74c3c'; statusEl.textContent = 'El Excel está vacío.'; inputEl.value = ''; return; }

    // Mapea encabezados del archivo (sin importar acentos/mayúsculas) a las claves que usamos internamente
    const mapaClaves = {
      modelo: 'modelo', model: 'modelo',
      'numero de parte': 'numeroParte', 'part no.': 'numeroParte',
      'descripcion dallas': 'descripcionDallas', description: 'descripcionDallas',
      tipo: 'tipo', type: 'tipo',
      'fsc type': 'fscType',
      rev: 'rev',
      'pcs/caja': 'pcsPorCaja', 'pc/box': 'pcsPorCaja',
      'peso caja (kg)': 'pesoCajaCompleta', 'weight (lbs)': 'pesoCajaCompleta', 'peso caja (lb)': 'pesoCajaCompleta',
      'cajas/pallet': 'cajasPorPallet', 'box/pallet': 'cajasPorPallet',
      'box no.': 'boxNo',
      'dimension (in) lxwxh': 'dimension'
    };

    const { db, doc, writeBatch } = window.fb;
    const batch = writeBatch(db);
    let cargados = 0;
    const sinModelo = [];
    const sinPcs = [];

    rows.forEach((fila, idx) => {
      const filaNormalizada = {};
      Object.keys(fila).forEach(k => {
        const claveInterna = mapaClaves[normalizarTexto(k).replace(/\s+/g, ' ')];
        if (claveInterna) filaNormalizada[claveInterna] = fila[k];
      });

      const modelo = (filaNormalizada.modelo || '').toString().trim().toUpperCase();
      if (!modelo) { sinModelo.push(idx + 2); return; } // +2 = compensa encabezado + índice base 1

      const pcsPorCaja = parseInt(filaNormalizada.pcsPorCaja) || 0;
      if (!pcsPorCaja) { sinPcs.push(modelo); return; }

      // La carga masiva siempre guarda el dato GENERAL del modelo (no crea excepciones por número de parte,
      // esa columna en el Excel es solo de referencia)
      batch.set(doc(db, 'shipqr_empaque_master', claveEmpaque(modelo, '')), {
        modelo,
        descripcionDallas: (filaNormalizada.descripcionDallas || '').toString().trim(),
        tipo: (filaNormalizada.tipo || '').toString().trim(),
        fscType: (filaNormalizada.fscType || '').toString().trim(),
        rev: (filaNormalizada.rev || '0').toString().trim(),
        pcsPorCaja,
        pesoCajaCompleta: parseFloat(filaNormalizada.pesoCajaCompleta) || 0,
        cajasPorPallet: parseInt(filaNormalizada.cajasPorPallet) || 0,
        boxNo: (filaNormalizada.boxNo || '').toString().trim(),
        dimension: (filaNormalizada.dimension || '').toString().replace(/\s+/g, ' ').trim(),
        updated_by: window.currentUser.username,
        updated_at: new Date().toISOString()
      }, { merge: true });
      cargados++;
    });

    if (cargados === 0) {
      statusEl.style.color = '#e74c3c';
      statusEl.textContent = 'Ninguna fila válida (revisa que tenga Modelo y Pcs/caja).';
      inputEl.value = '';
      return;
    }

    await batch.commit();
    window._empaqueCache = {};

    let msg = `✅ ${cargados} modelo(s) cargado(s) correctamente.`;
    if (sinModelo.length) msg += ` · Filas sin modelo (ignoradas): ${sinModelo.join(', ')}`;
    if (sinPcs.length) msg += ` · Sin Pcs/caja (ignorados): ${sinPcs.join(', ')}`;
    statusEl.style.color = sinModelo.length || sinPcs.length ? '#f1c40f' : '#2ecc71';
    statusEl.textContent = msg;

    inputEl.value = '';
    renderEmpaqueMaster();
  } catch (e) {
    statusEl.style.color = '#e74c3c';
    statusEl.textContent = 'Error al leer el Excel: ' + e.message;
    inputEl.value = '';
    console.error('Error cargando empaque desde Excel:', e);
  }
};

window._empaqueCache = {};
async function getEmpaqueModelo(modelo, numeroParte) {
  const modeloKey = claveEmpaque(modelo, '');          // llave simple: la misma que se usaba antes (compatible con lo ya guardado)
  const parteKey = claveEmpaque(modelo, numeroParte);  // llave compuesta: solo aplica si hay una excepción para esa parte
  const cacheKey = parteKey;
  if (window._empaqueCache[cacheKey]) return window._empaqueCache[cacheKey];
  try {
    const { db, doc, getDoc } = window.fb;
    let data = null;
    // 1) Si hay número de parte, revisa primero si existe una excepción guardada específicamente para esa parte
    if (parteKey !== modeloKey) {
      const snapParte = await getDoc(doc(db, 'shipqr_empaque_master', parteKey));
      if (snapParte.exists()) data = snapParte.data();
    }
    // 2) Si no hay excepción, usa el dato general guardado para el modelo
    if (!data) {
      const snapModelo = await getDoc(doc(db, 'shipqr_empaque_master', modeloKey));
      if (snapModelo.exists()) data = snapModelo.data();
    }
    window._empaqueCache[cacheKey] = data;
  } catch (e) { console.error('Error consultando empaque maestro', e); window._empaqueCache[cacheKey] = null; }
  return window._empaqueCache[cacheKey];
}

// Calcula el peso REAL de una cantidad de piezas, tomando en cuenta que la ÚLTIMA caja
// puede ser parcial: las cajas completas pesan pesoCajaCompleta cada una; la caja parcial
// pesa proporcional a sus piezas reales (pesoCajaCompleta / pcsPorCaja por pieza).
// Antes se multiplicaba boxQty (redondeado hacia arriba) x pesoCajaCompleta siempre,
// lo que inflaba el peso de cualquier lote/pallet que terminara en caja parcial.
function calcularPesoReal(quantity, pcsPorCaja, pesoCajaCompleta) {
  if (!pcsPorCaja || !pesoCajaCompleta) return 0;
  const qty = quantity || 0;
  const cajasCompletas = Math.floor(qty / pcsPorCaja);
  const piezasUltimaCaja = qty - cajasCompletas * pcsPorCaja;
  const pesoPorPieza = pesoCajaCompleta / pcsPorCaja;
  const peso = cajasCompletas * pesoCajaCompleta + piezasUltimaCaja * pesoPorPieza;
  return Math.round(peso * 100) / 100;
}

async function calcularEmpaque(modelo, quantity, numeroParte) {
  const m = await getEmpaqueModelo(modelo, numeroParte);
  if (!m || !m.pcsPorCaja) {
    return { ok: false, boxQty: 0, peso: 0, palletSugerido: 0, tipo: '', fscType: '', descripcion: '', rev: '', pcsPorCaja: 0 };
  }
  const qty = quantity || 0;
  const boxQty = Math.ceil(qty / m.pcsPorCaja);
  const peso = calcularPesoReal(qty, m.pcsPorCaja, m.pesoCajaCompleta || 0);
  const palletSugerido = m.cajasPorPallet ? Math.ceil(boxQty / m.cajasPorPallet) : 0;
  return {
    ok: true, boxQty, peso, palletSugerido,
    tipo: m.tipo || '', fscType: m.fscType || '', descripcion: m.descripcionDallas || '',
    rev: m.rev || '0', pcsPorCaja: m.pcsPorCaja, cajasPorPallet: m.cajasPorPallet || 0
  };
}

// Divide un lote en sus pallets reales (completos y parciales), con cajas/piezas exactas de cada uno.
// La usan tanto la etiqueta de pallet como la creación de los registros de QC por pallet.
async function calcularPallets(modelo, quantity, numeroParte, motivo) {
  const info = await calcularEmpaque(modelo, quantity, numeroParte);
  // REMPLAZO: cantidades chicas que no siguen el empaque estándar del modelo.
  // No se aplica la lógica de pcs/caja ni cajas/pallet — se usa la cantidad tal cual, en un solo pallet.
  if ((motivo || '').toUpperCase() === 'REMPLAZO') {
    return { pallets: [{ numero: 1, cajas: 0, qty: quantity || 0, parcial: false, boxesTxt: '—' }], info };
  }
  const pcsPorCaja = info.pcsPorCaja || 0;
  const boxQty = info.boxQty || 0;
  const cajasPorPallet = info.cajasPorPallet || 0;
  const totalPallets = info.palletSugerido && info.palletSugerido > 0 ? info.palletSugerido : 1;
  const ultimaCajaPzas = pcsPorCaja && boxQty ? (quantity || 0) - pcsPorCaja * (boxQty - 1) : 0;

  const pallets = [];
  if (pcsPorCaja && boxQty && cajasPorPallet) {
    let qtyRestante = quantity || 0;
    for (let i = 1; i <= totalPallets; i++) {
      const cajaInicioIdx = (i - 1) * cajasPorPallet + 1;
      const cajaFinIdx = Math.min(i * cajasPorPallet, boxQty);
      const cajasEnEstePallet = cajaFinIdx - cajaInicioIdx + 1;
      const qtyEstePallet = Math.min(cajasEnEstePallet * pcsPorCaja, qtyRestante);
      qtyRestante -= qtyEstePallet;
      const esParcial = cajasEnEstePallet < cajasPorPallet || qtyEstePallet < cajasEnEstePallet * pcsPorCaja;

      const incluyeCajaParcial = cajaFinIdx === boxQty && ultimaCajaPzas > 0 && ultimaCajaPzas < pcsPorCaja;
      let boxesTxt;
      if (!incluyeCajaParcial) {
        boxesTxt = `${pcsPorCaja}X${cajasEnEstePallet}`;
      } else {
        const cajasCompletas = cajasEnEstePallet - 1;
        boxesTxt = cajasCompletas > 0
          ? `${pcsPorCaja}X${cajasCompletas} + ${ultimaCajaPzas}X1`
          : `${ultimaCajaPzas}X1`;
      }
      pallets.push({ numero: i, cajas: cajasEnEstePallet, qty: qtyEstePallet, parcial: esParcial, boxesTxt });
    }
  } else {
    // Sin datos de empaque para este modelo: no se puede calcular el desglose real, se deja 1 "pallet" con el total del lote
    pallets.push({ numero: 1, cajas: 0, qty: quantity || 0, parcial: false, boxesTxt: '—' });
  }
  return { pallets, info };
}

window.guardarPalletLote = async function(embId, loteId, valor) {

    await updateDoc(doc(db, 'shipqr_embarques', embId), { [`pallets.${loteId}`]: n });

};

async function loadModelosShipqr() {
  const sel = document.getElementById('cm-bueno');
  if (!sel) return;
  try {
    const { db, doc, getDoc } = window.fb;
    const bomDoc = await getDoc(doc(db, 'bom_simulator_p4', 'bom_activo'));
    if (!bomDoc.exists()) {
      sel.innerHTML = '<option value="">⚠️ Sin BOM activo</option>';
      return;
    }
    const bomData = bomDoc.data();
    const BOM = JSON.parse(bomData.bom || '[]');

    sel.innerHTML = '<option value="">— Seleccionar modelo —</option>' + modelos.map(m => `<option value="${m}">${m}</option>`).join('');
  } catch (e) {
    sel.innerHTML = '<option value="">⚠️ Error cargando BOM</option>';
    console.error('Error cargando modelos del BOM activo:', e);
  }
}

window.previewCorregirModeloShipqr = async function() {
  const malo = (document.getElementById('cm-malo').value || '').trim().toUpperCase();
  const bueno = (document.getElementById('cm-bueno').value || '').trim().toUpperCase();
  const div = document.getElementById('cm-resultado');
  if (!malo || !bueno) { div.innerHTML = '<div style="color:#e74c3c;font-size:12px">❌ Captura ambos modelos</div>'; return; }
  if (malo === bueno) { div.innerHTML = '<div style="color:#e74c3c;font-size:12px">❌ Los modelos son iguales</div>'; return; }
  div.innerHTML = '<div style="color:#7f8c9a;font-size:12px">⏳ Buscando...</div>';
  try {
    const { db, collection, getDocs } = window.fb;
    const snap = await getDocs(collection(db, 'shipqr_lotes'));
    const matches = [];
    snap.forEach(d => {
      const r = d.data();
      if ((r.modelo || '').trim().toUpperCase() === malo) matches.push({ id: d.id, ...r });
    });
    if (!matches.length) {
      div.innerHTML = `<div style="color:#7f8c9a;font-size:12px">Sin lotes con modelo "${malo}"</div>`;
      return;
    }
    div.innerHTML = `
      <div style="padding:10px 12px;background:rgba(241,196,15,.08);border:1px solid rgba(241,196,15,.3);border-radius:8px;line-height:1.6;font-size:12px">
        <b style="color:#f1c40f">⚠️ Vista previa</b><br>
        Se encontraron <b>${matches.length} lotes</b> con modelo "<b style="font-family:monospace">${malo}</b>".<br>
        Se cambiarán a "<b style="font-family:monospace;color:#2ecc71">${bueno}</b>".<br>
        <span style="color:#7f8c9a;font-size:11px;display:block;margin-top:6px">
          Lotes afectados: ${matches.map(m => m.lot_number).join(', ')}<br>
          ⚠️ Esta acción NO se puede deshacer. Haz clic en <b>Ejecutar reemplazo</b> cuando estés seguro.
        </span>
      </div>
    `;
    window._cmShipqrPreview = { malo, bueno, total: matches.length, ids: matches.map(m => m.id) };
  } catch (e) { div.innerHTML = `<div style="color:#e74c3c;font-size:12px">Error: ${e.message}</div>`; }
};

window.ejecutarCorregirModeloShipqr = async function() {
  const div = document.getElementById('cm-resultado');
  if (!window._cmShipqrPreview) { alert('Primero haz "Vista previa"'); return; }
  const { malo, bueno, total, ids } = window._cmShipqrPreview;
  if (!confirm(`¿Reemplazar "${malo}" por "${bueno}" en ${total} lotes?\n\nEsta acción NO se puede deshacer.`)) return;
  div.innerHTML = `<div style="color:#7f8c9a;font-size:12px">⏳ Actualizando ${total} lotes...</div>`;
  try {
    const { db, doc, setDoc } = window.fb;
    let ok = 0, errs = 0;
    for (const id of ids) {
      try {
        await setDoc(doc(db, 'shipqr_lotes', id), { modelo: bueno }, { merge: true });
        ok++;
      } catch (e) { errs++; console.error('Error en', id, e); }
    }
    div.innerHTML = `<div style="padding:10px 12px;background:rgba(46,204,113,.08);border:1px solid rgba(46,204,113,.3);border-radius:8px;color:#2ecc71;font-weight:700;font-size:12px">✅ Reemplazo completado<br><span style="font-size:11px;color:#7f8c9a;font-weight:400">Actualizados: ${ok} · Errores: ${errs}</span></div>`;
    window._cmShipqrPreview = null;
    document.getElementById('cm-malo').value = '';
    document.getElementById('cm-bueno').value = '';
  } catch (e) { div.innerHTML = `<div style="color:#e74c3c;font-size:12px">Error: ${e.message}</div>`; }
};
