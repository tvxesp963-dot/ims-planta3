function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function fmtNum(n) { return (n||0).toLocaleString('es-MX'); }
function folioEmb(e) { return e.packing_list_no || `#${e.id.slice(0,6)} (sin folio)`; }

function statusTag(status) {
  const s = window.SHIPQR_STATUS[status] || { key: null, class: '' };
  return `<span class="tag ${s.class}">${s.key ? t(s.key) : status}</span>`;
}

async function doLogin(username, password) {
  try {
    const { db, doc, getDoc } = window.fb;
    const snap = await getDoc(doc(db, 'shipqr_usuarios', username));
    if (snap.exists()) {
      const u = snap.data();
      if (!u.activo) return 'inactivo';
      if (u.password !== password) return false;
      window.currentUser = { username, role: u.role, nombre: u.nombre };
      sessionStorage.setItem('shipqr_user', JSON.stringify(window.currentUser));
      return true;
    }
  } catch (e) { console.error('Error consultando Firestore, usando respaldo local', e); }

  const u = window.SHIPQR_USERS[username];
  if (!u || u.password !== password) return false;
  window.currentUser = { username, role: u.role, nombre: u.nombre };
  sessionStorage.setItem('shipqr_user', JSON.stringify(window.currentUser));
  return true;
}

function doLogout() {
  window.currentUser = null;
  sessionStorage.removeItem('shipqr_user');
  render();
}

function renderLogin() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const wrap = el(`
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
      <div style="width:100%;max-width:380px">
        <div style="text-align:center;margin-bottom:24px">
          <div style="width:48px;height:48px;background:#4f8ef7;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;margin:0 auto 12px">SQ</div>
          <div style="font-size:24px;font-weight:700">Ship<span style="color:#4f8ef7">QR</span></div>
          <div style="font-size:12px;color:#7f8c9a;margin-top:4px">Sistema de Embarques · Planta 4</div>
        </div>
        <div class="card" style="padding:20px">
          <div style="font-size:11px;color:#7f8c9a;margin-bottom:6px">Usuario</div>
          <input id="li-user" placeholder="usuario" autocomplete="off" style="margin-bottom:14px">
          <div style="font-size:11px;color:#7f8c9a;margin-bottom:6px">Contraseña</div>
          <input id="li-pass" type="password" placeholder="••••••••" style="margin-bottom:16px">
          <button id="li-btn" class="btn-primary" style="width:100%">Iniciar sesión</button>
          <div id="li-err" style="color:#e74c3c;font-size:12px;margin-top:10px;text-align:center"></div>
        </div>
        <div style="text-align:center;font-size:10px;color:#7f8c9a;margin-top:16px;font-family:monospace">ShipQR v2.0 · Planta 4 · Dallas Route</div>
      </div>
    </div>
  `);
  app.appendChild(wrap);
  const doIt = async () => {
    const u = document.getElementById('li-user').value.trim().toLowerCase();
    const p = document.getElementById('li-pass').value;
    const btn = document.getElementById('li-btn');
    btn.disabled = true; btn.textContent = 'Verificando...';
    const result = await doLogin(u, p);
    btn.disabled = false; btn.textContent = 'Iniciar sesión';
    if (result === true) {
      const pending = sessionStorage.getItem('shipqr_pending_hash');
      console.log('[doIt] hash pendiente restaurado:', pending);
      if (pending) {
        sessionStorage.removeItem('shipqr_pending_hash');
        location.hash = pending;
      }
      render();
    }
    else if (result === 'inactivo') { document.getElementById('li-err').textContent = 'Usuario inactivo, contacta al administrador'; }
    else { document.getElementById('li-err').textContent = 'Usuario o contraseña incorrectos'; }
  };
  document.getElementById('li-btn').onclick = doIt;
  document.getElementById('li-pass').onkeydown = (e) => { if (e.key === 'Enter') doIt(); };
}

function topBar(activeKey) {
  const hash = location.hash || '#/';
  const tabs = NAV_TABS.filter(tab => !tab.roles || tab.roles.includes(window.currentUser.role));
  const tabsHtml = tabs.map(tab => {
    const isActive = (tab.key === 'dashboard' && hash === '#/') || hash.startsWith(tab.hash) && tab.hash !== '#/';
    return `<a href="${tab.hash}" style="text-decoration:none;display:flex;align-items:center;gap:6px;padding:10px 14px;font-size:13px;color:${isActive?'#4f8ef7':'#7f8c9a'};border-bottom:2px solid ${isActive?'#4f8ef7':'transparent'}"><span>${tab.icon}</span>${t(tab.labelKey)}</a>`;
  }).join('');
  const langBtn = (code, cc) => `<button class="lang-btn${LANG===code?' active':''}" onclick="setLang('${code}')" title="${cc}" style="background:#1a1d27;border:1px solid #2e3347;border-radius:6px;padding:3px 5px;cursor:pointer;opacity:${LANG===code?'1':'.5'}"><img src="https://flagcdn.com/w40/${cc}.png" width="24" height="17" style="border-radius:2px;display:block" alt="${cc}"></button>`;

  return `
    <div style="background:#1a1d27;border-bottom:1px solid #2e3347">

    </div>
  `;
}

function render() {
  const hash = location.hash || '#/';
  // Montos: al salir de la pantalla o cerrar sesión se vuelve a pedir la contraseña
  if (!window.currentUser || !hash.startsWith('#/montos')) window._moOk = 0;
  if (!window.currentUser) {
    // Guardar parámetros pendientes (ej. desde el MES) para aplicarlos tras el login
    if (hash.includes('?')) {
      console.log('[render] guardando hash pendiente:', hash);
      sessionStorage.setItem('shipqr_pending_hash', hash);
    }
    renderLogin();
    return;
  }

  // Bloquea el acceso directo por URL a pantallas que no le corresponden al rol del usuario
  const tabDestino = NAV_TABS.find(t => hash.startsWith(t.hash) && t.hash !== '#/');
  if (tabDestino && tabDestino.roles && !tabDestino.roles.includes(window.currentUser.role)) {
    alert(`Tu rol (${window.currentUser.role}) no tiene acceso a "${t(tabDestino.labelKey)}".`);
    location.hash = '#/';
    return;
  }

  if (hash.startsWith('#/lote/nuevo')) renderNuevoLote();
  else if (hash.startsWith('#/qc')) renderQC();
  else if (hash.startsWith('#/embarques')) renderEmbarques();
  else if (hash.startsWith('#/recepcion')) renderRecepcion();
  else if (hash.startsWith('#/escanear')) renderEscanear();
  else if (hash.startsWith('#/tv-embarque')) renderTvEmbarque();
  else if (hash.startsWith('#/admin')) renderAdmin();
  else if (hash.startsWith('#/montos')) renderMontos();
  else renderDashboard();
}

window.addEventListener('hashchange', render);
window.addEventListener('firebaseReady', render);

  unsubProdPL = onSnapshot(query(collection(db, 'shipqr_embarques'), where('status', 'in', ['OPEN', 'LOADING'])), (snap) => {

// Aplica los filtros de fecha/hora sobre los lotes crudos guardados en window._prodLotesRaw
// y vuelve a dibujar la tabla. Se llama cada vez que llega un cambio en vivo o el usuario aplica el filtro.
window.aplicarFiltrosProduccion = function() {
  const lotes = window._prodLotesRaw || [];
  const fDesde = document.getElementById('prod-f-fecha-desde')?.value || '';
  const fHasta = document.getElementById('prod-f-fecha-hasta')?.value || '';
  const hDesde = document.getElementById('prod-f-hora-desde')?.value || '';
  const hHasta = document.getElementById('prod-f-hora-hasta')?.value || '';
  const estatus = document.getElementById('prod-f-status')?.value || '';

  const filtrados = lotes.filter(l => {
    if (estatus && l.status !== estatus) return false;
    if (!l.created_at) return !(fDesde || fHasta || hDesde || hHasta);
    const dt = new Date(l.created_at.seconds * 1000);
    const fechaStr = dt.toISOString().slice(0, 10);
    if (fDesde && fechaStr < fDesde) return false;
    if (fHasta && fechaStr > fHasta) return false;
    if (hDesde || hHasta) {
      const horaStr = dt.toTimeString().slice(0, 5);
      if (hDesde && horaStr < hDesde) return false;
      if (hHasta && horaStr > hHasta) return false;
    }
    return true;
  });
  pintarProduccion(filtrados);
};

window.limpiarFiltrosProduccion = function() {
  ['prod-f-fecha-desde', 'prod-f-fecha-hasta', 'prod-f-hora-desde', 'prod-f-hora-hasta', 'prod-f-status'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  aplicarFiltrosProduccion();
};

async function calcularNumeroLote() {
  const hoy = new Date();
  const fechaStr = `${hoy.getFullYear()}${String(hoy.getMonth()+1).padStart(2,'0')}${String(hoy.getDate()).padStart(2,'0')}`;
  const { db, collection, getDocs } = window.fb;
  let maxConsecutivo = 0;
  try {
    const snap = await getDocs(collection(db, 'shipqr_lotes'));
    snap.forEach(doc => {
      const ln = doc.id;
      if (ln.startsWith(fechaStr + '-')) {
        const num = parseInt(ln.split('-')[1]);
        if (!isNaN(num) && num > maxConsecutivo) maxConsecutivo = num;
      }
    });
  } catch (e) { console.error('Error calculando consecutivo de lote', e); }
  return `${fechaStr}-${String(maxConsecutivo + 1).padStart(2, '0')}`;
}

async function crearLote() {
  const lot_number = document.getElementById('nl-lot').value.trim().toUpperCase();
  const modelo = document.getElementById('nl-modelo').value.trim().toUpperCase();
  const part_number = document.getElementById('nl-pn').value.trim().toUpperCase();
  const quantity = parseInt(document.getElementById('nl-qty').value) || 0;
  const destination = document.getElementById('nl-dest').value.trim().toUpperCase() || 'DALLAS';
  const description = document.getElementById('nl-desc').value.trim().toUpperCase();
  const motivo = (document.getElementById('nl-motivo')?.value || 'PLAN').toUpperCase();
  const errEl = document.getElementById('nl-err');
  errEl.textContent = '';

  if (!lot_number || !part_number || !quantity) {
    errEl.textContent = 'Completa lote, part number y cantidad'; return;
  }

  const resultado = await crearLoteConDatos({ lot_number, modelo, part_number, quantity, destination, description, motivo });
  if (!resultado.ok) { errEl.textContent = resultado.error; return; }

  mostrarResultadoQR(resultado.lot_number, resultado.qrData);
  document.getElementById('nl-lot').value = '';
  document.getElementById('nl-modelo').value = '';
  document.getElementById('nl-pn').value = '';
  document.getElementById('nl-qty').value = '';
  document.getElementById('nl-desc').value = '';
}

async function crearLoteConDatos({ lot_number, modelo, part_number, quantity, destination, description, motivo }) {
  motivo = (motivo || 'PLAN').toUpperCase();
  const { db, doc, getDoc, setDoc, writeBatch, serverTimestamp } = window.fb;
  const ref = doc(db, 'shipqr_lotes', lot_number);
  const existing = await getDoc(ref);
  if (existing.exists()) return { ok: false, error: 'Ese número de lote ya existe' };

  const qrData = JSON.stringify({ lot: lot_number, mod: modelo, pn: part_number, qty: quantity, dest: destination });

  await setDoc(ref, {
    lot_number, modelo, part_number, quantity, destination, description: description || '', motivo,
    status: 'QC_PENDING', qr_data: qrData,
    created_by: window.currentUser.username, created_at: serverTimestamp(), updated_at: serverTimestamp()
  });

  // Calidad libera pallet por pallet, no el lote completo: se crea un registro individual por cada pallet
  // (completo o parcial) que le corresponde a este lote, calculado con los datos de Empaque por modelo
  const { pallets } = await calcularPallets(modelo, quantity, part_number, motivo);
  const palletIds = [];
  const batch = writeBatch(db);
  pallets.forEach(p => {
    const palletId = `${lot_number}-P${p.numero}`;
    palletIds.push(palletId);
    const palletQr = JSON.stringify({ lot: lot_number, pallet: p.numero, mod: modelo, pn: part_number, qty: p.qty, dest: destination });
    batch.set(doc(db, 'shipqr_pallets', palletId), {
      lot_number, pallet_numero: p.numero, total_pallets: pallets.length,
      modelo, part_number, destination, description: description || '', motivo,
      cajas: p.cajas, quantity: p.qty, parcial: p.parcial, boxes_txt: p.boxesTxt,
      status: 'QC_PENDING', qr_data: palletQr,
      etiqueta_impresa: false, etiqueta_impresa_at: null,
      created_at: serverTimestamp(), updated_at: serverTimestamp()
    });
  });
  await batch.commit();

  // El PL se va formando solo: si hay un embarque activo (OPEN/LOADING), los pallets nuevos entran automático a su lista
  await agregarPalletsAEmbarqueActivoSiExiste(palletIds);

  return { ok: true, lot_number, qrData };
}

// Devuelve el embarque OPEN/LOADING más reciente, o crea uno nuevo automático si no hay ninguno.
// Así el PL se va formando solo desde el primer pallet aprobado, sin necesitar el botón "+ Nuevo".
async function obtenerOCrearEmbarqueActivo() {
  const { db, collection, query, where, getDocs, addDoc, serverTimestamp } = window.fb;
  const q = query(collection(db, 'shipqr_embarques'), where('status', 'in', ['OPEN', 'LOADING']));
  const snap = await getDocs(q);
  if (!snap.empty) {
    return snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.created_at?.toMillis?.() || 0) - (a.created_at?.toMillis?.() || 0))[0];
  }
  // El folio del Packing List NO se asigna aquí: se genera solo hasta que QC haya revisado todos sus pallets
  const ref = await addDoc(collection(db, 'shipqr_embarques'), {
    destino: 'DALLAS', anden: '', trailer: '', hora_cierre: '', carrier: '', seal: '', eta: '',
    packing_list_no: '', prepared_by: window.currentUser?.nombre || window.currentUser?.username || '',
    status: 'OPEN', lotes: [], pallets: {},
    created_by: window.currentUser?.username || 'sistema', created_at: serverTimestamp(), closed_at: null
  });
  return { id: ref.id, destino: 'DALLAS', lotes: [] };
}

// Busca (o crea) el embarque activo y le agrega los pallets, sin necesitar click manual.
async function agregarPalletsAEmbarqueActivoSiExiste(palletIds) {
  try {
    const { db, doc, getDoc, updateDoc } = window.fb;
    const emb = await obtenerOCrearEmbarqueActivo();
    const embRef = doc(db, 'shipqr_embarques', emb.id);
    const embSnap = await getDoc(embRef);
    const actuales = embSnap.data()?.lotes || []; // el campo se llama "lotes" por compatibilidad, pero ahora guarda IDs de pallet
    palletIds.forEach(id => { if (!actuales.includes(id)) actuales.push(id); });
    await updateDoc(embRef, { lotes: actuales });
  } catch (e) { console.error('Error auto-agregando pallets al embarque activo:', e); }
}

// Corrige el motivo (PLAN / REMPLAZO) de un lote ya creado, junto con todos sus pallets.
// Útil para lotes capturados ANTES de que existiera esta distinción, o si se marcó mal.
window.toggleMotivoLote = async function(lotNumber) {
  try {
    const { db, doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs, writeBatch } = window.fb;
    const loteRef = doc(db, 'shipqr_lotes', lotNumber);
    const loteSnap = await getDoc(loteRef);
    if (!loteSnap.exists()) { alert('No se encontró el lote ' + lotNumber); return; }
    const l = loteSnap.data();
    const motivoActual = (l.motivo || 'PLAN').toUpperCase();
    const nuevoMotivo = motivoActual === 'REMPLAZO' ? 'PLAN' : 'REMPLAZO';

    if (!confirm(`Lote ${lotNumber}\n\nMotivo actual: ${motivoActual}\nCambiar a: ${nuevoMotivo}\n\n${nuevoMotivo === 'REMPLAZO' ? 'Este lote dejará de contarse como avance del plan de producción.' : 'Este lote volverá a contarse como producción normal (Plan).'}\n\n¿Continuar?`)) return;

    await setDoc(loteRef, { motivo: nuevoMotivo }, { merge: true });

    const palletsSnap = await getDocs(query(collection(db, 'shipqr_pallets'), where('lot_number', '==', lotNumber)));
    const batch = writeBatch(db);
    palletsSnap.forEach(d => batch.update(doc(db, 'shipqr_pallets', d.id), { motivo: nuevoMotivo }));
    await batch.commit();

    alert(`Listo. El lote ${lotNumber} y sus ${palletsSnap.size} pallet(s) ahora son: ${nuevoMotivo}.`);
    aplicarFiltrosProduccion();
  } catch (e) {
    alert('Error al cambiar el motivo del lote: ' + e.message);
    console.error('Error en toggleMotivoLote:', e);
  }
};


// Actualiza SOLO los datos de empaque (Pcs/Caja, Cajas, texto de cajas) de los pallets
// que YA EXISTEN de un lote, usando los datos actuales de Empaque por modelo.
// A diferencia de recalcularPalletsLote(), esta NO borra los pallets ni toca su status
// (QC_APPROVED / READY_TO_SHIP / SHIPPED se quedan igual), ni su asignación a un embarque.
// Úsala cuando el Pre-PL/PL muestra 0 en Cajas/Peso porque Empaque se corrigió DESPUÉS
// de que el lote ya se creó (o ya está listo para embarque) y no quieres perder ese avance.
window.actualizarEmpaquePalletsLote = async function(lotNumber) {
  if (!confirm(`Esto actualiza Pcs/Caja, Cajas y Peso del lote ${lotNumber} con los datos actuales de Empaque.\n\nNO se toca el status de QC ni el embarque al que ya esté asignado.\n\n¿Continuar?`)) return;
  try {
    const { db, doc, collection, query, where, getDocs, writeBatch, serverTimestamp } = window.fb;
    window._empaqueCache = {}; // refresca la caché por si Empaque se acaba de corregir

    const palletsSnap = await getDocs(query(collection(db, 'shipqr_pallets'), where('lot_number', '==', lotNumber)));
    if (palletsSnap.empty) { alert('No se encontraron pallets para el lote ' + lotNumber); return; }

    const batch = writeBatch(db);
    let actualizados = 0, sinDatos = 0;

    for (const d of palletsSnap.docs) {
      const p = d.data();
      const info = await calcularEmpaque(p.modelo, p.quantity, p.part_number);
      if (!info.ok) { sinDatos++; continue; } // Empaque sigue sin Pcs/caja para este modelo, no hay nada que calcular

      const pcsPorCaja = info.pcsPorCaja;
      const cajas = Math.ceil((p.quantity || 0) / pcsPorCaja);
      const ultimaCajaPzas = (p.quantity || 0) - pcsPorCaja * (cajas - 1);
      const boxesTxt = (ultimaCajaPzas > 0 && ultimaCajaPzas < pcsPorCaja && cajas > 1)
        ? `${pcsPorCaja}X${cajas - 1} + ${ultimaCajaPzas}X1`
        : `${pcsPorCaja}X${cajas}`;

      // Solo se tocan cajas y boxes_txt. NO se toca: status, qr_data, motivo, quantity, etiqueta_impresa.
      batch.update(doc(db, 'shipqr_pallets', d.id), { cajas, boxes_txt: boxesTxt, updated_at: serverTimestamp() });
      actualizados++;
    }

    if (!actualizados) { alert('Ningún pallet se pudo actualizar. Revisa que Empaque tenga Pcs/caja capturado para este modelo/parte.'); return; }
    await batch.commit();
    alert(`Listo. Se actualizaron ${actualizados} pallet(s) del lote ${lotNumber}.${sinDatos ? ` (${sinDatos} sin datos de Empaque todavía)` : ''}\n\nEl status de QC/Embarque no se tocó — genera de nuevo el Pre-PL/PL para ver los números correctos.`);
  } catch (e) {
    alert('Error al actualizar empaque de pallets: ' + e.message);
    console.error('Error en actualizarEmpaquePalletsLote:', e);
  }
};

// Útil si el lote se creó antes de guardar/corregir Pcs/caja y Cajas/pallet para ese modelo.
// Borra los pallets anteriores (y su avance de QC) y los crea de nuevo desde cero.
window.recalcularPalletsLote = async function(lotNumber) {
  if (!confirm(`Esto vuelve a calcular los pallets del lote ${lotNumber} con los datos actuales de Empaque por modelo.\n\nSe borra el avance de QC que ya tuvieran esos pallets (quedan en Pendiente otra vez).\n\n¿Continuar?`)) return;
  try {
    const { db, doc, getDoc, collection, query, where, getDocs, writeBatch, serverTimestamp } = window.fb;
    const loteSnap = await getDoc(doc(db, 'shipqr_lotes', lotNumber));
    if (!loteSnap.exists()) { alert('No se encontró el lote ' + lotNumber); return; }
    const l = loteSnap.data();

    // Refresca la caché de Empaque por modelo por si se acaba de guardar/corregir
    window._empaqueCache = {};

    const viejosSnap = await getDocs(query(collection(db, 'shipqr_pallets'), where('lot_number', '==', lotNumber)));
    const batch = writeBatch(db);
    viejosSnap.forEach(d => batch.delete(doc(db, 'shipqr_pallets', d.id)));

    const { pallets } = await calcularPallets(l.modelo, l.quantity, l.part_number, l.motivo);
    const palletIds = [];
    pallets.forEach(p => {
      const palletId = `${lotNumber}-P${p.numero}`;
      palletIds.push(palletId);
      const palletQr = JSON.stringify({ lot: lotNumber, pallet: p.numero, mod: l.modelo, pn: l.part_number, qty: p.qty, dest: l.destination });
      batch.set(doc(db, 'shipqr_pallets', palletId), {
        lot_number: lotNumber, pallet_numero: p.numero, total_pallets: pallets.length,
        modelo: l.modelo, part_number: l.part_number, destination: l.destination, description: l.description || '', motivo: (l.motivo || 'PLAN'),
        cajas: p.cajas, quantity: p.qty, parcial: p.parcial, boxes_txt: p.boxesTxt,
        status: 'QC_PENDING', qr_data: palletQr,
        etiqueta_impresa: false, etiqueta_impresa_at: null,
        created_at: serverTimestamp(), updated_at: serverTimestamp()
      });
    });
    await batch.commit();
    await agregarPalletsAEmbarqueActivoSiExiste(palletIds);
    await actualizarEstadoLotePorPallets(lotNumber);

    alert(`Listo. Se recalcularon ${pallets.length} pallet(s) para el lote ${lotNumber}.`);
  } catch (e) {
    alert('Error al recalcular pallets: ' + e.message);
    console.error('Error en recalcularPalletsLote:', e);
  }
};

// ── ENVIADOS POR MODELO ──

// No escribe nada en Firestore y no modifica lotes, pallets ni embarques.
window.abrirEnviadosPorModelo = function() {
  // Se muestra dentro de la pantalla de Producción (contenedor #env-card), no como ventana flotante
  const host = document.getElementById('env-card');
  if (!host) return;
  if (host.firstChild) { host.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const loc = LANG === 'ko' ? 'ko-KR' : (LANG === 'en' ? 'en-US' : 'es-MX');
  const fmtFechaHora = d => d.toLocaleString(loc, { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

  const hoy = new Date();
  const hace6 = new Date(); hace6.setDate(hace6.getDate() - 6);

  // Sugerencias del buscador: modelos y part numbers que ya existen en los lotes cargados
  const sugerencias = [...new Set((window._prodLotesRaw || []).flatMap(l => [l.modelo, l.part_number]).filter(Boolean))];
  const opciones = sugerencias.map(s => `<option value="${esc(s)}"></option>`).join('');

  const m = el(`
    <div id="env-modal">
      <div class="card" style="border:1px solid var(--accent)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:16px;font-weight:700;color:var(--accent)">${t('env_titulo')}</span>
          <button class="btn-secondary" style="padding:4px 9px;font-size:14px" onclick="document.getElementById('env-card').innerHTML=''">✕</button>
        </div>
        <div style="font-size:12px;color:#7f8c9a;margin-bottom:12px">${t('env_desc')}</div>

        <div style="font-size:11px;color:#7f8c9a;margin-bottom:4px">${t('env_modelo')}</div>
        <input id="env-modelo" list="env-sugerencias" placeholder="${t('env_ph')}" autocomplete="off" style="margin-bottom:6px;font-family:monospace">
        <datalist id="env-sugerencias">${opciones}</datalist>
        <div style="font-size:11px;color:#7f8c9a;margin-bottom:12px">${t('env_todos')}</div>

        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
          <button class="btn-secondary" style="padding:6px 12px;font-size:12px" id="env-q-hoy">${t('env_hoy')}</button>
          <button class="btn-secondary" style="padding:6px 12px;font-size:12px" id="env-q-ayer">${t('env_ayer')}</button>
          <button class="btn-secondary" style="padding:6px 12px;font-size:12px" id="env-q-7d">${t('env_7d')}</button>
          <button class="btn-secondary" style="padding:6px 12px;font-size:12px" id="env-q-mes">${t('env_mes')}</button>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px">
          <div><div style="font-size:11px;color:#7f8c9a;margin-bottom:4px">${t('fecha_desde')}</div><input id="env-d1" type="date" value="${ymd(hace6)}" style="width:150px"></div>
          <div><div style="font-size:11px;color:#7f8c9a;margin-bottom:4px">${t('fecha_hasta')}</div><input id="env-d2" type="date" value="${ymd(hoy)}" style="width:150px"></div>
          <div><div style="font-size:11px;color:#7f8c9a;margin-bottom:4px">${t('hora_desde')}</div><input id="env-h1" type="time" style="width:120px"></div>
          <div><div style="font-size:11px;color:#7f8c9a;margin-bottom:4px">${t('hora_hasta')}</div><input id="env-h2" type="time" style="width:120px"></div>
          <button id="env-buscar" class="btn-primary" style="padding:8px 18px">${t('env_buscar')}</button>
          <button id="env-limpiar" class="btn-secondary" style="padding:8px 14px">${t('env_limpiar')}</button>
        </div>

        <div id="env-res"></div>
        <div style="font-size:11px;color:#7f8c9a;margin-top:12px">${t('env_nota')}</div>
      </div>
    </div>
  `);
  host.appendChild(m);
  host.scrollIntoView({ behavior: 'smooth', block: 'start' });

  let ultimoDetalle = [];

  let ultimoResumen = [], ultimoProc = [];

  const descargarExcel = async () => {
    try {
      const wb = new ExcelJS.Workbook();
      const estilo = ws => {
        const h = ws.getRow(1);
        h.font = { bold: true, color: { argb: 'FFFFFFFF' } };
        h.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F3A6B' } };
        ws.views = [{ state: 'frozen', ySplit: 1 }];
      };
      // Hoja 1: resumen por embarque
      const w1 = wb.addWorksheet(t('env_det').slice(0, 30));
      w1.columns = [
        { header: t('env_th_emb'), key: 'pl', width: 18 }, { header: t('env_th_cierre'), key: 'cierre', width: 20 },
        { header: t('env_th_dest'), key: 'dest', width: 14 }, { header: t('env_th_lotes'), key: 'lotes', width: 9 },
        { header: t('env_th_pallets'), key: 'pallets', width: 9 }, { header: t('env_th_piezas'), key: 'qty', width: 12 }
      ];
      ultimoResumen.forEach(f => w1.addRow({ pl: f.folio, cierre: fmtFechaHora(f.cierre), dest: f.destino, lotes: f.lotes, pallets: f.pallets, qty: f.qty }));
      const tot = w1.addRow({ pl: t('env_total'), lotes: ultimoResumen.reduce((s, f) => s + f.lotes, 0), pallets: ultimoResumen.reduce((s, f) => s + f.pallets, 0), qty: ultimoResumen.reduce((s, f) => s + f.qty, 0) });
      tot.font = { bold: true };
      estilo(w1);
      // Hoja 2: detalle por pallet enviado
      const w2 = wb.addWorksheet('Pallets');
      w2.columns = [
        { header: t('env_th_emb'), key: 'folio', width: 18 }, { header: t('env_th_cierre'), key: 'cierre', width: 20 },
        { header: t('env_th_dest'), key: 'destino', width: 14 }, { header: t('th_modelo'), key: 'modelo', width: 24 },
        { header: 'Part No.', key: 'part', width: 16 }, { header: t('th_lote'), key: 'lote', width: 14 },
        { header: 'Pallet', key: 'pallet', width: 18 }, { header: t('env_th_piezas'), key: 'qty', width: 12 }
      ];
      ultimoDetalle.forEach(r => w2.addRow(r));
      estilo(w2);
      // Hoja 3: pallets en proceso
      const w3 = wb.addWorksheet(t('env_k_proc').slice(0, 30));
      w3.columns = [
        { header: t('th_lote'), key: 'lote', width: 14 }, { header: t('th_modelo'), key: 'modelo', width: 24 },
        { header: t('lbl_estado'), key: 'estado', width: 18 }, { header: t('env_th_pallets'), key: 'pallets', width: 9 },
        { header: t('env_th_piezas'), key: 'qty', width: 12 }, { header: t('env_th_pl_asig'), key: 'pl', width: 18 }
      ];
      ultimoProc.forEach(f => w3.addRow({ lote: f.lote, modelo: f.modelo, estado: (window.SHIPQR_STATUS[f.status] ? t(window.SHIPQR_STATUS[f.status].key) : f.status), pallets: f.pallets, qty: f.qty, pl: f.pl || '' }));
      estilo(w3);

      const buffer = await wb.xlsx.writeBuffer();
      const url = URL.createObjectURL(new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      const a = document.createElement('a');
      a.href = url; a.download = `enviados_por_modelo_${ymd(new Date())}.xlsx`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) { alert(t('env_err') + e.message); console.error(e); }
  };

  const buscar = async () => {
    const out = m.querySelector('#env-res');
    const d1 = m.querySelector('#env-d1').value, d2 = m.querySelector('#env-d2').value;
    const h1 = m.querySelector('#env-h1').value, h2 = m.querySelector('#env-h2').value;
    if (!d1 || !d2) return;
    const desde = new Date(`${d1}T${h1 || '00:00'}:00`);
    const hasta = new Date(`${d2}T${h2 || '23:59'}:59`);
    const txt = m.querySelector('#env-modelo').value.trim().toUpperCase();
    out.innerHTML = `<div style="padding:16px;text-align:center;color:#7f8c9a">${t('env_buscando')}</div>`;
    try {
      const { db, collection, query, where, getDocs, documentId } = window.fb;

      // 1) Embarques cerrados dentro del rango (el filtro de fecha se hace aquí, sin necesitar índices nuevos)
      const embSnap = await getDocs(query(collection(db, 'shipqr_embarques'), where('status', '==', 'CLOSED')));
      const embs = [];
      embSnap.forEach(d => {
        const e = { id: d.id, ...d.data() };
        const c = e.closed_at && e.closed_at.toDate ? e.closed_at.toDate() : null;
        if (c && c >= desde && c <= hasta) { e._cierre = c; embs.push(e); }
      });
      embs.sort((a, b) => b._cierre - a._cierre);

      // 2) Pallets de esos embarques (en bloques de 30, límite de Firestore para "in")
      const ids = [...new Set(embs.flatMap(e => e.lotes || []))];
      const pallets = {};
      for (let i = 0; i < ids.length; i += 30) {
        const snap = await getDocs(query(collection(db, 'shipqr_pallets'), where(documentId(), 'in', ids.slice(i, i + 30))));
        snap.forEach(d => { pallets[d.id] = { id: d.id, ...d.data() }; });
      }
      const coincide = p => !txt || String(p.modelo || '').toUpperCase().includes(txt) || String(p.part_number || '').toUpperCase().includes(txt);

      // 3) Totales: solo pallets ya cargados (SHIPPED) que coinciden con el modelo buscado
      const filas = [], detalle = [], porModelo = {};
      let totQty = 0, totPallets = 0;
      const lotesTot = new Set();
      embs.forEach(e => {
        const pls = (e.lotes || []).map(id => pallets[id]).filter(p => p && p.status === 'SHIPPED' && coincide(p));
        if (!pls.length) return;
        const qty = pls.reduce((s, p) => s + (p.quantity || 0), 0);
        const lotes = new Set(pls.map(p => p.lot_number));
        lotes.forEach(l => lotesTot.add(l));
        totQty += qty; totPallets += pls.length;
        filas.push({ folio: folioEmb(e), cierre: e._cierre, destino: e.destino || '', lotes: lotes.size, pallets: pls.length, qty });
        pls.forEach(p => {
          const k = `${p.modelo || ''}|${p.part_number || ''}`;
          if (!porModelo[k]) porModelo[k] = { modelo: p.modelo || '', part: p.part_number || '', qty: 0 };
          porModelo[k].qty += (p.quantity || 0);
          detalle.push({ folio: folioEmb(e), cierre: fmtFechaHora(e._cierre), destino: e.destino || '', modelo: p.modelo || '', part: p.part_number || '', lote: p.lot_number || '', pallet: p.id, qty: p.quantity || 0 });
        });
      });
      ultimoDetalle = detalle; ultimoResumen = filas;

      // 4) En proceso: pallets del modelo que todavía no se embarcan (QC pendiente/aprobado/rechazado o listo), sin importar el rango
      const procSnap = await getDocs(query(collection(db, 'shipqr_pallets'), where('status', 'in', ['QC_PENDING', 'QC_APPROVED', 'QC_REJECTED', 'READY_TO_SHIP'])));
      // Si el pallet ya está asignado a un embarque activo (abierto o cargando), se muestra su No. de PL
      const activasSnap = await getDocs(query(collection(db, 'shipqr_embarques'), where('status', 'in', ['OPEN', 'LOADING'])));
      const plDePallet = {};
      activasSnap.forEach(d => { const e = { id: d.id, ...d.data() }; (e.lotes || []).forEach(pid => { plDePallet[pid] = e.packing_list_no || ''; }); });
      const proc = {};
      let procQty = 0, procPallets = 0, listoQty = 0;
      procSnap.forEach(d => {
        const p = d.data();
        if (!coincide(p)) return;
        const q = p.quantity || 0;
        procQty += q; procPallets++;
        if (p.status === 'READY_TO_SHIP') listoQty += q;
        const k = `${p.lot_number}|${p.status}`;
        if (!proc[k]) proc[k] = { lote: p.lot_number || '', modelo: p.modelo || '', status: p.status, pallets: 0, qty: 0, pl: '' };
        proc[k].pallets++; proc[k].qty += q;
        if (!proc[k].pl && plDePallet[d.id]) proc[k].pl = plDePallet[d.id];
      });
      const procFilas = Object.values(proc).sort((a, b) => String(b.lote).localeCompare(String(a.lote)));
      ultimoProc = procFilas;

      if (!filas.length && !procQty) {
        out.innerHTML = `<div style="padding:20px;text-align:center;color:#7f8c9a">${t('env_vacio')}</div>`;
        return;
      }

      const kpi = (titulo, valor, sub, color) => `
        <div class="card" style="flex:1 1 170px;padding:12px;border:1px solid ${color || 'var(--border)'}">
          <div style="font-size:10px;color:#7f8c9a;text-transform:uppercase;letter-spacing:.5px">${titulo}</div>
          <div style="font-size:28px;font-weight:800;color:${color || 'inherit'}">${valor}</div>
          <div style="font-size:11px;color:#7f8c9a">${sub}</div>
        </div>`;
      const ultimo = filas[0];

      const th = (txt, right) => `<th style="padding:8px 6px;${right ? 'text-align:right' : ''}">${txt}</th>`;
      const tabla = filas.length ? `

// ── ENVIADOS POR MODELO EN EL DASHBOARD ──
// Sección de SOLO LECTURA al final del Dashboard: piezas enviadas por modelo en un rango de fechas.
// Por defecto arranca desde el día del primer envío (primer embarque cerrado con pallets cargados) hasta hoy.
// Consulta una sola vez los embarques cerrados y los pallets SHIPPED; al cambiar fechas solo recalcula en pantalla.
window._envDashCache = null;
window._envDashSel = null;

window.pintarEnviadosDashboard = async function(forzar) {
  const host = document.getElementById('dash-env-model');
  if (!host) return;
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const loc = LANG === 'ko' ? 'ko-KR' : (LANG === 'en' ? 'en-US' : 'es-MX');
  const fmtDia = d => d.toLocaleDateString(loc, { day: '2-digit', month: '2-digit', year: 'numeric' });

  host.innerHTML = `<div style="padding:12px;color:#7f8c9a;font-size:12px">${t('env_buscando')}</div>`;
  try {
    // 1) Carga (cache de 10 min para no repetir lecturas a Firebase cada vez que se abre el Dashboard)
    const cache = window._envDashCache;
    if (!cache || forzar || (Date.now() - cache.at) > 600000) {
      const { db, collection, query, where, getDocs } = window.fb;
      const [embSnap, palSnap] = await Promise.all([
        getDocs(query(collection(db, 'shipqr_embarques'), where('status', '==', 'CLOSED'))),
        getDocs(query(collection(db, 'shipqr_pallets'), where('status', '==', 'SHIPPED')))
      ]);
      const pallets = {};
      palSnap.forEach(d => { pallets[d.id] = d.data(); });
      const embs = [];
      embSnap.forEach(d => {
        const e = d.data();
        const cierre = e.closed_at && e.closed_at.toDate ? e.closed_at.toDate() : null;
        if (cierre) embs.push({ id: d.id, lotes: e.lotes || [], cierre });
      });
      window._envDashCache = { at: Date.now(), pallets, embs };
    }
    const { pallets, embs } = window._envDashCache;

    // 2) Primer envío = cierre más antiguo entre embarques que sí tienen pallets cargados
    let primero = null;
    embs.forEach(e => {
      if (!e.lotes.some(id => pallets[id])) return;
      if (!primero || e.cierre < primero) primero = e.cierre;
    });
    if (!primero) {
      host.innerHTML = `<div class="card"><div style="font-size:14px;font-weight:700;margin-bottom:8px">${t('dash_env_t')}</div><div style="padding:16px;text-align:center;color:#7f8c9a">${t('env_vacio')}</div></div>`;
      return;
    }
    const hoy = new Date();
    const sel = window._envDashSel || (window._envDashSel = { d1: ymd(primero), d2: ymd(hoy) });

    // 3) Totales por modelo dentro del rango elegido
    const desde = new Date(`${sel.d1}T00:00:00`);
    const hasta = new Date(`${sel.d2}T23:59:59`);
    const por = {}, visto = new Set(), embsUsados = new Set();
    let totQty = 0, totPal = 0;
    embs.forEach(e => {
      if (e.cierre < desde || e.cierre > hasta) return;
      e.lotes.forEach(id => {
        const p = pallets[id];
        if (!p || visto.has(id)) return;
        visto.add(id);
        const k = p.modelo || '—';
        if (!por[k]) por[k] = { modelo: k, parts: new Set(), qty: 0, pallets: 0, embs: new Set() };
        por[k].qty += (p.quantity || 0); por[k].pallets++; por[k].embs.add(e.id);
        if (p.part_number) por[k].parts.add(p.part_number);
        totQty += (p.quantity || 0); totPal++; embsUsados.add(e.id);
      });
    });
    const modelos = Object.values(por).sort((a, b) => b.qty - a.qty);
    const maxQty = modelos.length ? modelos[0].qty : 1;

    const kpi = (titulo, valor, color) => `
      <div style="flex:1 1 130px;padding:10px 12px;border:1px solid ${color || 'var(--border)'};border-radius:8px;background:var(--card2, #1a1f2e)">
        <div style="font-size:10px;color:#7f8c9a;text-transform:uppercase;letter-spacing:.5px">${titulo}</div>
        <div style="font-size:24px;font-weight:800;color:${color || 'inherit'}">${valor}</div>
      </div>`;

    host.innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px">
          <span style="font-size:14px;font-weight:700">${t('dash_env_t')}</span>
          <span style="font-size:11px;color:#7f8c9a">${t('dash_env_inicio')}: ${fmtDia(primero)}</span>
        </div>
        <div style="font-size:11px;color:#7f8c9a;margin-bottom:10px">${t('dash_env_nota')}</div>

        <div class="ctrl" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px">
          <div><div style="font-size:11px;color:#7f8c9a;margin-bottom:4px">${t('fecha_desde')}</div><input id="envd-d1" type="date" value="${sel.d1}" style="width:150px"></div>
          <div><div style="font-size:11px;color:#7f8c9a;margin-bottom:4px">${t('fecha_hasta')}</div><input id="envd-d2" type="date" value="${sel.d2}" style="width:150px"></div>
          <button id="envd-buscar" class="btn-primary" style="padding:8px 16px">${t('env_buscar')}</button>
          <button id="envd-inicio" class="btn-secondary" style="padding:8px 12px;font-size:12px">${t('dash_env_inicio')}</button>
          <button id="envd-refrescar" class="btn-secondary" style="padding:6px 10px;font-size:14px" title="↻">↻</button>
          <button id="envd-excel" class="btn-secondary" style="padding:8px 12px;font-size:12px">${t('env_csv')}</button>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
          ${kpi(t('env_k_piezas'), fmtNum(totQty), '#2ecc71')}
          ${kpi(t('env_k_emb'), fmtNum(embsUsados.size))}
          ${kpi(t('env_th_pallets'), fmtNum(totPal))}
          ${kpi(t('dash_env_modelos'), fmtNum(modelos.length))}
        </div>

        ${modelos.length ? modelos.map(x => {
          const partes = [...x.parts].join(' · ');
          return `
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12px;flex-wrap:wrap">
            <div style="flex:0 0 230px;min-width:0">
              <div style="font-family:monospace;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(x.modelo)}">${esc(x.modelo)}</div>
              ${partes ? `<div style="font-size:10px;color:#7f8c9a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(partes)}">${esc(partes)}</div>` : ''}
            </div>
            <div style="flex:1 1 160px;height:12px;background:var(--bg, #0f1117);border-radius:6px"><div style="width:${Math.max(2, Math.round(x.qty / maxQty * 100))}%;height:12px;background:#4f8ef7;border-radius:6px"></div></div>
            <div style="flex:0 0 70px;text-align:right;font-weight:700">${fmtNum(x.qty)}</div>
          </div>`;
        }).join('') + `
          <div style="display:flex;justify-content:space-between;border-top:2px solid var(--border);margin-top:8px;padding-top:8px;font-size:13px;font-weight:800">
            <span>${t('env_total')}</span><span style="color:#2ecc71">${fmtNum(totQty)}</span>
          </div>` : `<div style="padding:16px;text-align:center;color:#7f8c9a">${t('env_vacio')}</div>`}
      </div>`;

    // 4) Controles
    const leer = () => {
      const d1 = host.querySelector('#envd-d1').value, d2 = host.querySelector('#envd-d2').value;
      if (d1 && d2) window._envDashSel = { d1: d1 <= d2 ? d1 : d2, d2: d1 <= d2 ? d2 : d1 };
    };
    host.querySelector('#envd-buscar').onclick = () => { leer(); pintarEnviadosDashboard(); };
    host.querySelector('#envd-inicio').onclick = () => { window._envDashSel = { d1: ymd(primero), d2: ymd(new Date()) }; pintarEnviadosDashboard(); };
    host.querySelector('#envd-refrescar').onclick = () => { leer(); pintarEnviadosDashboard(true); };
    host.querySelector('#envd-excel').onclick = async () => {
      try {
        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet(t('dash_env_t').replace(/[^\wÀ-ɏ가-힣 ]/g, '').trim().slice(0, 30) || 'Enviados');
        ws.columns = [
          { header: t('th_modelo'), key: 'modelo', width: 26 }, { header: 'Part No.', key: 'part', width: 22 },
          { header: t('env_th_piezas'), key: 'qty', width: 12 }, { header: t('env_th_pallets'), key: 'pallets', width: 10 },
          { header: t('env_k_emb'), key: 'embs', width: 12 }
        ];
        modelos.forEach(x => ws.addRow({ modelo: x.modelo, part: [...x.parts].join(' / '), qty: x.qty, pallets: x.pallets, embs: x.embs.size }));
        const tot = ws.addRow({ modelo: t('env_total'), qty: totQty, pallets: totPal, embs: embsUsados.size });
        tot.font = { bold: true };
        const h = ws.getRow(1);
        h.font = { bold: true, color: { argb: 'FFFFFFFF' } };
        h.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F3A6B' } };
        ws.views = [{ state: 'frozen', ySplit: 1 }];
        const buffer = await wb.xlsx.writeBuffer();
        const url = URL.createObjectURL(new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
        const a = document.createElement('a');
        a.href = url; a.download = `enviados_por_modelo_${sel.d1}_a_${sel.d2}.xlsx`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) { alert(t('env_err') + e.message); console.error(e); }
    };
  } catch (e) {
    host.innerHTML = `<div class="card" style="color:#e74c3c;font-size:13px">${t('env_err')}${esc(e.message)}</div>`;
    console.error('Error en pintarEnviadosDashboard:', e);
  }
};

// ── SIMULACIÓN DEL CONTENEDOR 53 FT EN EL DASHBOARD ──
// SOLO LECTURA: toma los pallets del embarque activo (OPEN/LOADING) y los acomoda en un contenedor 53 ft High Cube.
// Medidas interiores oficiales: 630 x 99 x 109.4 in. Pallet 43 x 43 in. Peso = master de Empaque + tarima.
// Estados: C = cargado (SHIPPED), L = listo (QC aprobado / listo para cargar), P = en proceso / QC pendiente. Rechazados no ocupan lugar.
window.CNT = { L: 630, W: 99, H: 109.4, P: 43, TARIMA_LB: 29.34, MAXLB: 56130, ALTURA: 49 };
window._cnt = null;
window._cntTimer = null;

window.cntPref = function(k, def) { try { const v = localStorage.getItem('shipqr-cnt-' + k); return v == null ? def : v; } catch (e) { return def; } };
window.cntSetPref = function(k, v) { try { localStorage.setItem('shipqr-cnt-' + k, String(v)); } catch (e) {} };
window.cntFmt = x => Math.round(x).toLocaleString('en-US');
window.cntEsc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
window.cntT = (k, o) => { let s = t(k); if (o) for (const x in o) s = s.split('{' + x + '}').join(o[x]); return s; };

// Calcula todo lo que se muestra (espacio, peso, altura) a partir de los pallets y las preferencias
window.cntCalc = function() {
  const C = window.CNT, d = window._cnt;
  const levels = Number(cntPref('niveles', 2)) === 1 ? 1 : 2;
  const palletH = Number(cntPref('altura', C.ALTURA)) || C.ALTURA;
  const maxLb = Number(d.maxLb) || C.MAXLB;
  const rows = Math.floor(C.L / C.P), across = Math.floor(C.W / C.P);
  const perLevel = rows * across, cap = perLevel * levels;
  const ord = { C: 0, L: 1, P: 2 };
  const list = d.pallets.slice().sort((a, b) => (ord[a.est] - ord[b.est]) || (a.est === 'C' ? (a.ts - b.ts) : 0) || a.key.localeCompare(b.key));
  list.forEach((p, i) => { p.n = i + 1; });
  const total = list.length;
  const cnt = { C: 0, L: 0, P: 0 };
  list.forEach(p => cnt[p.est]++);
  const lbTotal = list.reduce((s, p) => s + p.lb, 0);
  const over = Math.max(0, total - cap);
  const usado = levels * palletH, headroom = C.H - usado;
  const spaceFits = over === 0, weightOk = lbTotal <= maxLb, heightOk = headroom >= 0;
  return { levels, palletH, maxLb, rows, across, perLevel, cap, list, total, cnt, lbTotal, over, usado, headroom, spaceFits, weightOk, heightOk,
    fits: spaceFits && weightOk && heightOk, libres: Math.max(0, cap - total), avg: total ? lbTotal / total : 0 };
};

// n (orden del pallet) -> posición física (nivel, fila, lado)
window.cntPos = function(n, k) {
  const idx = n - 1, per = k.across * k.levels;
  const fila = Math.floor(idx / per) + 1, rem = idx % per;
  return { nivel: Math.floor(rem / k.across) + 1, fila, lado: (rem % k.across) + 1 };
};

window.cntGridHtml = function(k, lvl, estilo) {
  const byN = {}; k.list.forEach(p => { byN[p.n] = p; });
  const col = estilo === 'print'
    ? { C: ['#bbf7d0', '#16a34a', '#14532d'], L: ['#bfdbfe', '#2563eb', '#1e3a8a'], P: ['#fde68a', '#d97706', '#78350f'], V: ['#fff', '#9ca3af', '#6b7280'] }
    : { C: ['#14532d', '#22c55e', '#dcfce7'], L: ['#1e3a8a', '#4f8cff', '#dbeafe'], P: ['#713f12', '#facc15', '#fef9c3'], V: ['transparent', '#5b6785', '#8a94ad'] };

    const p = byN[n], c = col[p ? p.est : 'V'];

};

window.cntActivarTip = function(host) {
  let tip = document.getElementById('cnt-tip');
  if (!tip) {
    tip = document.createElement('div'); tip.id = 'cnt-tip';
    tip.style.cssText = 'position:fixed;z-index:99999;pointer-events:none;display:none;background:#0b0f1a;color:#e5e9f5;border:1px solid #4f8cff;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;max-width:300px;box-shadow:0 6px 20px rgba(0,0,0,.5)';
    document.body.appendChild(tip);
  }
  tip.style.display = 'none';
  host.onmousemove = (ev) => {
    const c = ev.target.closest ? ev.target.closest('[data-n]') : null;
    if (!c) { tip.style.display = 'none'; return; }
    tip.innerHTML = cntTipHtml(Number(c.getAttribute('data-n')));
    tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(4, Math.min(ev.clientX + 14, window.innerWidth - w - 8)) + 'px';
    tip.style.top = Math.max(4, (ev.clientY + 14 + h > window.innerHeight) ? ev.clientY - h - 10 : ev.clientY + 14) + 'px';
  };
  host.onmouseleave = () => { tip.style.display = 'none'; };
};

// Pallets del embarque activo EN VIVO: se suscribe a los pallets del embarque, así cada pallet que se carga
// ocupa su lugar al instante (también en otros equipos / TV). Los cargados se ordenan por hora de carga.
window._cntUnsubs = [];
window._cntDocs = {};
window._cntKey = '';
window.cntUnsub = function() { (window._cntUnsubs || []).forEach(u => { try { u(); } catch (e) {} }); window._cntUnsubs = []; };

window.cntRebuild = async function() {
  const tk = (window._cntTk = (window._cntTk || 0) + 1);
  const docs = window._cntDocs, pallets = []; let rechazados = 0, sinPeso = 0;
  for (const id of Object.keys(docs)) {
    const p = docs[id];
    if (p.status === 'QC_REJECTED') { rechazados++; continue; }
    const est = p.status === 'SHIPPED' ? 'C' : p.status === 'READY_TO_SHIP' ? 'L' : 'P';
    let lb = 0;
    const m = await getEmpaqueModelo(p.modelo, p.part_number);
    if (m && m.pcsPorCaja && m.pesoCajaCompleta) lb = calcularPesoReal(p.quantity, m.pcsPorCaja, m.pesoCajaCompleta);
    else sinPeso++;
    const fts = p.shipped_at || p.updated_at;
    const ts = est === 'C' ? (fts && fts.toMillis ? fts.toMillis() : Date.now()) : 0;
    pallets.push({ id, est, ts, lot: p.lot_number || '', num: p.pallet_numero || 1, total: p.total_pallets || 1, parcial: !!p.parcial,
      modelo: p.modelo || '', part: p.part_number || '', qty: p.quantity || 0, boxes: p.boxes_txt || '',
      lb: lb + window.CNT.TARIMA_LB, key: (p.lot_number || '') + String(p.pallet_numero || 0).padStart(3, '0') });
  }
  if (tk !== window._cntTk) return;
  const emb = window._cntEmb || {};
  window._cnt = { folio: folioEmb(emb), destino: emb.destino || 'DALLAS', pallets, rechazados, sinPeso, emb, maxLb: window._cntMaxLb || 0 };
  cntRender();
};

window.pintarContenedorDash = async function(emb) {
  const host = document.getElementById('dash-contenedor');
  if (!host) return;
  window._cntEmb = emb;
  if (!emb) { cntUnsub(); host.innerHTML = ''; window._cnt = null; window._cntKey = ''; return; }
  const ids = emb.lotes || [];
  const key = emb.id + '|' + ids.join(',');
  if (key === window._cntKey && window._cnt) { if (!host.innerHTML) cntRender(); return; }  // ya suscrito a este embarque
  cntUnsub();
  window._cntKey = key; window._cntDocs = {};
  try {
    const { db, doc, getDoc, collection, query, where, onSnapshot } = window.fb;
    try { const cs = await getDoc(doc(db, 'shipqr_config', 'contenedor')); window._cntMaxLb = cs.exists() ? (Number(cs.data().maxLb) || 0) : 0; } catch (e) { window._cntMaxLb = 0; }
    if (!ids.length) { await cntRebuild(); return; }
    for (let i = 0; i < ids.length; i += 30) {
      const chunk = ids.slice(i, i + 30);
      window._cntUnsubs.push(onSnapshot(query(collection(db, 'shipqr_pallets'), where('__name__', 'in', chunk)), (snap) => {
        if (!document.getElementById('dash-contenedor')) { cntUnsub(); window._cntKey = ''; return; }
        chunk.forEach(id => { delete window._cntDocs[id]; });
        snap.forEach(d => { window._cntDocs[d.id] = d.data(); });
        cntRebuild();
      }, (err) => {
        const h = document.getElementById('dash-contenedor');
        if (h) h.innerHTML = `<div class="card" style="color:#e74c3c;font-size:13px">${t('cnt_err')}${cntEsc(err.message)}</div>`;
        console.error('Error en pallets del contenedor:', err);
      }));
    }
  } catch (e) {
    host.innerHTML = `<div class="card" style="color:#e74c3c;font-size:13px">${t('cnt_err')}${cntEsc(e.message)}</div>`;
    console.error('Error en pintarContenedorDash:', e);
  }
};

// Une varios lotes en UNO solo (el lote "keeperId" se conserva). Conserva el estado de QC y el lugar en el embarque.
// Regresa true si se unió, false si se canceló o se bloqueó (en ese caso NO se cambia nada).
// Se bloquea si: son REMPLAZO; difieren en modelo/parte/destino; algún lote no tiene pallets o sus cantidades no cuadran;
// los pallets no comparten el mismo estado QC (solo pendiente o aprobado); hay pallets divididos por cierre parcial;
// o algún pallet está en un embarque ya cerrado.
window.unirLotes = async function(loteIds, keeperId) {
  const fmt = (k, o) => Object.entries(o || {}).reduce((s, [a, b]) => s.split('{' + a + '}').join(b), t(k));
  const sinUndefined = (o) => Object.fromEntries(Object.entries(o).filter(([, v]) => v !== undefined));
  try {
    const { db, doc, getDoc, collection, query, where, getDocs, updateDoc, writeBatch, serverTimestamp } = window.fb;
    if (!Array.isArray(loteIds) || loteIds.length < 2 || !loteIds.includes(keeperId)) { alert(t('ul_sel_min')); return false; }
    window._empaqueCache = {}; // refresca Empaque por si se acaba de cambiar

    // 1) Leer los lotes
    const lotes = [];
    for (const id of loteIds) {
      const s = await getDoc(doc(db, 'shipqr_lotes', id));
      if (!s.exists()) { alert(fmt('rg_no_lote', { lote: id })); return false; }
      lotes.push({ id, ...s.data() });
    }
    if (lotes.some(l => (l.motivo || 'PLAN').toUpperCase() === 'REMPLAZO')) { alert(t('ul_bloq_remplazo')); return false; }
    const clave = (l) => [(l.modelo || '').trim().toUpperCase(), (l.part_number || '').trim().toUpperCase(), (l.destination || '').trim().toUpperCase()].join('|');
    if (new Set(lotes.map(clave)).size !== 1) { alert(t('ul_bloq_dif')); return false; }
    const keeper = lotes.find(l => l.id === keeperId);

    // 2) Leer los pallets de cada lote
    const palletsPorLote = {};
    for (const l of lotes) {
      const snap = await getDocs(query(collection(db, 'shipqr_pallets'), where('lot_number', '==', l.id)));
      const ps = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.pallet_numero - b.pallet_numero);
      if (ps.length === 0) { alert(t('ul_bloq_sin_pallets')); return false; }
      if (ps.reduce((s, p) => s + (p.quantity || 0), 0) !== (l.quantity || 0)) { alert(t('rg_bloq_suma')); return false; }
      palletsPorLote[l.id] = ps;
    }
    const orden = [keeperId, ...loteIds.filter(id => id !== keeperId)];
    const todos = orden.flatMap(id => palletsPorLote[id]);

    // 3) Protecciones de estado, divisiones y embarques cerrados
    const estados = [...new Set(todos.map(p => p.status))];
    if (estados.length !== 1 || !['QC_PENDING', 'QC_APPROVED'].includes(estados[0])) { alert(t('ul_bloq_estado')); return false; }
    const estado = estados[0];
    if (todos.some(p => p.dividido || p.dividido_de)) { alert(t('ul_bloq_div')); return false; }
    const idsViejos = new Set(todos.map(p => p.id));
    const embSnap = await getDocs(collection(db, 'shipqr_embarques'));
    const embConAlguno = embSnap.docs.filter(d => (d.data().lotes || []).some(id => idsViejos.has(id)));
    if (embConAlguno.some(d => !['OPEN', 'LOADING'].includes(d.data().status))) { alert(t('ul_bloq_emb')); return false; }

    // 4) Cálculo nuevo con el total y el Cajas/pallet actual de Empaque
    const total = lotes.reduce((s, l) => s + (l.quantity || 0), 0);
    const { pallets, info } = await calcularPallets(keeper.modelo, total, keeper.part_number, 'PLAN');
    if (!info.ok || !info.pcsPorCaja || !info.cajasPorPallet) { alert(t('rg_sin_empaque')); return false; }
    if (pallets.reduce((s, p) => s + (p.qty || 0), 0) !== total) { alert(t('rg_bloq_suma')); return false; }

    const qcTxt = estado === 'QC_APPROVED' ? t('qc_aprobado') : t('qc_pendiente');
    if (!confirm(fmt('ul_confirm', { lotes: loteIds.join(' + '), keeper: keeperId, qty: fmtNum(total), antes: todos.length, despues: pallets.length, cpp: info.cajasPorPallet, qc: qcTxt }))) return false;

    // 5) Registro de origen (para no perder la trazabilidad) y datos de QC a conservar
    const origenes = lotes.map(l => {
      const ps = palletsPorLote[l.id];
      const conQc = ps.find(p => p.qc_aprobado_por) || ps[0];
      return sinUndefined({ lot: l.id, quantity: l.quantity || 0, created_at: l.created_at || undefined, qc_aprobado_por: conQc?.qc_aprobado_por, qc_fecha: conQc?.qc_fecha, qc_comentarios: conQc?.qc_comentarios });
    });
    const fuenteQc = todos.find(p => p.qc_aprobado_por) || todos[0];
    const qcCampos = {};
    ['qc_aprobado_por', 'qc_comentarios', 'qc_fecha'].forEach(k => { if (fuenteQc[k] !== undefined) qcCampos[k] = fuenteQc[k]; });
    const base = palletsPorLote[keeperId][0];
    const qrLote = JSON.stringify({ lot: keeperId, mod: keeper.modelo, pn: keeper.part_number, qty: total, dest: keeper.destination });

    // 6) Todo en un solo lote de escrituras: o se guarda todo o no se guarda nada
    const batch = writeBatch(db);
    batch.update(doc(db, 'shipqr_lotes', keeperId), { quantity: total, qr_data: qrLote, lotes_unidos: origenes, unido_at: serverTimestamp(), updated_at: serverTimestamp() });
    lotes.filter(l => l.id !== keeperId).forEach(l => batch.delete(doc(db, 'shipqr_lotes', l.id)));

    const idsNuevos = [];
    pallets.forEach(p => {
      const palletId = `${keeperId}-P${p.numero}`;
      idsNuevos.push(palletId);
      const palletQr = JSON.stringify({ lot: keeperId, pallet: p.numero, mod: keeper.modelo, pn: keeper.part_number, qty: p.qty, dest: keeper.destination });
      batch.set(doc(db, 'shipqr_pallets', palletId), {
        lot_number: keeperId, pallet_numero: p.numero, total_pallets: pallets.length,
        modelo: keeper.modelo, part_number: keeper.part_number, destination: keeper.destination, description: keeper.description || '', motivo: (keeper.motivo || 'PLAN'),
        cajas: p.cajas, quantity: p.qty, parcial: p.parcial, boxes_txt: p.boxesTxt,
        status: estado, qr_data: palletQr, ...qcCampos,
        etiqueta_impresa: false, etiqueta_impresa_at: null,
        unido_de: loteIds, unido_at: serverTimestamp(),
        created_at: base.created_at || serverTimestamp(), updated_at: serverTimestamp()
      });
    });
    todos.forEach(p => { if (!idsNuevos.includes(p.id)) batch.delete(doc(db, 'shipqr_pallets', p.id)); });
    await batch.commit();

    // 7) Embarque abierto: salen los pallets viejos y entran los nuevos (una sola vez, en el primer embarque que los tenía)
    let asignado = false;
    for (const embDoc of embConAlguno) {
      const lista = (embDoc.data().lotes || []).filter(id => !idsViejos.has(id));
      if (!asignado) { idsNuevos.forEach(id => lista.push(id)); asignado = true; }
      await updateDoc(doc(db, 'shipqr_embarques', embDoc.id), { lotes: lista });
    }
    await actualizarEstadoLotePorPallets(keeperId);

    alert(fmt('ul_ok', { keeper: keeperId, qty: fmtNum(total), despues: pallets.length }));
    return true;
  } catch (e) {
    alert(t('ul_err') + e.message);
    console.error('Error en unirLotes:', e);
    return false;
  }
};

// Reagrupa los pallets de un lote con el "Cajas/pallet" ACTUAL de Empaque por modelo (ej. de 18 a 24),
// CONSERVANDO el estado de QC (aprobado/pendiente) y su lugar en el embarque. A diferencia de
// recalcularPalletsLote() (que borra el QC), esta solo cambia cómo se reparten las cajas en pallets.
// Se bloquea sin cambiar nada si: los pallets tienen estados distintos, ya están rechazados/recibidos en P3/embarcados,
// fueron divididos por un cierre parcial, o alguno está en un embarque ya cerrado.
window.reagruparPalletsLote = async function(lotNumber) {
  const fmt = (k, o) => Object.entries(o || {}).reduce((s, [a, b]) => s.split('{' + a + '}').join(b), t(k));
  try {
    const { db, doc, getDoc, collection, query, where, getDocs, updateDoc, writeBatch, serverTimestamp } = window.fb;
    const loteSnap = await getDoc(doc(db, 'shipqr_lotes', lotNumber));
    if (!loteSnap.exists()) { alert(fmt('rg_no_lote', { lote: lotNumber })); return; }
    const l = loteSnap.data();
    if ((l.motivo || 'PLAN').toUpperCase() === 'REMPLAZO') { alert(t('rg_remplazo')); return; }

    window._empaqueCache = {}; // refresca Empaque por si se acaba de cambiar de 18 a 24

    const viejosSnap = await getDocs(query(collection(db, 'shipqr_pallets'), where('lot_number', '==', lotNumber)));
    if (viejosSnap.empty) { alert(t('rg_no_pallets')); return; }
    const viejos = viejosSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.pallet_numero - b.pallet_numero);

    // Protección 1: todos los pallets con el mismo estado y solo QC pendiente o aprobado
    const estados = [...new Set(viejos.map(p => p.status))];
    if (estados.length !== 1 || !['QC_PENDING', 'QC_APPROVED'].includes(estados[0])) { alert(fmt('rg_bloq_estado', { lote: lotNumber })); return; }
    const estado = estados[0];

    // Protección 2: nada de pallets divididos por un cierre parcial
    if (viejos.some(p => p.dividido || p.dividido_de)) { alert(fmt('rg_bloq_div', { lote: lotNumber })); return; }

    // Protección 3: ningún pallet en un embarque ya cerrado
    const idsViejos = new Set(viejos.map(p => p.id));
    const embSnap = await getDocs(collection(db, 'shipqr_embarques'));
    const embConLote = embSnap.docs.filter(d => (d.data().lotes || []).some(id => idsViejos.has(id)));
    if (embConLote.some(d => !['OPEN', 'LOADING'].includes(d.data().status))) { alert(fmt('rg_bloq_emb', { lote: lotNumber })); return; }

    // Cálculo nuevo con el Cajas/pallet actual de Empaque
    const { pallets, info } = await calcularPallets(l.modelo, l.quantity, l.part_number, l.motivo);
    if (!info.ok || !info.pcsPorCaja || !info.cajasPorPallet) { alert(t('rg_sin_empaque')); return; }
    if (pallets.reduce((s, p) => s + (p.qty || 0), 0) !== (l.quantity || 0)) { alert(t('rg_bloq_suma')); return; }

    const qcTxt = estado === 'QC_APPROVED' ? t('qc_aprobado') : t('qc_pendiente');
    if (!confirm(fmt('rg_confirm', { lote: lotNumber, antes: viejos.length, despues: pallets.length, cpp: info.cajasPorPallet, qc: qcTxt }))) return;

    // Los campos de QC se copian tal cual del pallet original (nunca se escribe "undefined" en Firestore)
    const base = viejos[0];
    const qcCampos = {};
    ['qc_aprobado_por', 'qc_comentarios', 'qc_fecha'].forEach(k => { if (base[k] !== undefined) qcCampos[k] = base[k]; });

    const batch = writeBatch(db);
    const idsNuevos = [];
    pallets.forEach(p => {
      const palletId = `${lotNumber}-P${p.numero}`;
      idsNuevos.push(palletId);
      const palletQr = JSON.stringify({ lot: lotNumber, pallet: p.numero, mod: l.modelo, pn: l.part_number, qty: p.qty, dest: l.destination });
      batch.set(doc(db, 'shipqr_pallets', palletId), {
        lot_number: lotNumber, pallet_numero: p.numero, total_pallets: pallets.length,
        modelo: l.modelo, part_number: l.part_number, destination: l.destination, description: l.description || '', motivo: (l.motivo || 'PLAN'),
        cajas: p.cajas, quantity: p.qty, parcial: p.parcial, boxes_txt: p.boxesTxt,
        status: estado, qr_data: palletQr, ...qcCampos,
        etiqueta_impresa: false, etiqueta_impresa_at: null,
        reagrupado: true, reagrupado_de: viejos.length, reagrupado_at: serverTimestamp(),
        created_at: base.created_at || serverTimestamp(), updated_at: serverTimestamp()
      });
    });
    // Pallets viejos que sobran (ej. de 6 pallets de 18 cajas quedan 5 de 24) se eliminan
    viejos.forEach(p => { if (!idsNuevos.includes(p.id)) batch.delete(doc(db, 'shipqr_pallets', p.id)); });
    await batch.commit();

    // Los embarques que ya tenían estos pallets se actualizan: salen los eliminados y entran los nuevos
    for (const embDoc of embConLote) {
      const lista = (embDoc.data().lotes || []).filter(id => !idsViejos.has(id) || idsNuevos.includes(id));
      idsNuevos.forEach(id => { if (!lista.includes(id)) lista.push(id); });
      await updateDoc(doc(db, 'shipqr_embarques', embDoc.id), { lotes: lista });
    }
    await actualizarEstadoLotePorPallets(lotNumber);

    alert(fmt('rg_ok', { lote: lotNumber, antes: viejos.length, despues: pallets.length }));
  } catch (e) {
    alert(t('rg_err') + e.message);
    console.error('Error en reagruparPalletsLote:', e);
  }
};

// Marca todos los pallets de un lote como "etiqueta ya impresa", SIN abrir la ventana de impresión.
// Sirve para lotes viejos (de antes de este control) que ya se imprimieron a mano, para que
// el sistema no vuelva a sacar todas las hojas de golpe la próxima vez que se use 🏷️.
window.marcarLoteComoImpreso = async function(lotNumber) {
  if (!confirm(`Esto marca TODAS las etiquetas del lote ${lotNumber} como "ya impresas", sin imprimir nada ahora.\n\nÚsalo solo si ya las imprimiste antes a mano.\n\n¿Continuar?`)) return;
  try {
    const { db, doc, collection, query, where, getDocs, writeBatch, serverTimestamp } = window.fb;
    const palletsSnap = await getDocs(query(collection(db, 'shipqr_pallets'), where('lot_number', '==', lotNumber)));
    if (palletsSnap.empty) { alert('Este lote no tiene pallets generados todavía.'); return; }
    const batch = writeBatch(db);
    palletsSnap.docs.forEach(d => batch.update(doc(db, 'shipqr_pallets', d.id), { etiqueta_impresa: true, etiqueta_impresa_at: serverTimestamp() }));
    await batch.commit();
    alert(`Listo. Se marcaron ${palletsSnap.size} pallet(s) del lote ${lotNumber} como ya impresos.`);
    aplicarFiltrosProduccion();
  } catch (e) {
    alert('Error al marcar como impreso: ' + e.message);
    console.error('Error en marcarLoteComoImpreso:', e);
  }
};

// Muestra el detalle de pallets de un lote: cantidad de cada uno y si ya tiene etiqueta impresa,
// para poder identificar exactamente cuáles faltan (ej: de un lote grande, cuáles pallets ya se
// imprimieron a mano y cuáles todavía no).
window.verPalletsLote = async function(lotNumber) {
  try {
    const { db, collection, query, where, getDocs } = window.fb;
    document.getElementById('pl-modal-titulo').textContent = `${t('modal_pallets_lote')} ${lotNumber}`;
    document.getElementById('pl-modal').style.display = 'flex';
    document.getElementById('pl-modal-body').innerHTML = `<div style="text-align:center;padding:20px;color:#7f8c9a;font-size:12px">${t('word_cargando')}</div>`;

    const snap = await getDocs(query(collection(db, 'shipqr_pallets'), where('lot_number', '==', lotNumber)));
    if (snap.empty) {
      document.getElementById('pl-modal-body').innerHTML = `<div style="text-align:center;padding:20px;color:#7f8c9a;font-size:12px">Este lote no tiene pallets generados todavía.</div>`;
      return;
    }
    const pallets = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.pallet_numero - b.pallet_numero);
    const impresos = pallets.filter(p => p.etiqueta_impresa === true);
    const qtyImpresa = impresos.reduce((s, p) => s + (p.quantity || 0), 0);
    const qtyPendiente = pallets.reduce((s, p) => s + (p.quantity || 0), 0) - qtyImpresa;

    document.getElementById('pl-modal-body').innerHTML = `
      <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:10px;padding:8px 10px;background:var(--card2);border-radius:6px">
        <span>✅ Impreso: ${fmtNum(qtyImpresa)} pz (${impresos.length}/${pallets.length})</span>
        <span>⏳ Pendiente: ${fmtNum(qtyPendiente)} pz</span>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:.85rem">
        <thead>
          <tr style="border-bottom:1px solid var(--border)">
            <th style="text-align:left;padding:6px;font-size:.7rem;color:var(--muted)">PALLET</th>
            <th style="text-align:right;padding:6px;font-size:.7rem;color:var(--muted)">QTY</th>
            <th style="text-align:center;padding:6px;font-size:.7rem;color:var(--muted)">ESTADO</th>
            <th style="text-align:center;padding:6px;font-size:.7rem;color:var(--muted)">ACCIÓN</th>
          </tr>
        </thead>
        <tbody>
          ${pallets.map(p => `
            <tr style="border-bottom:1px solid var(--border)">
              <td style="padding:6px;font-family:monospace">${p.pallet_numero}/${p.total_pallets}${p.parcial ? ' · parcial' : ''}</td>
              <td style="padding:6px;text-align:right;font-weight:600">${fmtNum(p.quantity)}</td>
              <td style="padding:6px;text-align:center">${p.etiqueta_impresa === true ? '<span style="color:#2ecc71;font-weight:600">✅ Impreso</span>' : '<span style="color:#f1c40f;font-weight:600">⏳ Pendiente</span>'}</td>
              <td style="padding:6px;text-align:center">
                <button class="btn-secondary" style="padding:4px 8px;font-size:11px" onclick="togglePalletImpreso('${p.id}','${lotNumber}')">${p.etiqueta_impresa === true ? 'Desmarcar' : 'Marcar impreso'}</button>
                ${p.status !== 'SHIPPED' ? `<button class="btn-secondary" style="padding:4px 8px;font-size:11px;border-color:#f1c40f;color:#f1c40f" title="${t('aj_title')}" onclick="ajustarCantidadPallet('${p.id}','${lotNumber}')">${t('aj_btn')}</button>
                <button class="btn-secondary" style="padding:4px 8px;font-size:11px;border-color:#3498db;color:#3498db" title="${t('sd_title')}" onclick="sacarPalletDelPL('${p.id}','${lotNumber}')">${t('sd_btn')}</button>` : ''}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (e) {
    document.getElementById('pl-modal-body').innerHTML = `<div style="color:#e74c3c;font-size:12px;text-align:center;padding:20px">Error: ${e.message}</div>`;
    console.error('Error en verPalletsLote:', e);
  }
};

// Quitar piezas de UN pallet ya existente (aunque ya esté recibido en P3): baja la cantidad del pallet y del lote,
// recalcula cajas, genera un QR nuevo con la cantidad correcta y deja la etiqueta como PENDIENTE de imprimir.
// NO toca el status (QC / recibido) ni el embarque al que ya esté asignado. Queda registro del ajuste en el pallet.
window.ajustarCantidadPallet = async function(palletId, lotNumber) {
  try {
    const { db, doc, getDoc, collection, query, where, getDocs, writeBatch, serverTimestamp } = window.fb;
    const pRef = doc(db, 'shipqr_pallets', palletId);
    const pSnap = await getDoc(pRef);
    if (!pSnap.exists()) { alert(t('aj_noexiste')); return; }
    const p = pSnap.data();
    if (p.status === 'SHIPPED') { alert(t('aj_cargado')); return; }
    const embSnap = await getDocs(query(collection(db, 'shipqr_embarques'), where('lotes', 'array-contains', palletId)));
    if (embSnap.docs.some(d => d.data().status === 'CLOSED')) { alert(t('aj_cerrado')); return; }

    const actual = p.quantity || 0;
    const etq = `${lotNumber} · Pallet ${p.pallet_numero}/${p.total_pallets}`;
    const inp = prompt(t('aj_prompt').replace('{pal}', etq).replace('{qty}', fmtNum(actual)));
    if (inp === null) return;
    const quitar = parseInt(String(inp).replace(/[^0-9]/g, '')) || 0;
    if (quitar <= 0 || quitar >= actual) { alert(t('aj_invalido').replace('{qty}', fmtNum(actual))); return; }
    const motivo = (prompt(t('aj_motivo')) || '').trim();
    if (!motivo) { alert(t('aj_motivo_req')); return; }
    const nueva = actual - quitar;

    window._empaqueCache = {};
    const info = await calcularEmpaque(p.modelo, nueva, p.part_number);
    let cajas = p.cajas || 0, boxesTxt = p.boxes_txt || '', parcial = !!p.parcial;
    if (info.ok) {
      const pcs = info.pcsPorCaja;
      cajas = Math.ceil(nueva / pcs);
      const ult = nueva - pcs * (cajas - 1);
      boxesTxt = (ult > 0 && ult < pcs && cajas > 1) ? `${pcs}X${cajas - 1} + ${ult}X1` : `${pcs}X${cajas}`;
      if (info.cajasPorPallet) parcial = cajas < info.cajasPorPallet;
    }

    const hermanos = await getDocs(query(collection(db, 'shipqr_pallets'), where('lot_number', '==', lotNumber)));
    const qtyLoteNueva = hermanos.docs.reduce((s, d) => s + (d.id === palletId ? nueva : (d.data().quantity || 0)), 0);

    if (!confirm(t('aj_confirm').replace('{pal}', etq).replace('{a}', fmtNum(actual)).replace('{n}', fmtNum(nueva)).replace('{q}', fmtNum(quitar))
        .replace('{ca}', p.cajas || 0).replace('{cn}', cajas).replace('{la}', fmtNum(qtyLoteNueva + quitar)).replace('{ln}', fmtNum(qtyLoteNueva)))) return;

    const user = (window.currentUser && window.currentUser.username) || '';
    const qr = JSON.stringify({ lot: lotNumber, pallet: p.pallet_numero, mod: p.modelo, pn: p.part_number, qty: nueva, dest: p.destination });
    const batch = writeBatch(db);
    batch.update(pRef, {
      quantity: nueva, cajas, boxes_txt: boxesTxt, parcial, qr_data: qr,
      etiqueta_impresa: false, etiqueta_impresa_at: null, updated_at: serverTimestamp(),
      ajustes: [...(p.ajustes || []), { at: new Date().toISOString(), by: user, antes: actual, despues: nueva, quito: quitar, motivo }]
    });
    const loteRef = doc(db, 'shipqr_lotes', lotNumber);
    const loteUpd = { quantity: qtyLoteNueva, updated_at: serverTimestamp() };
    try {
      const lSnap = await getDoc(loteRef);
      if (lSnap.exists() && lSnap.data().qr_data) { const lq = JSON.parse(lSnap.data().qr_data); lq.qty = qtyLoteNueva; loteUpd.qr_data = JSON.stringify(lq); }
    } catch (e) {}
    batch.update(loteRef, loteUpd);
    await batch.commit();

    alert(t('aj_ok').replace('{pal}', etq).replace('{n}', fmtNum(nueva)));
    if (confirm(t('aj_imprimir'))) imprimirEtiquetaLote(lotNumber);
    verPalletsLote(lotNumber);
  } catch (e) {
    alert(t('aj_err') + e.message);
    console.error('Error en ajustarCantidadPallet:', e);
  }
};

// Saca UN pallet del PL del embarque abierto y lo deja en el piso de Planta 4 (vuelve a QC_APPROVED si ya estaba recibido en P3).
// Conserva piezas, QC y etiqueta. Queda marcado como "diferido" y pasa solo al siguiente embarque cuando éste se cierra.
window.sacarPalletDelPL = async function(palletId, lotNumber) {
  try {
    const { db, doc, getDoc, collection, query, where, getDocs, updateDoc, serverTimestamp } = window.fb;
    const pRef = doc(db, 'shipqr_pallets', palletId);
    const pSnap = await getDoc(pRef);
    if (!pSnap.exists()) { alert(t('aj_noexiste')); return; }
    const p = pSnap.data();
    if (p.status === 'SHIPPED') { alert(t('sd_cargado')); return; }
    const embSnap = await getDocs(query(collection(db, 'shipqr_embarques'), where('lotes', 'array-contains', palletId)));
    const abiertos = embSnap.docs.filter(d => d.data().status === 'OPEN' || d.data().status === 'LOADING');
    if (!abiertos.length) { alert(t('sd_noemb')); return; }
    const etq = `${lotNumber} · Pallet ${p.pallet_numero}/${p.total_pallets}`;
    if (!confirm(t('sd_confirm').replace('{pal}', etq))) return;
    for (const d of abiertos) {
      await updateDoc(doc(db, 'shipqr_embarques', d.id), { lotes: (d.data().lotes || []).filter(x => x !== palletId) });
    }
    const upd = { diferido: true, diferido_at: new Date().toISOString(), updated_at: serverTimestamp() };
    if (p.status === 'READY_TO_SHIP') upd.status = 'QC_APPROVED';
    await updateDoc(pRef, upd);
    await actualizarEstadoLotePorPallets(lotNumber);
    alert(t('sd_ok').replace('{pal}', etq));
    verPalletsLote(lotNumber);
  } catch (e) {
    alert(t('sd_err') + e.message);
    console.error('Error en sacarPalletDelPL:', e);
  }
};

// Después de cerrar un embarque: los pallets "diferidos" (sacados del PL) pasan al siguiente embarque activo.
async function moverPalletsDiferidosAlSiguiente() {
  try {
    const { db, collection, query, where, getDocs, updateDoc, doc } = window.fb;
    const snap = await getDocs(query(collection(db, 'shipqr_pallets'), where('diferido', '==', true)));
    if (snap.empty) return;
    const ids = snap.docs.map(d => d.id);
    await agregarPalletsAEmbarqueActivoSiExiste(ids);
    await Promise.all(ids.map(id => updateDoc(doc(db, 'shipqr_pallets', id), { diferido: false })));
  } catch (e) { console.error('Error moviendo pallets diferidos:', e); }
}

// Marca o desmarca UN pallet individual como impreso (sin afectar los demás del mismo lote)
window.togglePalletImpreso = async function(palletId, lotNumber) {
  try {
    const { db, doc, getDoc, updateDoc, serverTimestamp } = window.fb;
    const ref = doc(db, 'shipqr_pallets', palletId);
    const snap = await getDoc(ref);
    if (!snap.exists()) return;
    const yaImpreso = snap.data().etiqueta_impresa === true;
    await updateDoc(ref, { etiqueta_impresa: !yaImpreso, etiqueta_impresa_at: !yaImpreso ? serverTimestamp() : null });
    verPalletsLote(lotNumber);
  } catch (e) {
    alert('Error al actualizar el pallet: ' + e.message);
    console.error('Error en togglePalletImpreso:', e);
  }
};

function mostrarResultadoQR(lot_number, qrData) {
  const resultEl = document.getElementById('nl-qr-result');
  resultEl.innerHTML = `
    <div style="text-align:center;padding:14px;background:#0f1117;border-radius:6px">
      <div style="font-size:13px;color:#2ecc71;margin-bottom:12px">✓ Lote ${lot_number} creado</div>
      <div id="nl-qr-canvas" style="display:inline-block;background:#fff;padding:10px;border-radius:6px"></div>
      <div style="font-family:monospace;font-size:13px;color:var(--accent);font-weight:700;margin-top:10px">${lot_number}</div>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="btn-secondary" style="padding:8px 14px;font-size:12px" onclick="descargarQR('${lot_number}')">⬇ Descargar</button>
        <button class="btn-secondary" style="padding:8px 14px;font-size:12px" onclick="imprimirQR('${lot_number}')">🖨 Imprimir</button>
        <button class="btn-secondary" style="padding:8px 14px;font-size:12px;border-color:var(--accent);color:var(--accent)" onclick="imprimirEtiquetaLote('${lot_number}')">🏷️ Etiqueta de pallet</button>
        <button class="btn-secondary" style="padding:8px 14px;font-size:12px" onclick="cerrarModalNuevoLote()">Cerrar</button>
      </div>
    </div>
  `;
  new QRCode(document.getElementById('nl-qr-canvas'), { text: qrData, width: 160, height: 160, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
}

window.descargarQR = function(lotNumber) {
  const container = document.getElementById('nl-qr-canvas');
  const canvas = container?.querySelector('canvas');
  const img = container?.querySelector('img');
  const dataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : null);
  if (!dataUrl) { alert('No se pudo generar la imagen del QR'); return; }
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = `QR_${lotNumber}.png`;
  a.click();
};

window.imprimirQR = function(lotNumber) {
  const container = document.getElementById('nl-qr-canvas');
  const canvas = container?.querySelector('canvas');
  const img = container?.querySelector('img');
  const dataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : null);
  if (!dataUrl) { alert('No se pudo generar la imagen del QR'); return; }
  const w = window.open('', '_blank');
  w.document.write(`
    <html><head><title>QR ${lotNumber}</title></head>
    <body style="margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:Arial,sans-serif">
      <img src="${dataUrl}" style="width:280px;height:280px" onload="window.print();window.close()">
      <div style="font-size:18px;font-weight:700;margin-top:10px">${lotNumber}</div>
    </body></html>
  `);
  w.document.close();
