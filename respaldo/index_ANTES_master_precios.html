function formatearFechaEtiqueta(fecha) {
  const d = fecha && fecha.toDate ? fecha.toDate() : (fecha ? new Date(fecha) : new Date());
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yy = String(d.getFullYear()).slice(-2);
  return `${dd}.${mm}.${yy}`;
}

// Genera la hoja de registro que se pega en cada pallet del lote: datos del lote + QR, mismo formato que la etiqueta física actual (Dallas)
window.imprimirEtiquetaLote = async function(lotNumber) {
  try {
    const { db, doc, getDoc, collection, query, where, orderBy, getDocs } = window.fb;
    const loteSnap = await getDoc(doc(db, 'shipqr_lotes', lotNumber));
    if (!loteSnap.exists()) { alert('No se encontró el lote ' + lotNumber); return; }
    const l = loteSnap.data();

    const palletsSnap = await getDocs(query(collection(db, 'shipqr_pallets'), where('lot_number', '==', lotNumber)));
    if (palletsSnap.empty) { alert('Este lote no tiene pallets generados todavía.'); return; }
    const todos = palletsSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.pallet_numero - b.pallet_numero);

    // Por default solo se imprimen los pallets que AÚN no tienen etiqueta impresa, para no duplicar.
    const faltantes = todos.filter(p => p.etiqueta_impresa !== true);
    let pallets;
    if (faltantes.length === 0) {
      if (!confirm(`Las ${todos.length} etiqueta(s) de este lote ya se imprimieron antes.\n\n¿Reimprimir TODAS de nuevo?`)) return;
      pallets = todos;
    } else if (faltantes.length < todos.length) {
      const reimprimirTodo = confirm(`Ya se imprimieron ${todos.length - faltantes.length} de ${todos.length} pallet(s) de este lote.\n\nAceptar = imprimir solo los ${faltantes.length} faltante(s).\nCancelar = reimprimir TODAS de nuevo.`);
      pallets = reimprimirTodo ? faltantes : todos;
    } else {
      pallets = faltantes;
    }

    const info = await calcularEmpaque(l.modelo, l.quantity, l.part_number);
    const descripcion = (l.description || info.descripcion || l.modelo || '').toString();
    const fechaTxt = formatearFechaEtiqueta(l.created_at);
    const destino = (l.destination || 'DALLAS').toString();

    // Genera un QR distinto para cada pallet (cada uno identifica su propio número de pallet)
    async function generarQRDataUrl(texto) {
      const temp = document.createElement('div');
      temp.style.display = 'none';
      document.body.appendChild(temp);
      new QRCode(temp, { text: texto, width: 300, height: 300, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
      await new Promise(r => setTimeout(r, 150));
      const qrCanvas = temp.querySelector('canvas');
      const qrImg = temp.querySelector('img');
      const dataUrl = qrCanvas ? qrCanvas.toDataURL('image/png') : (qrImg ? qrImg.src : '');
      document.body.removeChild(temp);
      return dataUrl;
    }
    for (const p of pallets) {
      p._qrDataUrl = await generarQRDataUrl(p.qr_data || JSON.stringify({ lot: lotNumber, pallet: p.pallet_numero, mod: l.modelo, pn: l.part_number, qty: p.quantity, dest: l.destination }));
    }

    const hojaHTML = (p) => {
      const filas = [
        ['# PART', l.part_number || '—'],
        ['DESC:', descripcion],
        ['BOXES:', p.boxes_txt || '—'],
        ['QTY:', fmtNum(p.quantity)],
        ['DATE:', fechaTxt]
      ];
      return `
      <div class="hoja">
        ${l.motivo === 'REMPLAZO' ? `<div class="banner-remplazo">⚠ REMPLAZO</div>` : ''}
        <div class="pallet-contador">Pallet ${p.pallet_numero} de ${p.total_pallets}${p.parcial ? ' · PARCIAL' : ''}</div>
        <div class="encabezado">
          <img src="${LOGO_ESP_NEGRO}" style="height:60px">
          <div class="destino">${destino}</div>
          <div class="planta">${PLANTA_ORIGEN}</div>
        </div>
        <table class="datos">
          ${filas.map(([label, valor]) => `
            <tr>
              <td class="etiqueta-campo">${label}</td>
              <td class="valor-campo${label === 'DESC:' ? ' valor-desc' : ''}${p.parcial && (label === 'QTY:' || label === 'BOXES:') ? ' valor-parcial' : ''}">${valor}</td>
            </tr>
          `).join('')}
        </table>
        <div class="zona-qr">
          ${p._qrDataUrl ? `<img src="${p._qrDataUrl}" style="width:300px;height:300px">` : ''}
          <div class="lote-num">${lotNumber} · Pallet ${p.pallet_numero}</div>
        </div>
      </div>
    `;
    };

    const w = window.open('', '_blank');
    w.document.write(`
      <html><head><title>Etiqueta ${lotNumber}</title>
        <style>
          @page { size: letter; margin: 0.2in; }
          * { box-sizing: border-box; }
          body { margin: 0; font-family: Arial, sans-serif; }
          .hoja { width: 8.1in; height: 10.6in; border: 3px solid #000; display: flex; flex-direction: column; page-break-after: always; overflow: hidden; }
          .hoja:last-child { page-break-after: auto; }
          .pallet-contador { text-align: center; font-size: 22px; font-weight: 700; padding: 10px 0 0; }
          .banner-remplazo { text-align: center; font-size: 40px; font-weight: 900; letter-spacing: 3px; color: #fff; background: #c0392b; padding: 10px 0; }
          .encabezado { display: flex; align-items: center; justify-content: space-between; padding: 16px 40px; border-bottom: 3px solid #000; }
          .destino { font-size: 72px; font-weight: 900; letter-spacing: 1px; }
          .planta { font-size: 34px; font-weight: 700; }
          table.datos { width: 100%; border-collapse: collapse; font-size: 36px; font-weight: 800; table-layout: fixed; }
          table.datos tr { border-bottom: 3px solid #000; }
          .etiqueta-campo { padding: 20px 24px; border-right: 3px solid #000; width: 35%; }
          .valor-campo { padding: 20px 24px; text-align: center; overflow-wrap: break-word; }
          .valor-desc { font-size: 22px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; max-height: 3.6em; }
          .valor-parcial { background: #ffe9a8; }
          .zona-qr { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-top: 3px solid #000; }
          .lote-num { font-family: monospace; font-size: 22px; font-weight: 700; margin-top: 10px; }
        </style>
      </head>
      <body>
        ${pallets.map(p => hojaHTML(p)).join('')}
        <script>window.onload=()=>{window.print();}<\/script>
      </body></html>
    `);
    w.document.close();

    // Marca estos pallets como "etiqueta impresa" para que la próxima vez no se vuelvan a imprimir por accidente
    const { writeBatch, serverTimestamp } = window.fb;
    const batch = writeBatch(db);
    pallets.forEach(p => batch.update(doc(db, 'shipqr_pallets', p.id), { etiqueta_impresa: true, etiqueta_impresa_at: serverTimestamp() }));
    await batch.commit();
    aplicarFiltrosProduccion();
  } catch (e) {
    alert('Error generando la etiqueta: ' + e.message);
    console.error('Error en imprimirEtiquetaLote:', e);
  }
};

              <span style="font-size:11px">${fmtNum(l.quantity)} pzas</span>
              ${statusTag(l.status)}
            </div>
          </div>
        `).join('');
    }
  }, (err) => {
    console.error('Error al cargar lotes', err);
    const listEl = document.getElementById('dash-lotes');
    if (listEl) listEl.innerHTML = `<div style="color:#e74c3c;font-size:12px;text-align:center;padding:20px">Error al cargar lotes</div>`;
  });

  if (unsubEmb) unsubEmb();
  const qEmb = query(collection(db, 'shipqr_embarques'), orderBy('created_at', 'desc'));
  unsubEmb = onSnapshot(qEmb, (snap) => {
    const embs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    window.dashEmbCount = embs.length;
    setText('dash-emb-total', embs.length);
    if (window.dashLotesCache) pintarDashboardStats(window.dashLotesCache);
    const embEl = document.getElementById('dash-embarques');
    if (embEl) {
      embEl.innerHTML = embs.length === 0
        ? `<div style="color:#7f8c9a;font-size:13px;text-align:center;padding:20px">Sin embarques</div>`
        : embs.slice(0, 10).map(e => `
          <div style="display:flex;align-items:center;justify-content:space-between;background:#0f1117;border-radius:6px;padding:8px 10px;flex-wrap:wrap;gap:6px">
            <div>
              <span style="font-size:12px;font-weight:600">Embarque ${folioEmb(e)}</span>

            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <button class="btn-secondary" style="font-size:11px;padding:3px 8px" onclick="imprimirPackingList('${e.id}')">🖨 PL</button>
              <span class="tag ${e.status==='CLOSED'?'tag-shipped':'tag-ready'}">${e.status}</span>
            </div>
          </div>
        `).join('');
    }
  }, (err) => {
    console.error('Error al cargar embarques', err);
    const embEl = document.getElementById('dash-embarques');
    if (embEl) embEl.innerHTML = `<div style="color:#e74c3c;font-size:12px;text-align:center;padding:20px">Error al cargar embarques</div>`;
  });

  if (unsubDashStepper) unsubDashStepper();
  const qActivo = query(collection(db, 'shipqr_embarques'), where('status', 'in', ['OPEN', 'LOADING']));
  unsubDashStepper = onSnapshot(qActivo, async (snap) => {
    const embs = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.created_at?.toMillis?.() || 0) - (a.created_at?.toMillis?.() || 0));
    await pintarEmbActivoStepperDash(embs[0] || null);
  }, (err) => {
    console.error('Error al cargar embarque activo del stepper:', err);
    const el = document.getElementById('dash-emb-stepper');
    if (el) el.innerHTML = '';
  });
}

async function pintarEmbActivoStepperDash(emb) {
  const el = document.getElementById('dash-emb-stepper');
  if (!el) return;
  if (!emb) { el.innerHTML = ''; pintarContenedorDash(null); return; }

  pintarContenedorDash(emb);
  const pallets = await obtenerPalletsAprobadosEmbarque(emb.id);
  const total = pallets.length;
  const cargados = pallets.filter(p => p.status === 'SHIPPED').length;
  const rampaLista = total > 0 && cargados === total;

  const pasos = [
    { label: 'Producción', done: true },
    { label: 'QC', done: true },
    { label: 'Embarque', done: true },
    { label: 'PL', done: true },
    { label: 'Rampa', done: rampaLista, active: !rampaLista },
    { label: 'Cerrado', done: false }
  ];

  const circulo = (p, i) => p.done
    ? `<div style="width:24px;height:24px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--bg)">✓</div>`
    : p.active
      ? `<div style="width:24px;height:24px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--bg)">${i+1}</div>`
      : `<div style="width:24px;height:24px;border-radius:50%;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)">${i+1}</div>`;

  el.innerHTML = `
    <div class="card" style="border-left:3px solid var(--accent)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px">
        <span style="font-size:13px;font-weight:600">Embarque activo · ${folioEmb(emb)} · ${emb.destino||'DALLAS'}</span>
        <span style="font-size:11px;color:var(--accent);font-weight:700">${rampaLista ? 'LISTO PARA CERRAR' : 'EN PROGRESO'}</span>
      </div>
      <div style="display:flex;align-items:flex-start">
        ${pasos.map((p, i) => `
          <div style="display:flex;flex-direction:column;align-items:center;flex:1">
            ${circulo(p, i)}
            <span style="font-size:10px;margin-top:5px;text-align:center;color:${p.active ? 'var(--accent)' : 'var(--muted)'};font-weight:${p.active ? 700 : 400}">${p.label}</span>
          </div>
          ${i < pasos.length - 1 ? `<div style="height:1px;background:${p.done ? 'var(--green)' : 'var(--border)'};flex:1;margin-top:12px"></div>` : ''}
        `).join('')}
      </div>
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)">${fmtNum(cargados)} de ${fmtNum(total)} pallets cargados en rampa</div>
    </div>
  `;
}

function pintarDashboardStats(lotes) {
  const counts = {
    total: lotes.length,
    pend: lotes.filter(l => l.status === 'QC_PENDING').length,
    aprob: lotes.filter(l => l.status === 'QC_APPROVED').length,
    rech: lotes.filter(l => l.status === 'QC_REJECTED').length,
    listos: lotes.filter(l => l.status === 'READY_TO_SHIP').length,
    embarcados: lotes.filter(l => l.status === 'SHIPPED').length,
  };
  const statsEl = document.getElementById('dash-stats');
  if (!statsEl) return;
  const cards = [
    { label: 'Total', value: counts.total, color: '#4f8ef7' },
    { label: 'QC Pend.', value: counts.pend, color: '#f1c40f' },
    { label: 'Aprobados', value: counts.aprob, color: '#2ecc71' },
    { label: 'Rechazados', value: counts.rech, color: '#e74c3c' },
    { label: 'Listos', value: counts.listos, color: '#4f8ef7' },
    { label: 'Embarcados', value: counts.embarcados, color: '#2ecc71' },
    { label: 'Embarques', value: window.dashEmbCount || 0, color: '#f1c40f' },
  ];
  statsEl.innerHTML = cards.map(c => `
    <div class="card" style="text-align:center;border-top:3px solid ${c.color}">

      <div style="font-size:22px;font-weight:700;color:${c.color}">${c.value}</div>

}

// Escáner de QC: permite aprobar/rechazar escaneando la papeleta del pallet, además de los botones de la lista
window.toggleQcScanner = function() {
  const wrap = document.getElementById('qc-scanner-wrap');
  if (!wrap) return;
  const abierto = wrap.style.display !== 'none';
  if (abierto) {
    wrap.style.display = 'none';
    wrap.innerHTML = '';
    if (html5QrCodeQC) { try { html5QrCodeQC.stop(); } catch(e) {} html5QrCodeQC = null; }
    return;
  }
  wrap.style.display = 'block';
  wrap.innerHTML = `
    <div class="card" style="padding:16px;text-align:center">
      <div id="qc-qr-reader" style="width:100%"></div>
      <div id="qc-qr-result" style="margin-top:14px;min-height:40px"></div>
    </div>
  `;
  html5QrCodeQC = new Html5Qrcode('qc-qr-reader');
  html5QrCodeQC.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: 220 },
    onScanSuccessQC,
    () => {}
  ).catch(err => {
    document.getElementById('qc-qr-result').innerHTML = `<div style="color:#e74c3c;font-size:13px">No se pudo acceder a la cámara: ${err}</div>`;
  });
};

async function onScanSuccessQC(decodedText) {
  if (html5QrCodeQC) { try { await html5QrCodeQC.pause(true); } catch(e) {} }
  const resultEl = document.getElementById('qc-qr-result');
  let qr;
  try { qr = JSON.parse(decodedText); } catch(e) {
    resultEl.innerHTML = `<div style="color:#e74c3c;font-size:13px">QR inválido</div>`;
    setTimeout(resumeQcScan, 1800); return;
  }
  if (!qr.pallet) {
    resultEl.innerHTML = `<div style="color:#e74c3c;font-size:13px">Este QR no tiene número de pallet (etiqueta antigua)</div>`;
    setTimeout(resumeQcScan, 2000); return;
  }

  const palletId = `${qr.lot}-P${qr.pallet}`;
  const { db, doc, getDoc } = window.fb;
  const snap = await getDoc(doc(db, 'shipqr_pallets', palletId));
  if (!snap.exists()) {
    resultEl.innerHTML = `<div style="color:#e74c3c;font-size:13px">Pallet ${palletId} no existe en el sistema</div>`;
    setTimeout(resumeQcScan, 2000); return;
  }
  const p = snap.data();
  if (p.status !== 'QC_PENDING') {
    resultEl.innerHTML = `<div style="background:rgba(210,153,34,0.12);color:#f1c40f;padding:10px;border-radius:6px;font-size:13px">Pallet ${p.pallet_numero}/${p.total_pallets} del lote ${p.lot_number} ya fue revisado (${p.status})</div>`;
    setTimeout(resumeQcScan, 2200); return;
  }

  resultEl.innerHTML = `
    <div style="background:#1a1d24;border-radius:6px;padding:12px;text-align:left">
      <div style="font-family:monospace;font-size:13px;color:#4f8ef7;font-weight:600">${p.lot_number} · Pallet ${p.pallet_numero} de ${p.total_pallets}${p.parcial ? ' · PARCIAL' : ''}</div>
      <div style="font-size:11px;color:#7f8c9a;margin:4px 0 10px">${p.modelo||''} · ${p.part_number||''} · ${fmtNum(p.quantity)} pzas</div>
      <textarea id="qc-scan-com" rows="1" placeholder="Comentarios (requerido para rechazar)" style="margin-bottom:8px;font-size:12px;width:100%"></textarea>
      <div style="display:flex;gap:8px">
        <button class="btn-primary" style="flex:1" onclick="qcAprobarDesdeScan('${palletId}')">Aprobar</button>
        <button class="btn-secondary" style="flex:1;border-color:#e74c3c;color:#e74c3c" onclick="qcRechazarDesdeScan('${palletId}')">Rechazar</button>
      </div>
    </div>
  `;
}

window.qcAprobar = async function(palletId, comentariosOverride) {
  if (window.currentUser.role !== 'QC' && window.currentUser.role !== 'ADMIN') { alert('Solo Calidad o Admin pueden aprobar pallets.'); return; }
  const { db, doc, updateDoc, serverTimestamp } = window.fb;
  const comentarios = comentariosOverride !== undefined ? comentariosOverride : (document.getElementById(`qc-com-${palletId}`)?.value || '');
  await updateDoc(doc(db, 'shipqr_pallets', palletId), {
    status: 'QC_APPROVED', qc_aprobado_por: window.currentUser.username,
    qc_comentarios: comentarios, qc_fecha: serverTimestamp(), updated_at: serverTimestamp()
  });
  await actualizarEstadoLotePorPallets(palletId.split('-P')[0]);
  // Al aprobarse, entra solo al embarque activo (si ya no había entrado antes al crearse el lote)
  await agregarPalletsAEmbarqueActivoSiExiste([palletId]);
  await verificarYGenerarPackingListNo(palletId);
};

// Si ya no queda ningún pallet pendiente de QC en el embarque al que pertenece este pallet,
// se genera el folio oficial del Packing List (antes de eso, no existe número todavía)
async function verificarYGenerarPackingListNo(palletId) {
  try {
    const { db, doc, getDoc, updateDoc, collection, query, where, getDocs } = window.fb;
    const embsSnap = await getDocs(query(collection(db, 'shipqr_embarques'), where('lotes', 'array-contains', palletId)));
    for (const embDoc of embsSnap.docs) {
      const emb = embDoc.data();
      if (emb.packing_list_no) continue; // ya tiene folio, no se toca
      const palletIds = emb.lotes || [];
      if (palletIds.length === 0) continue;
      const pallets = (await Promise.all(palletIds.map(async id => {
        const s = await getDoc(doc(db, 'shipqr_pallets', id));
        return s.exists() ? s.data() : null;
      }))).filter(Boolean);
      if (pallets.length === 0) continue;
      const todosRevisados = pallets.every(p => p.status !== 'QC_PENDING');
      if (todosRevisados) {
        const plNo = await calcularPackingListNo();
        await updateDoc(doc(db, 'shipqr_embarques', embDoc.id), { packing_list_no: plNo });
      }
    }
  } catch (e) { console.error('Error verificando/generando folio de PL:', e); }
}

// ⏸️ FUNCIÓN EN PAUSA — requiere plan Firebase Blaze para usar Storage.
// No está conectada a ningún botón visible por ahora. Lista para reactivar cuando se actualice el plan.
window.qcSubirEvidencia = async function(loteId) {
  const fileInput = document.getElementById(`qc-file-${loteId}`);
  const file = fileInput?.files?.[0];
  if (!file) return;

  const tiposValidos = ['application/pdf', 'application/vnd.ms-excel', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'];
  const extensionValida = /\.(pdf|xls|xlsx)$/i.test(file.name);
  if (!tiposValidos.includes(file.type) && !extensionValida) {
    alert('Solo se permiten archivos PDF o Excel (.pdf, .xls, .xlsx)');
    fileInput.value = '';
    return;
  }

  const btn = document.getElementById(`qc-evid-btn-${loteId}`);
  const statusEl = document.getElementById(`qc-evid-status-${loteId}`);
  const aprobBtn = document.getElementById(`qc-aprob-btn-${loteId}`);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Subiendo...'; }
  if (statusEl) statusEl.innerHTML = '';

  try {
    const { storage, storageRef, uploadBytes, getDownloadURL, db, doc, updateDoc, serverTimestamp } = window.fb;
    const rutaArchivo = `qc_evidencias/${loteId}/${Date.now()}_${file.name}`;
    const ref = storageRef(storage, rutaArchivo);
    await uploadBytes(ref, file);
    const url = await getDownloadURL(ref);

    await updateDoc(doc(db, 'shipqr_lotes', loteId), {
      evidencia_url: url,
      evidencia_nombre: file.name,
      evidencia_subida_por: window.currentUser.username,
      evidencia_fecha: serverTimestamp(),
      updated_at: serverTimestamp()
    });

    if (btn) { btn.disabled = false; btn.style.borderColor = '#2ecc71'; btn.style.color = '#2ecc71'; btn.style.borderStyle = 'solid'; btn.textContent = `📎 ${file.name}`; }

    if (statusEl) statusEl.innerHTML = '<span style="color:#2ecc71">✓ Evidencia subida correctamente</span>';

// Recalcula un estado resumen para el LOTE completo, a partir del estado de todos sus pallets.
// Esto es solo para que Producción/Dashboard (que muestran el lote) no queden desactualizados;
// la fuente real de verdad para QC/Rampa/Embarques sigue siendo cada pallet individual.
async function actualizarEstadoLotePorPallets(loteId) {
  try {
    const { db, doc, updateDoc, collection, query, where, getDocs } = window.fb;
    const snap = await getDocs(query(collection(db, 'shipqr_pallets'), where('lot_number', '==', loteId)));
    if (snap.empty) return;
    const estados = snap.docs.map(d => d.data().status);
    let resumen;
    if (estados.every(s => s === 'SHIPPED')) resumen = 'SHIPPED';
    else if (estados.some(s => s === 'READY_TO_SHIP' || s === 'SHIPPED')) resumen = 'READY_TO_SHIP';
    else if (estados.some(s => s === 'QC_REJECTED')) resumen = 'QC_REJECTED';
    else if (estados.every(s => s === 'QC_APPROVED')) resumen = 'QC_APPROVED';
    else resumen = 'QC_PENDING';
    await updateDoc(doc(db, 'shipqr_lotes', loteId), { status: resumen });
  } catch (e) { console.error('Error actualizando estado resumen del lote:', e); }
}

// Agrega TODOS los pallets de un lote (urgente/no planeado) al embarque activo, y los marca listos para Rampa
window.agregarLoteEmbarque = async function(embId, loteId) {
  const { db, doc, getDoc, updateDoc, collection, query, where, getDocs, writeBatch } = window.fb;
  const palletsSnap = await getDocs(query(collection(db, 'shipqr_pallets'), where('lot_number', '==', loteId)));
  if (palletsSnap.empty) { alert(`El lote ${loteId} no tiene pallets generados.`); return; }

  const embRef = doc(db, 'shipqr_embarques', embId);
  const embSnap = await getDoc(embRef);
  const actuales = embSnap.data()?.lotes || [];
  const batch = writeBatch(db);
  let algunoNoAprobado = false;
  palletsSnap.forEach(d => {
    if (!actuales.includes(d.id)) actuales.push(d.id);
    // Solo se marca listo para Rampa si ya pasó QC; los pendientes/rechazados se agregan al embarque
    // (así ya no hace falta esperarlos), pero mantienen su estado real para que QC los siga revisando
    if (d.data().status === 'QC_APPROVED') {
      batch.update(doc(db, 'shipqr_pallets', d.id), { status: 'READY_TO_SHIP' });
    } else if (d.data().status !== 'READY_TO_SHIP' && d.data().status !== 'SHIPPED') {
      algunoNoAprobado = true;
    }
  });
  await updateDoc(embRef, { lotes: actuales });
  await batch.commit();
  await actualizarEstadoLotePorPallets(loteId);
  if (palletsSnap.docs[0]) await verificarYGenerarPackingListNo(palletsSnap.docs[0].id);
  if (algunoNoAprobado) alert(`Aviso: el lote ${loteId} se agregó al embarque, pero tiene pallets que aún no pasan QC (pendientes o rechazados). Esos no entrarán al PL final hasta que se revisen.`);
};

// ── Monto de venta (USD) del PL: piezas del PL final x precio vigente del Master de precios ──
// Se calcula con exactamente los mismos pallets que forman el PL final (armarFilasPackingList con soloAprobados=true).
window.calcularMontoEmbarque = async function(embId) {
  const { filas } = await armarFilasPackingList(embId, true);
  const precios = await leerPreciosMaster();
  const grupos = {};
  let piezas = 0;
  filas.forEach(f => {
    const pn = String(f.part_number || '').trim().toUpperCase();
    const q = f.quantity || 0;
    const g = grupos[pn] || (grupos[pn] = { modelo: f.modelo || '', pn, pcs: 0, pallets: 0 });
    g.pcs += q; g.pallets += 1; piezas += q;
  });
  let total = 0, sinPrecio = 0;
  const por_modelo = Object.values(grupos).map(g => {
    const pr = precios[g.pn];
    const precio = pr && pr.precio > 0 ? pr.precio : 0;
    const monto = Math.round(g.pcs * precio * 100) / 100;
    if (!precio) sinPrecio += g.pcs;
    total += monto;
    return { modelo: g.modelo, pn: g.pn, pallets: g.pallets, pcs: g.pcs, precio, monto };
  }).sort((a, b) => b.monto - a.monto);
  return { total_usd: Math.round(total * 100) / 100, piezas, por_modelo, sin_precio_pcs: sinPrecio };
};

// Guarda ("congela") el monto en el embarque al cerrarlo: el historial siempre usa este valor, aunque el precio cambie después.
// Si algo falla NO bloquea el cierre del embarque (solo queda en consola).
async function congelarMontoEmbarque(embId) {
  try {
    const { db, doc, updateDoc } = window.fb;
    const r = await calcularMontoEmbarque(embId);
    r.congelado_at = new Date().toISOString();
    r.congelado_por = (window.currentUser && window.currentUser.username) || '';
    await updateDoc(doc(db, 'shipqr_embarques', embId), { monto_resumen: r });
  } catch (e) { console.error('No se pudo congelar el monto del embarque ' + embId, e); }
}

// soloAprobados=true (por defecto): arma el PL FINAL, solo con pallets ya verificados por QC (Embarques, Excel, impresión).
// soloAprobados=false: arma el PRE-PL con todos los pallets sin importar su estado (vista previa en Producción).
async function armarFilasPackingList(embId, soloAprobados = true) {
  const { db, doc, getDoc } = window.fb;
  const embSnap = await getDoc(doc(db, 'shipqr_embarques', embId));
  const emb = { ...(embSnap.data() || {}), id: embId };
  const palletIds = emb.lotes || []; // el campo se llama "lotes" por compatibilidad, pero ahora guarda IDs de pallet
  let pallets = (await Promise.all(palletIds.map(async (id) => {
    const r = await getDoc(doc(db, 'shipqr_pallets', id));
    return r.exists() ? { id: r.id, ...r.data() } : null;
  }))).filter(Boolean);
  if (soloAprobados) {
    pallets = pallets.filter(p => p.status === 'QC_APPROVED' || p.status === 'READY_TO_SHIP' || p.status === 'SHIPPED');
  }
  // Cada fila del PL es un pallet real (con sus cajas/piezas exactas, incluyendo parciales), no el lote completo
  const filas = await Promise.all(pallets.map(async p => {
    const info = await calcularEmpaque(p.modelo, p.quantity, p.part_number);
    const emMaestro = info.ok ? await getEmpaqueModelo(p.modelo, p.part_number) : null;
    // Antes: (p.cajas * pesoCajaCompleta) -- contaba la caja parcial como si fuera caja completa.
    // Ahora: calcularPesoReal usa las piezas reales del pallet (p.quantity), así la última
    // caja parcial pesa proporcional a lo que realmente contiene.
    const peso = emMaestro ? calcularPesoReal(p.quantity || 0, emMaestro.pcsPorCaja, emMaestro.pesoCajaCompleta || 0) : 0;
    // REMPLAZO guarda el pallet real con cajas:0 (no reparte en cajas, 1 pallet con la cantidad exacta).
    // Eso es correcto para QC/pallet físico, pero en el Packing List se ve como si faltara el dato.
    // SOLO para mostrar en el PL, si hay empaque estándar del modelo, se usa el Box Qty calculado
    // (info.boxQty) para que Pcs/Box x Box Qty = Total Qty. El pallet real (p.cajas) no se modifica.
    const esRemplazo = (p.motivo || '').toUpperCase() === 'REMPLAZO';
    const boxQtyPL = (esRemplazo && info.ok) ? info.boxQty : p.cajas;
    return {
      lot_number: p.lot_number, part_number: p.part_number, motivo: (p.motivo || 'PLAN').toUpperCase(),
      pallet_numero: p.pallet_numero, total_pallets: p.total_pallets, parcial: p.parcial, status: p.status,
      tipo: info.tipo, fscType: info.fscType, descripcion: info.descripcion || p.modelo, modelo: p.modelo, rev: info.rev,
      pcsPorCaja: info.pcsPorCaja, cajasPorPallet: info.cajasPorPallet, boxQty: boxQtyPL, quantity: p.quantity, peso, pallet: 1
    };
  }));
  return { emb, filas };
}

// Muestra la cantidad REAL de piezas por caja para la columna "Pcs / Box", en vez del valor fijo
// de la base de datos (Empaque). Si todas las cajas de esa parte son de tamaño estándar, se ve
// igual que antes (ej. 100). Si la última caja quedó parcial, muestra la cantidad real de esa caja
// (ej. 50), o "100 + 60" cuando hay cajas completas Y una parcial mezcladas en el mismo renglón.
function formatPcsPorCajaReal(totalQty, pcsPorCaja) {
  if (!pcsPorCaja) return 0;
  const cajasCompletas = Math.floor((totalQty || 0) / pcsPorCaja);
  const resto = (totalQty || 0) - cajasCompletas * pcsPorCaja;
  if (resto === 0) return pcsPorCaja;          // todas las cajas son estándar, sin parcial
  if (cajasCompletas === 0) return resto;      // una sola caja, totalmente parcial
  return `${pcsPorCaja} + ${resto}`;           // mezcla: cajas completas + 1 caja parcial
}

// Consolida las filas por pallet en una fila por NÚMERO DE PARTE (sumando pallets, cajas y piezas de todos sus pallets).
// Así es como debe verse el PL final impreso/descargado — el detalle por pallet es solo para Producción/QC.
function consolidarPorParte(filas) {
  const grupos = {};
  const orden = [];
  filas.forEach(f => {
    const motivo = f.motivo || 'PLAN';
    const key = (f.part_number || '(sin parte)') + '|' + motivo;
    if (!grupos[key]) {
      grupos[key] = { part_number: f.part_number, motivo, tipo: f.tipo, rev: f.rev, descripcion: f.descripcion, fscType: f.fscType, pcsPorCaja: f.pcsPorCaja, cajasPorPallet: f.cajasPorPallet, palletQty: 0, boxQty: 0, parciales: 0, totalQty: 0, weight: 0, lotNumbers: [], statuses: [] };
      orden.push(key);
    }
    grupos[key].palletQty += 1;
    grupos[key].boxQty += f.boxQty || 0;
    grupos[key].totalQty += f.quantity || 0;
    grupos[key].weight += f.peso || 0;
    if (f.lot_number && !grupos[key].lotNumbers.includes(f.lot_number)) grupos[key].lotNumbers.push(f.lot_number);
    if (f.status && !grupos[key].statuses.includes(f.status)) grupos[key].statuses.push(f.status);
  });
  // "Parciales" se recalcula con el TOTAL de cajas ya sumado entre todos los lotes de esa parte, contra
  // el estándar de cajas/pallet del modelo — así se evita marcar parciales "falsos" que solo existen porque
  // el cálculo original se hizo lote por lote (ej. 48 cajas de 2 lotes distintos, con 24 cajas/pallet, son
  // 2 pallets completos reales, no 1 completo + 2 parciales). Esto NO toca los pallets físicos/QR/QC.
  orden.forEach(k => {
    const g = grupos[k];
    if (g.cajasPorPallet > 0) {
      g.parciales = (g.boxQty % g.cajasPorPallet === 0) ? 0 : 1;
    } else {
      g.parciales = 0;
    }
  });
  return orden.map(k => grupos[k]);
}

  READY_TO_SHIP:{ label: 'Listo',     color: '#3498db' },
  SHIPPED:      { label: 'Embarcado', color: '#9b59b6' }
};
function badgeStatusPL(statuses) {
  if (!statuses || statuses.length === 0) return '';
  return statuses.map(s => {
    const info = PL_STATUS_LABELS[s] || { label: s, color: '#7f8c9a' };
    return `<span style="display:inline-block;background:${info.color}22;color:${info.color};border:1px solid ${info.color};border-radius:4px;padding:2px 6px;font-size:10px;font-weight:600;margin:1px">${info.label}</span>`;
  }).join(' ');
}

window.descargarPackingList = async function(embId, soloAprobados = true) {

  const consolidado = consolidarPorParte(filas);
  const totalPallet = consolidado.reduce((s, l) => s + l.palletQty, 0);
  const totalBox = consolidado.reduce((s, l) => s + l.boxQty, 0);
  const totalQty = consolidado.reduce((s, l) => s + l.totalQty, 0);
  const totalPeso = consolidado.reduce((s, l) => s + l.weight, 0);
  const plNo = emb.packing_list_no || embId.slice(0,6);

  const workbook = new ExcelJS.Workbook();

  const col = { B:2, C:3, D:4, E:5, F:6, G:7, H:8, I:9, J:10, K:11, L:12, M:13 };
  const set = (r, c, v) => { ws.getCell(r, c).value = v; };
  const negrita = (r, c) => { ws.getCell(r, c).font = { bold: true }; };

  set(2, col.C, 'Date:'); negrita(2, col.C); set(2, col.D, new Date());

  set(3, col.D, PL_EMPRESA.nombre);
  set(4, col.D, PL_EMPRESA.direccion1);
  set(4, col.H, 'Prepared by:'); negrita(4, col.H); set(4, col.J, emb.prepared_by || ''); ws.mergeCells(4, col.J, 4, col.K);
  set(5, col.D, PL_EMPRESA.direccion2);

  set(6, col.B, 'To:'); negrita(6, col.B); set(6, col.C, PL_DESTINATARIO.nombre);
  set(7, col.C, PL_DESTINATARIO.direccion1);
  set(8, col.C, PL_DESTINATARIO.direccion2);

  set(9, col.F, 'Certify FSC No:'); negrita(9, col.F); set(9, col.G, PL_FSC.certNo);
  set(9, col.J, PL_FSC.licenseLabel); negrita(9, col.J); set(9, col.K, PL_FSC.licenseNo);

  // Pre-PL: aviso de "no oficial" + columna Status (como en la vista previa)
  if (esPrePL) {
    set(10, col.B, `⚠ PRE-PL — no oficial. Incluye pallets pendientes de QC. Generado: ${new Date().toLocaleString('es-MX')}`);
    ws.getCell(10, col.B).font = { bold: true, color: { argb: 'FFB7950B' } };
  }
  const encabezados = ['Lot Number', '  Part#', 'TYPE', 'REV.', 'Description', 'FSC type', 'Pcs / Box', 'Pallet Qty', 'Box Qty', 'Parciales', 'Total Qty', 'Weight'];
  if (esPrePL) { encabezados.push('Status'); ws.getColumn(col.M + 1).width = 22; }
  encabezados.forEach((h, i) => { const c = col.B + i; set(11, c, h); negrita(11, c); });

  let r = 12;
  consolidado.forEach(g => {
    set(r, col.B, g.lotNumbers.join(', ') + (g.motivo==='REMPLAZO' ? ' (REMPLAZO)' : ''));
    set(r, col.C, g.part_number || ''); set(r, col.D, g.tipo || ''); set(r, col.E, g.rev || '0');
    set(r, col.F, g.descripcion || ''); set(r, col.G, g.fscType || ''); set(r, col.H, formatPcsPorCajaReal(g.totalQty, g.pcsPorCaja));

    if (esPrePL) set(r, col.M + 1, (g.statuses || []).map(s => (PL_STATUS_LABELS[s] || { label: s }).label).join(', '));
    r++;
  });

  r += 2;
  set(r, col.I, 'Total Pallet   '); negrita(r, col.I); set(r, col.L, totalPallet); r++;
  set(r, col.I, 'Total box   ');    negrita(r, col.I); set(r, col.L, totalBox);    r++;
  set(r, col.I, 'Total Pcs   ');    negrita(r, col.I); set(r, col.L, totalQty);    r++;

  ws.addImage(imageId, { tl: { col: 1, row: 0 }, ext: { width: 130, height: 43 } });

  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = esPrePL ? `PrePL_${plNo}.xlsx` : `PackingList_${plNo}.xlsx`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

// Genera el PDF renderizando exactamente el mismo diseño de la vista previa (mismo encabezado, tabla y totales)
window.descargarPDF = async function(embId) {
  const { emb, filas } = await armarFilasPackingList(embId, true);
  const consolidado = consolidarPorParte(filas);
  const plNo = emb.packing_list_no || embId.slice(0,6);
  const fechaTxt = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

  const contenedor = document.createElement('div');
  contenedor.style.position = 'fixed';
  contenedor.style.left = '-9999px';
  contenedor.style.top = '0';
  contenedor.style.width = '960px';
  contenedor.innerHTML = construirContenidoHtmlPL(emb, consolidado, plNo, fechaTxt);
  document.body.appendChild(contenedor);

  try {
    const canvas = await html2canvas(contenedor, { scale: 2, backgroundColor: '#ffffff' });
    document.body.removeChild(contenedor);

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'letter' });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * (imgWidth / canvas.width);
    const imgData = canvas.toDataURL('image/png');

    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while (heightLeft > 0) {
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    pdf.save(`PackingList_${plNo}.pdf`);
  } catch (e) {
    if (contenedor.parentNode) document.body.removeChild(contenedor);
    alert('Error generando el PDF: ' + e.message);
    console.error('Error en descargarPDF:', e);
  }
};

window.recibirTodoManualP3 = async function(embId) {
  const pallets = await obtenerPalletsAprobadosEmbarque(embId);
  const pendientes = pallets.filter(p => p.status === 'QC_APPROVED');
  if (pendientes.length === 0) { alert('No hay pallets pendientes de recibir en este embarque (QC_APPROVED).'); return; }

  const totalQty = pendientes.reduce((s, p) => s + (p.quantity || 0), 0);
  if (!confirm(`⚠️ ESTO ES EXCEPCIONAL — solo úsalo si el material ya está físicamente en Almacén P3 y no puedes escanear las etiquetas.\n\nSe van a marcar como RECIBIDOS ${pendientes.length} pallet(s) — ${fmtNum(totalQty)} pzas — SIN escanear.\n\n¿Confirmas que estos pallets SÍ están físicamente en Almacén P3?`)) return;
  if (prompt('Para confirmar, escribe CONFIRMAR:') !== 'CONFIRMAR') { alert('Cancelado — no se marcó nada.'); return; }

  try {

    const batch = writeBatch(db);
    pendientes.forEach(p => batch.update(doc(db, 'shipqr_pallets', p.id), { status: 'READY_TO_SHIP', updated_at: serverTimestamp() }));
    await batch.commit();
    const lotesUnicos = [...new Set(pendientes.map(p => p.lot_number))];
    await Promise.all(lotesUnicos.map(actualizarEstadoLotePorPallets));
    alert(`Listo. Se marcaron ${pendientes.length} pallet(s) como recibidos manualmente en P3.`);

  } catch (e) {
    alert('Error al marcar como recibidos: ' + e.message);

  }
};

async function onScanSuccessRecepcion(decodedText) {
  if (html5QrCodeRecepcion) { try { await html5QrCodeRecepcion.pause(true); } catch(e) {} }
  const resultEl = document.getElementById('recep-qr-result');
  let qr;
  try { qr = JSON.parse(decodedText); } catch(e) {
    resultEl.innerHTML = `<div style="color:#e74c3c;font-size:13px">QR inválido</div>`;
    setTimeout(resumeScanRecepcion, 1800); return;
  }
  if (!qr.pallet) {
    resultEl.innerHTML = `<div style="color:#e74c3c;font-size:13px">Este QR no tiene número de pallet (etiqueta antigua)</div>`;
    setTimeout(resumeScanRecepcion, 2000); return;
  }

  const { db, doc, getDoc, updateDoc, serverTimestamp, setDoc } = window.fb;
  const palletId = `${qr.lot}-P${qr.pallet}`;
  const ref = doc(db, 'shipqr_pallets', palletId);
  const snap = await getDoc(ref);

  const registrarEscaneo = (data) => setDoc(doc(db, 'shipqr_estado', 'ultimo_escaneo'), { ...data, ts: serverTimestamp() }).catch(()=>{});

  if (!snap.exists()) {
    resultEl.innerHTML = `<div style="background:rgba(226,75,74,0.12);color:#e74c3c;padding:12px;border-radius:6px;font-size:13px">Pallet ${palletId} no existe en el sistema</div>`;
    registrarEscaneo({ lot_number: qr.lot, resultado: 'ERROR', mensaje: 'No existe en el sistema' });
    setTimeout(resumeScanRecepcion, 1800); return;
  }

  const p = snap.data();
  const etiquetaPallet = `Pallet ${p.pallet_numero}/${p.total_pallets}`;
  if (p.status === 'QC_PENDING' || p.status === 'QC_REJECTED') {
    resultEl.innerHTML = `<div style="background:rgba(226,75,74,0.12);color:#e74c3c;padding:12px;border-radius:6px;font-size:13px">${p.lot_number} · ${etiquetaPallet} — ${p.status === 'QC_PENDING' ? 'pendiente de QC' : 'rechazado por QC'} — NO recibir</div>`;
    registrarEscaneo({ lot_number: p.lot_number, quantity: p.quantity||0, resultado: 'ERROR', mensaje: `${etiquetaPallet}: ${p.status === 'QC_PENDING' ? 'QC pendiente' : 'Rechazado por QC'}` });
    setTimeout(resumeScanRecepcion, 2200); return;
  }
  if (p.status === 'READY_TO_SHIP' || p.status === 'SHIPPED') {
    resultEl.innerHTML = `<div style="background:rgba(210,153,34,0.12);color:#f1c40f;padding:12px;border-radius:6px;font-size:13px">${p.lot_number} · ${etiquetaPallet} ya fue recibido en Almacén P3</div>`;
    registrarEscaneo({ lot_number: p.lot_number, quantity: p.quantity||0, resultado: 'WARNING', mensaje: `${etiquetaPallet}: Ya recibido` });
    setTimeout(resumeScanRecepcion, 2200); return;
  }

  // p.status === 'QC_APPROVED' → único caso válido aquí: se recibe de P4 y entra al almacén de P3
  await updateDoc(ref, { status: 'READY_TO_SHIP', updated_at: serverTimestamp() });
  await actualizarEstadoLotePorPallets(p.lot_number);
  pintarChecklistRecepcion();
  resultEl.innerHTML = `<div style="background:rgba(63,185,80,0.12);color:#2ecc71;padding:12px;border-radius:6px;font-size:13px">✅ Recibido en Almacén P3 — ${p.lot_number} · ${etiquetaPallet} (${fmtNum(p.quantity)} pzas)<br><span style="font-size:11px;color:#7f8c9a">Queda en espera del día de envío</span></div>`;
  registrarEscaneo({ lot_number: p.lot_number, quantity: p.quantity||0, resultado: 'OK', mensaje: `${etiquetaPallet}: Recibido en P3` });
  setTimeout(resumeScanRecepcion, 2200);
}

// Trae todos los pallets ya verificados por QC (aprobados en adelante) que pertenecen al embarque activo —
// esta es la misma lista que compone el PL final, para ir cotejando conforme se cargan al contenedor
async function obtenerPalletsAprobadosEmbarque(embId) {
  const { db, doc, getDoc } = window.fb;
  const embSnap = await getDoc(doc(db, 'shipqr_embarques', embId));
  const emb = embSnap.data() || {};
  const ids = emb.lotes || [];
  const pallets = (await Promise.all(ids.map(async id => {
    const s = await getDoc(doc(db, 'shipqr_pallets', id));
    return s.exists() ? { id: s.id, ...s.data() } : null;
  }))).filter(p => p && (p.status === 'QC_APPROVED' || p.status === 'READY_TO_SHIP' || p.status === 'SHIPPED'));
  return pallets.sort((a, b) => (a.lot_number + String(a.pallet_numero).padStart(3,'0')).localeCompare(b.lot_number + String(b.pallet_numero).padStart(3,'0')));
}

// Marca de golpe TODOS los pallets "En almacén, listos para cargar" (READY_TO_SHIP) del embarque activo
// como SHIPPED, sin necesidad de escanear cada QR uno por uno. Es un atajo EXCEPCIONAL para cuando
// no se tienen las etiquetas físicas a la mano — no toca pallets que sigan en QC pendiente/rechazado
// ni los que aún no se reciben en P3 (esos primero deben resolverse por su flujo normal).
window.cargarTodoManualRampa = async function(embId) {
  const pallets = await obtenerPalletsAprobadosEmbarque(embId);

  if (pendientes.length === 0) { alert('No hay pallets listos para cargar en este embarque (READY_TO_SHIP).'); return; }

  const totalQty = pendientes.reduce((s, p) => s + (p.quantity || 0), 0);
  if (!confirm(`⚠️ ESTO ES EXCEPCIONAL — solo úsalo si ya cargaste físicamente el trailer y no puedes escanear las etiquetas.\n\nSe van a marcar como CARGADOS (SHIPPED) ${pendientes.length} pallet(s) — ${fmtNum(totalQty)} pzas — SIN escanear.\n\n¿Confirmas que estos pallets SÍ están físicamente en el trailer?`)) return;
  if (prompt('Para confirmar, escribe CONFIRMAR:') !== 'CONFIRMAR') { alert('Cancelado — no se marcó nada.'); return; }

  try {
    const { db, doc, writeBatch, serverTimestamp } = window.fb;
    const batch = writeBatch(db);
    pendientes.forEach(p => batch.update(doc(db, 'shipqr_pallets', p.id), { status: 'SHIPPED', updated_at: serverTimestamp() }));
    await batch.commit();
    const lotesUnicos = [...new Set(pendientes.map(p => p.lot_number))];
    await Promise.all(lotesUnicos.map(actualizarEstadoLotePorPallets));
    alert(`Listo. Se marcaron ${pendientes.length} pallet(s) como cargados manualmente.`);
    pintarChecklistRampa();
  } catch (e) {
    alert('Error al marcar como cargados: ' + e.message);

  }
};

// Para cuando el trailer se fue incompleto. NO cambia el estado de los pallets que se quedan
// (siguen READY_TO_SHIP / QC_APPROVED / QC_PENDING, su QC no se toca): solo los saca de este
// embarque y los pasa al siguiente. Los que el usuario marca como "sí se subieron sin escanear"
// pasan a SHIPPED y se quedan en este embarque (entran al PL final).
window.abrirCierreParcial = async function(embId) {
  try {
    const { db, doc, getDoc } = window.fb;
    const embSnap = await getDoc(doc(db, 'shipqr_embarques', embId));
    const ids = embSnap.data()?.lotes || [];
    const pallets = (await Promise.all(ids.map(async id => {
      const s = await getDoc(doc(db, 'shipqr_pallets', id));
      return s.exists() ? { id: s.id, ...s.data() } : null;
    }))).filter(Boolean);
    const orden = (a, b) => (a.lot_number + String(a.pallet_numero).padStart(3,'0')).localeCompare(b.lot_number + String(b.pallet_numero).padStart(3,'0'));
    const enviados = pallets.filter(p => p.status === 'SHIPPED');
    const seleccionables = pallets.filter(p => p.status === 'READY_TO_SHIP').sort(orden);
    const otros = pallets.filter(p => p.status !== 'SHIPPED' && p.status !== 'READY_TO_SHIP').sort(orden);
    const qtyDe = {}; pallets.forEach(p => { qtyDe[p.id] = p.quantity || 0; });

    document.getElementById('cp-modal')?.remove();
    const m = document.createElement('div');
    m.id = 'cp-modal';
    m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px';
    const cabecera = (p) => `
          <span style="font-family:monospace;font-size:12px;color:#4f8ef7">${p.lot_number}</span>
          <span style="font-size:11px;color:#7f8c9a">${t('word_pallet')} ${p.pallet_numero}/${p.total_pallets}${p.parcial ? ' · ' + t('word_parcial') : ''}</span>`;
    const pie = (p, extra) => `<span style="font-size:11px;color:#7f8c9a;white-space:nowrap">${p.part_number || ''} · ${fmtNum(p.quantity)} pzas${extra || ''}</span>`;
    const filaSel = (p) => `
      <div class="cp-row" data-id="${p.id}" style="background:#0f1117;border-radius:6px;padding:8px 10px;border:1px solid transparent">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <label style="display:flex;gap:8px;align-items:center;cursor:pointer">
            <input type="checkbox" class="cp-chk" value="${p.id}">${cabecera(p)}
          </label>
          ${pie(p)}
        </div>
        <div class="cp-qty-box" style="display:none;align-items:center;gap:8px;margin-top:8px;padding-left:26px;flex-wrap:wrap">
          <span style="font-size:12px;color:#7f8c9a">${t('cp_pzas_fueron')}:</span>
          <input type="number" class="cp-qty" data-id="${p.id}" min="1" max="${p.quantity || 0}" value="${p.quantity || 0}" style="width:100px">
          <span class="cp-qty-msg" style="font-size:12px;color:#2ecc71">${t('cp_completo')}</span>
        </div>
      </div>`;
    const filaOtro = (p) => `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#0f1117;border-radius:6px;padding:8px 10px">
        <span style="display:flex;gap:8px;align-items:center">${cabecera(p)}</span>
        ${pie(p, ' · ' + p.status)}
      </div>`;
    m.innerHTML = `
      <div class="card" style="width:100%;max-width:480px;max-height:90vh;overflow-y:auto">
        <div style="font-size:15px;font-weight:700;color:#f39c12;margin-bottom:6px">${t('cp_titulo')}</div>
        <div style="font-size:12px;color:#7f8c9a;margin-bottom:12px">${t('cp_desc')}</div>
        <div style="font-size:11px;color:#2ecc71;margin-bottom:10px">✅ ${t('cp_ya_cargados')}: ${enviados.length}</div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">
          ${seleccionables.length ? seleccionables.map(filaSel).join('') : `<div style="font-size:12px;color:#7f8c9a;text-align:center;padding:8px">${t('cp_sin_marcar')}</div>`}
        </div>
        ${otros.length ? `<div style="font-size:11px;color:#f1c40f;margin:6px 0">${t('cp_otros')}</div><div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px;opacity:.8">${otros.map(filaOtro).join('')}</div>` : ''}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
          <div style="background:#0f2a1a;border-radius:6px;padding:8px 10px"><div style="font-size:11px;color:#2ecc71">${t('cp_se_van')}</div><div id="cp-cnt-van" style="font-size:16px;font-weight:700;color:#2ecc71"></div></div>
          <div style="background:#2a230f;border-radius:6px;padding:8px 10px"><div style="font-size:11px;color:#f39c12">${t('cp_pasan')}</div><div id="cp-cnt-pasan" style="font-size:16px;font-weight:700;color:#f39c12"></div></div>
        </div>
        <div style="font-size:11px;color:#7f8c9a;margin-bottom:4px">${t('cp_escribe')}</div>
        <input id="cp-confirm" type="text" placeholder="PARCIAL" style="width:100%;margin-bottom:4px">
        <div id="cp-err" style="font-size:11px;color:#e74c3c;min-height:14px;margin-bottom:8px"></div>
        <div style="display:flex;gap:8px">
          <button class="btn-secondary" style="flex:1" onclick="document.getElementById('cp-modal').remove()">${t('cp_btn_cancelar')}</button>
          <button id="cp-ok" class="btn-secondary" style="flex:1;border-color:#f39c12;color:#f39c12">${t('cp_btn_confirmar')}</button>
        </div>
      </div>`;
    document.body.appendChild(m);

    const sumar = (lista) => lista.reduce((a, p) => a + (p.quantity || 0), 0);
    // Lee lo capturado: [{ id, qty }] de los pallets marcados
    const leerMarcados = () => [...m.querySelectorAll('.cp-row')].filter(r => r.querySelector('.cp-chk').checked).map(r => {
      const id = r.dataset.id;
      return { id, qty: parseInt(r.querySelector('.cp-qty').value, 10) || 0 };
    });
    const actualizar = () => {
      m.querySelectorAll('.cp-row').forEach(r => {
        const chk = r.querySelector('.cp-chk').checked;
        r.querySelector('.cp-qty-box').style.display = chk ? 'flex' : 'none';
        r.style.borderColor = chk ? '#f39c12' : 'transparent';
        const total = qtyDe[r.dataset.id];
        const v = parseInt(r.querySelector('.cp-qty').value, 10) || 0;
        const msg = r.querySelector('.cp-qty-msg');
        if (v <= 0 || v > total) { msg.style.color = '#e74c3c'; msg.textContent = t('cp_err_qty').replace('{max}', fmtNum(total)); }
        else if (v === total) { msg.style.color = '#2ecc71'; msg.textContent = t('cp_completo'); }
        else { msg.style.color = '#f39c12'; msg.textContent = t('cp_quedan_nuevo').replace('{n}', fmtNum(total - v)); }
      });
      const marc = leerMarcados();
      const divididos = marc.filter(x => x.qty > 0 && x.qty < qtyDe[x.id]).length;
      const pzasVan = sumar(enviados) + marc.reduce((a, x) => a + Math.min(Math.max(x.qty, 0), qtyDe[x.id]), 0);
      const pzasTotal = sumar(pallets);
      document.getElementById('cp-cnt-van').textContent = `${enviados.length + marc.length} ${t('cp_pallets')} · ${fmtNum(pzasVan)} pzas`;
      document.getElementById('cp-cnt-pasan').textContent = `${seleccionables.length - marc.length + divididos + otros.length} ${t('cp_pallets')} · ${fmtNum(pzasTotal - pzasVan)} pzas`;
    };
    m.querySelectorAll('.cp-chk').forEach(c => c.addEventListener('change', actualizar));
    m.querySelectorAll('.cp-qty').forEach(c => c.addEventListener('input', actualizar));
    actualizar();
    document.getElementById('cp-confirm').addEventListener('input', () => { document.getElementById('cp-err').textContent = ''; });
    document.getElementById('cp-ok').onclick = async () => {
      const marcados = leerMarcados();
      const malo = marcados.find(x => x.qty <= 0 || x.qty > qtyDe[x.id]);
      if (malo) { document.getElementById('cp-err').textContent = t('cp_err_qty').replace('{max}', fmtNum(qtyDe[malo.id])); return; }
      if (document.getElementById('cp-confirm').value.trim().toUpperCase() !== 'PARCIAL') {
        document.getElementById('cp-err').textContent = t('cp_err_confirm'); return;
      }
      document.getElementById('cp-ok').disabled = true;
      await ejecutarCierreParcial(embId, marcados);
    };
  } catch (e) {
    alert('Error abriendo cierre parcial: ' + e.message);
    console.error('Error en abrirCierreParcial:', e);
  }
};

// Calcula cajas y texto de cajas para una cantidad (misma fórmula que actualizarEmpaquePalletsLote).
// Si Empaque no tiene datos, o es REMPLAZO (1 pallet sin repartir en cajas), deja cajas en 0.
async function cajasParaCantidad(p, qty) {
  if ((p.motivo || '').toUpperCase() === 'REMPLAZO') return { cajas: 0, boxes_txt: '' };
  const info = await calcularEmpaque(p.modelo, qty, p.part_number);
  if (!info.ok || !info.pcsPorCaja) return { cajas: 0, boxes_txt: '' };
  const pcsPorCaja = info.pcsPorCaja;
  const cajas = Math.ceil(qty / pcsPorCaja);
  const ultima = qty - pcsPorCaja * (cajas - 1);
  const boxes_txt = (ultima > 0 && ultima < pcsPorCaja && cajas > 1) ? `${pcsPorCaja}X${cajas - 1} + ${ultima}X1` : `${pcsPorCaja}X${cajas}`;
  return { cajas, boxes_txt };
}

// Divide un pallet: el original se queda con "qtyFue" (se embarca) y se crea un pallet nuevo del
// mismo lote con el resto. El nuevo copia todo del original (incluido su QC aprobado) y queda
// READY_TO_SHIP con etiqueta pendiente de imprimir. Devuelve el ID del pallet nuevo.
async function dividirPalletParaCierre(p, qtyFue) {
  const { db, doc, getDoc, collection, query, where, getDocs, writeBatch, serverTimestamp } = window.fb;
  const resto = (p.quantity || 0) - qtyFue;
  const hermanosSnap = await getDocs(query(collection(db, 'shipqr_pallets'), where('lot_number', '==', p.lot_number)));
  let maxNum = 0;
  hermanosSnap.forEach(d => { maxNum = Math.max(maxNum, d.data().pallet_numero || 0); });
  let nuevoNum = maxNum + 1;
  while ((await getDoc(doc(db, 'shipqr_pallets', `${p.lot_number}-P${nuevoNum}`))).exists()) nuevoNum++;
  const nuevoId = `${p.lot_number}-P${nuevoNum}`;
  const nuevoTotal = hermanosSnap.size + 1;
  const cajasFue = await cajasParaCantidad(p, qtyFue);
  const cajasResto = await cajasParaCantidad(p, resto);
  const qr = (num, qty) => JSON.stringify({ lot: p.lot_number, pallet: num, mod: p.modelo, pn: p.part_number, qty, dest: p.destination });

  const batch = writeBatch(db);
  const { id: _omit, ...datos } = p;
  batch.set(doc(db, 'shipqr_pallets', nuevoId), {
    ...datos,
    pallet_numero: nuevoNum, total_pallets: nuevoTotal,
    quantity: resto, cajas: cajasResto.cajas, boxes_txt: cajasResto.boxes_txt, parcial: true,
    status: 'READY_TO_SHIP', qr_data: qr(nuevoNum, resto),
    etiqueta_impresa: false, etiqueta_impresa_at: null,
    dividido_de: p.id, created_at: serverTimestamp(), updated_at: serverTimestamp()
  });
  batch.update(doc(db, 'shipqr_pallets', p.id), {
    quantity: qtyFue, cajas: cajasFue.cajas, boxes_txt: cajasFue.boxes_txt, parcial: true,
    status: 'SHIPPED', qr_data: qr(p.pallet_numero, qtyFue), total_pallets: nuevoTotal,
    dividido: true, cantidad_original: p.quantity || 0, updated_at: serverTimestamp()
  });
  // Los demás pallets del lote solo actualizan el "de N" para que la numeración cuadre
  hermanosSnap.forEach(d => { if (d.id !== p.id) batch.update(doc(db, 'shipqr_pallets', d.id), { total_pallets: nuevoTotal }); });
  await batch.commit();
  return nuevoId;
}

async function ejecutarCierreParcial(embId, marcados) {
  try {
    const { db, doc, getDoc, updateDoc, writeBatch, serverTimestamp } = window.fb;
    // Se vuelve a leer todo fresco para no trabajar con datos viejos
    const embRef = doc(db, 'shipqr_embarques', embId);
    const embSnap = await getDoc(embRef);
    const ids = embSnap.data()?.lotes || [];
    const pallets = (await Promise.all(ids.map(async id => {
      const s = await getDoc(doc(db, 'shipqr_pallets', id));
      return s.exists() ? { id: s.id, ...s.data() } : null;
    }))).filter(Boolean);

    const qtyMarcada = {}; marcados.forEach(x => { qtyMarcada[x.id] = x.qty; });
    const aMarcar = pallets.filter(p => p.status === 'READY_TO_SHIP' && qtyMarcada[p.id] !== undefined);
    const completos = aMarcar.filter(p => qtyMarcada[p.id] >= (p.quantity || 0));
    const aDividir = aMarcar.filter(p => qtyMarcada[p.id] > 0 && qtyMarcada[p.id] < (p.quantity || 0));
    const idsQuedan = pallets.filter(p => p.status === 'SHIPPED').concat(aMarcar).map(p => p.id);
    const aMover = pallets.filter(p => !idsQuedan.includes(p.id)).map(p => p.id);

    // 1) Pallets que se fueron solo en parte: se dividen y el remanente pasa al siguiente embarque
    for (const p of aDividir) aMover.push(await dividirPalletParaCierre(p, qtyMarcada[p.id]));
    // 2) Los que subieron completos sin escanear -> SHIPPED
    if (completos.length) {
      const batch = writeBatch(db);
      completos.forEach(p => batch.update(doc(db, 'shipqr_pallets', p.id), { status: 'SHIPPED', updated_at: serverTimestamp() }));
      await batch.commit();
    }
    // 3) Cerrar este embarque solo con lo cargado, dejando registro del cierre parcial
    await updateDoc(embRef, {
      lotes: idsQuedan, status: 'CLOSED', closed_at: serverTimestamp(),
      cierre_parcial: true,
      cierre_parcial_por: window.currentUser?.nombre || window.currentUser?.username || '',
      pallets_movidos: aMover
    });
    await congelarMontoEmbarque(embId);
    // 4) Los que no se fueron pasan al siguiente embarque (se crea solo si no hay uno abierto), sin cambiar su estado
    if (aMover.length) await agregarPalletsAEmbarqueActivoSiExiste(aMover);
    await moverPalletsDiferidosAlSiguiente();
    // 5) Actualizar estado resumen de los lotes que cambiaron y el folio de PL del embarque cerrado
    const lotes = [...new Set(aMarcar.map(p => p.lot_number))];
    await Promise.all(lotes.map(actualizarEstadoLotePorPallets));
    if (idsQuedan[0]) await verificarYGenerarPackingListNo(idsQuedan[0]);

    document.getElementById('cp-modal')?.remove();
    alert(`${t('cp_ok')}\n✅ ${idsQuedan.length} · ➡️ ${aMover.length}${aDividir.length ? `\n✂️ ${aDividir.map(p => p.lot_number).join(', ')}` : ''}`);
    pintarChecklistRampa();
  } catch (e) {
    alert('Error en cierre parcial: ' + e.message);
    console.error('Error en ejecutarCierreParcial:', e);
    const b = document.getElementById('cp-ok'); if (b) b.disabled = false;
  }
}

window.toggleRampaScanner = function() {
  const wrap = document.getElementById('rampa-scanner-wrap');
  if (!wrap) return;
  const abierto = wrap.style.display !== 'none';
  if (abierto) {
    wrap.style.display = 'none';
    wrap.innerHTML = '';
    if (html5QrCode) { try { html5QrCode.stop(); } catch(e) {} html5QrCode = null; }
    return;
  }
  wrap.style.display = 'block';
  wrap.innerHTML = `
    <div style="background:#2a1d05;border:2px solid #f1c40f;color:#f1c40f;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:13px;font-weight:700;text-align:center">⚠️ ${t('rmp_banner')}</div>

    <div id="qr-result" style="margin-top:14px;min-height:40px"></div>
  `;
  html5QrCode = new Html5Qrcode('qr-reader');
  html5QrCode.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: 220 },
    onScanSuccess,
    () => {}
  ).catch(err => {
    document.getElementById('qr-result').innerHTML = `<div style="color:#e74c3c;font-size:13px">No se pudo acceder a la cámara: ${err}</div>`;
  });
};

        </div>
      </div>`;
    const si = document.getElementById('rmp-si'), no = document.getElementById('rmp-no');
    let seg = 3;
    si.textContent = t('rmp_espera').replace('{s}', seg);
    const timer = setInterval(() => {
      seg--;
      if (!document.getElementById('rmp-si')) { clearInterval(timer); return; }
      if (seg > 0) { si.textContent = t('rmp_espera').replace('{s}', seg); return; }

    si.onclick = () => { if (si.disabled) return; clearInterval(timer); resolve(true); };
    no.onclick = () => { clearInterval(timer); resolve(false); };
  });
}

async function onScanSuccess(decodedText) {
  if (html5QrCode) { try { await html5QrCode.pause(true); } catch(e) {} }
  const resultEl = document.getElementById('qr-result');
  let qr;
  try { qr = JSON.parse(decodedText); } catch(e) {
    resultEl.innerHTML = `<div style="color:#e74c3c;font-size:13px">QR inválido</div>`;
    setTimeout(resumeScan, 1800); return;
  }
  if (!qr.pallet) {
    resultEl.innerHTML = `<div style="color:#e74c3c;font-size:13px">Este QR no tiene número de pallet (etiqueta antigua)</div>`;
    setTimeout(resumeScan, 2000); return;
  }

  const { db, doc, getDoc, updateDoc, serverTimestamp, setDoc } = window.fb;
  const palletId = `${qr.lot}-P${qr.pallet}`;
  const ref = doc(db, 'shipqr_pallets', palletId);
  const snap = await getDoc(ref);

  const registrarEscaneo = (data) => setDoc(doc(db, 'shipqr_estado', 'ultimo_escaneo'), { ...data, ts: serverTimestamp() }).catch(()=>{});

  if (!snap.exists()) {
    resultEl.innerHTML = `<div style="background:rgba(226,75,74,0.12);color:#e74c3c;padding:12px;border-radius:6px;font-size:13px">Pallet ${palletId} no existe en el sistema</div>`;
    registrarEscaneo({ lot_number: qr.lot, resultado: 'ERROR', mensaje: 'No existe en el sistema' });
    setTimeout(resumeScan, 1800); return;
  }

  const p = snap.data();
  const etiquetaPallet = `Pallet ${p.pallet_numero}/${p.total_pallets}`;
  if (p.status === 'QC_PENDING' || p.status === 'QC_REJECTED') {
    resultEl.innerHTML = `<div style="background:rgba(226,75,74,0.12);color:#e74c3c;padding:12px;border-radius:6px;font-size:13px">${p.lot_number} · ${etiquetaPallet} — ${p.status === 'QC_PENDING' ? 'pendiente de QC' : 'rechazado por QC'} — NO cargar</div>`;
    registrarEscaneo({ lot_number: p.lot_number, quantity: p.quantity||0, resultado: 'ERROR', mensaje: `${etiquetaPallet}: ${p.status === 'QC_PENDING' ? 'QC pendiente' : 'Rechazado por QC'}` });
    setTimeout(resumeScan, 2200); return;
  }
  if (p.status === 'SHIPPED') {
    resultEl.innerHTML = `<div style="background:rgba(210,153,34,0.12);color:#f1c40f;padding:12px;border-radius:6px;font-size:13px">${p.lot_number} · ${etiquetaPallet} ya fue cargado anteriormente</div>`;
    registrarEscaneo({ lot_number: p.lot_number, quantity: p.quantity||0, resultado: 'WARNING', mensaje: `${etiquetaPallet}: Ya fue cargado` });
    setTimeout(resumeScan, 2200); return;
  }
  if (p.status === 'QC_APPROVED') {
    // Ya lo aprobó QC pero todavía no pasó por Recepción P3 — no se puede cargar directo al contenedor
    resultEl.innerHTML = `<div style="background:rgba(226,75,74,0.12);color:#e74c3c;padding:12px;border-radius:6px;font-size:13px">${p.lot_number} · ${etiquetaPallet} — aún no se ha recibido en Almacén P3<br><span style="font-size:11px;color:#7f8c9a">Usa la pantalla "Recepción P3" primero</span></div>`;
    registrarEscaneo({ lot_number: p.lot_number, quantity: p.quantity||0, resultado: 'ERROR', mensaje: `${etiquetaPallet}: Falta recepción en P3` });
    setTimeout(resumeScan, 2400); return;
  }

  // Confirmación obligatoria: el escaneo marca el pallet como CARGADO y le asigna su lugar real en el contenedor
  const confirmado = await confirmarCargaEnContenedor(p, etiquetaPallet, resultEl);
  if (!confirmado) {
    resultEl.innerHTML = `<div style="background:rgba(210,153,34,0.12);color:#f1c40f;padding:12px;border-radius:6px;font-size:13px">${p.lot_number} · ${etiquetaPallet} — ${t('rmp_cancelado')}</div>`;
    registrarEscaneo({ lot_number: p.lot_number, quantity: p.quantity||0, resultado: 'WARNING', mensaje: `${etiquetaPallet}: Cancelado, aún no está cargado en el contenedor` });
    setTimeout(resumeScan, 2600); return;
  }
  await updateDoc(ref, { status: 'SHIPPED', updated_at: serverTimestamp(), shipped_at: serverTimestamp(), shipped_by: (window.currentUser && window.currentUser.username) || '' });
  await actualizarEstadoLotePorPallets(p.lot_number);
  pintarChecklistRampa();
  resultEl.innerHTML = `<div style="background:rgba(63,185,80,0.12);color:#2ecc71;padding:12px;border-radius:6px;font-size:13px">✓ ${p.lot_number} · ${etiquetaPallet} — ${t('rmp_ok')} (${fmtNum(p.quantity)} pzas)</div>`;
  registrarEscaneo({ lot_number: p.lot_number, quantity: p.quantity||0, resultado: 'OK', mensaje: `${etiquetaPallet}: Confirmado cargado en contenedor` });
  setTimeout(resumeScan, 1800);
}

// Corte especial de embarque — se configura desde BOM Simulator > Admin BOM
// (mismo Firestore, doc bom_simulator_p4/cortes_especiales) y aquí solo se lee
// para que el conteo regresivo del modo TV muestre el corte real, no siempre
// el automático de miércoles/sábado.
let _cortesEspeciales = [];
async function cargarCortesEspeciales() {
  try {
    const { db, doc, getDoc } = window.fb;
    const snap = await getDoc(doc(db, 'bom_simulator_p4', 'cortes_especiales'));
    if (snap.exists()) {
      const d = snap.data();
      _cortesEspeciales = Array.isArray(d.lista) ? d.lista : [];
    }
  } catch (e) { /* si falla, sigue con el horario normal miércoles/sábado */ }
}
window.addEventListener('firebaseReady', cargarCortesEspeciales);

function aplicarCorteEspecial(corte) {
  if (!corte || !_cortesEspeciales.length) return corte;
  const match = _cortesEspeciales.find(c => c.original === corte.getTime());
  return match ? new Date(match.nuevo) : corte;
}

// Próximo corte de embarque: miércoles 3:30pm y sábado 11:00am (reglas operativas, no forzadas por el sistema)
function proximoCorte() {
  const ahora = new Date();
  const candidatos = [];
  for (let dias = -21; dias <= 21; dias++) {
    const d = new Date(ahora); d.setDate(ahora.getDate() + dias);
    if (d.getDay() === 3) candidatos.push(aplicarCorteEspecial(new Date(d.getFullYear(), d.getMonth(), d.getDate(), 15, 30, 0)));
    if (d.getDay() === 6) candidatos.push(aplicarCorteEspecial(new Date(d.getFullYear(), d.getMonth(), d.getDate(), 11, 0, 0)));
  }
  return candidatos.filter(c => c > ahora).sort((a,b) => a - b)[0];
}

function fmtCuentaRegresiva(ms) {
  if (ms <= 0) return '00:00:00';
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

let tvEmbarqueTimer = null;
let tvEmbarqueEmb = null;
let tvEmbarquePalletsUnsubs = []; // listeners en vivo activos sobre shipqr_pallets
let tvEmbarquePallets = [];       // último snapshot conocido de esos pallets
let tvEmbarquePollInterval = null; // respaldo: re-lee todo cada N seg por si un aviso en vivo se pierde

function limpiarListenersPalletsTv() {
  tvEmbarquePalletsUnsubs.forEach(u => { try { u(); } catch (e) {} });
  tvEmbarquePalletsUnsubs = [];
  if (tvEmbarquePollInterval) { clearInterval(tvEmbarquePollInterval); tvEmbarquePollInterval = null; }
}

// Vuelve a leer TODOS los pallets del embarque activo directamente (sin depender de listeners)
// y reemplaza por completo lo que se muestra. Es el respaldo que corrige la pantalla sola
// si algún aviso en vivo no llegó.
async function refrescarPalletsTvManual() {
  const ids = tvEmbarqueEmb?.lotes || [];
  if (ids.length === 0) return;
  const { db, doc, getDoc } = window.fb;
  try {
    const snaps = await Promise.all(ids.map(id => getDoc(doc(db, 'shipqr_pallets', id))));
    tvEmbarquePallets = snaps.filter(s => s.exists()).map(s => ({ id: s.id, ...s.data() }));
    console.log('[TV] refresco de respaldo — pallets releídos:', tvEmbarquePallets.length, 'de', ids.length);
    pintarTvEmbarque();
  } catch (e) { console.error('Error en refresco de respaldo del TV:', e); }
}

function renderTvEmbarque() {
  if (tvEmbarqueTimer) { clearInterval(tvEmbarqueTimer); tvEmbarqueTimer = null; }
  limpiarListenersPalletsTv();
  const app = document.getElementById('app');
  app.innerHTML = topBar() + `
    <div style="max-width:1100px;margin:0 auto;padding:20px" id="tv-emb-root">
      <div style="text-align:center;color:#7f8c9a;font-size:13px">${t('word_cargando')}</div>
    </div>
  `;

  const { db, collection, query, where, onSnapshot } = window.fb;
  const q = query(collection(db, 'shipqr_embarques'), where('status', 'in', ['OPEN', 'LOADING']));
  onSnapshot(q, (snap) => {
    const embs = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.created_at?.toMillis?.() || 0) - (a.created_at?.toMillis?.() || 0));
    const nuevoEmb = embs[0] || null;
    // Solo reconectamos los listeners de pallets si cambió el embarque activo (o su lista de pallets),
    // así evitamos desconectar/reconectar en cada micro-cambio del documento embarque.
    const cambioEmbarque = nuevoEmb?.id !== tvEmbarqueEmb?.id;
    const cambioLotes = JSON.stringify(nuevoEmb?.lotes || []) !== JSON.stringify(tvEmbarqueEmb?.lotes || []);
    tvEmbarqueEmb = nuevoEmb;
    if (cambioEmbarque || cambioLotes) escucharPalletsTv();
    else pintarTvEmbarque();
  }, () => { pintarTvEmbarque(); });

  tvEmbarqueTimer = setInterval(actualizarCuentaRegresivaTv, 1000);
}

// Escucha en vivo (onSnapshot) cada pallet del embarque activo directamente en Firestore —
// un listener individual por pallet, el método más simple y confiable para actualizaciones en vivo —
// para que Recepción P3 y Rampa reflejen sus escaneos al instante en el TV, sin depender
// de que el documento del embarque cambie ni de recargar la página.
function escucharPalletsTv() {
  limpiarListenersPalletsTv();
  const ids = tvEmbarqueEmb?.lotes || [];
  const porId = {};
  tvEmbarquePallets = [];
  if (ids.length === 0) { pintarTvEmbarque(); return; }

  const { db, doc, onSnapshot } = window.fb;
  ids.forEach(id => {
    const unsub = onSnapshot(doc(db, 'shipqr_pallets', id), (snap) => {
      console.log('[TV] actualización en vivo del pallet', id, '-', snap.exists() ? snap.data().status : 'no existe');
      if (snap.exists()) porId[id] = { id: snap.id, ...snap.data() };
      else delete porId[id];
      tvEmbarquePallets = Object.values(porId);
      pintarTvEmbarque();
    }, (err) => { console.error('Error en listener de pallet del TV:', id, err); });
    tvEmbarquePalletsUnsubs.push(unsub);
  });

  // Respaldo: aunque falle algún aviso en vivo, esto corrige la pantalla sola cada 8s
  refrescarPalletsTvManual();
  tvEmbarquePollInterval = setInterval(refrescarPalletsTvManual, 8000);
}

async function moSha(txt) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}

  if (p1 !== p2) return 'mo_pw_dif';
  const { db, doc, setDoc } = window.fb;
  const salt = Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x => x.toString(16).padStart(2, '0')).join('');
  const hash = await moSha(salt + ':' + p1);
  await setDoc(doc(db, 'shipqr_config', 'montos_acceso'), { salt, hash, updated_by: window.currentUser.username, updated_at: new Date().toISOString() });
  await moAuditoria('CAMBIO_PASSWORD');
  return null;
}

window.moDesbloquear = async function() {
  const msg = document.getElementById('mo-msg');
  const pwd = (document.getElementById('mo-pw') || {}).value || '';
  const bl = moLeerBloqueo();
  if (bl.until && Date.now() < bl.until) { msg.textContent = t('mo_bloqueado').replace('{m}', Math.ceil((bl.until - Date.now()) / 60000)); return; }
  try {
    const { db, doc, getDoc } = window.fb;
    const s = await getDoc(doc(db, 'shipqr_config', 'montos_acceso'));
    const cfg = s.exists() ? s.data() : null;
    if (!cfg || !cfg.hash) { moPintarCandado(); return; }
    const h = await moSha((cfg.salt || '') + ':' + pwd);
    if (h === cfg.hash) {
      moGuardarBloqueo({});
      moExtender();
      moData = null;
      await moAuditoria('ACCESO_OK');
      moPintar();
    } else {
      const fallos = (bl.fails || 0) + 1;
      if (fallos >= 5) { moGuardarBloqueo({ fails: 0, until: Date.now() + 5 * 60 * 1000 }); msg.textContent = t('mo_bloqueado').replace('{m}', 5); }
      else { moGuardarBloqueo({ fails: fallos }); msg.textContent = t('mo_incorrecta').replace('{n}', 5 - fallos); }
      await moAuditoria('ACCESO_FALLIDO', 'intento ' + fallos);
    }
  } catch (e) { msg.textContent = t('mo_err') + e.message; console.error(e); }
};

async function moCargarDatos() {
  const { db, doc, getDoc, getDocs, collection, query, where, updateDoc } = window.fb;
  const [metasSnap, cerrSnap, actSnap] = await Promise.all([
    getDoc(doc(db, 'shipqr_config', 'montos_metas')),
    getDocs(query(collection(db, 'shipqr_embarques'), where('status', '==', 'CLOSED'))),
    getDocs(query(collection(db, 'shipqr_embarques'), where('status', 'in', ['OPEN', 'LOADING'])))
  ]);
  const metas = metasSnap.exists() ? metasSnap.data() : {};
  const precios = await leerPreciosMaster();
  let cerrados = cerrSnap.docs.map(d => ({ id: d.id, ...d.data() }))
    .filter(e => e.closed_at && e.closed_at.toDate)
    .map(e => ({ ...e, cierre: e.closed_at.toDate() }))
    .sort((a, b) => a.cierre - b.cierre);

  // PL cerrados antes de congelar montos: se estiman UNA vez con el precio actual y se guardan marcados como "estimado"
  const faltan = cerrados.filter(e => !e.monto_resumen);
  let i = 0;
  for (const e of faltan) {
    i++;
    const p = document.getElementById('mo-prog');
    if (p) p.textContent = t('mo_calculando').replace('{i}', i).replace('{n}', faltan.length);
    try {
      const r = await calcularMontoEmbarque(e.id);
      r.estimado = true; r.congelado_at = new Date().toISOString(); r.congelado_por = '(estimado)';
      await updateDoc(doc(db, 'shipqr_embarques', e.id), { monto_resumen: r });
      e.monto_resumen = r;
    } catch (err) { console.error('No se pudo estimar el PL ' + e.id, err); }
  }
  cerrados = cerrados.filter(e => e.monto_resumen && e.monto_resumen.piezas > 0);

  // Embarque activo: monto proyectado, separado por avance (cargado / recibido / en proceso)
  let activo = null;
  const act = actSnap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (b.created_at?.toMillis?.() || 0) - (a.created_at?.toMillis?.() || 0))[0];
  if (act) {
    const { filas } = await armarFilasPackingList(act.id, false);
    const seg = { cargado: 0, recibido: 0, proceso: 0 };
    const sinPrecio = {};
    let total = 0;
    filas.forEach(f => {
      if (f.status === 'QC_REJECTED') return;
      const pn = String(f.part_number || '').trim().toUpperCase();
      const pr = precios[pn];
      const precio = pr && pr.precio > 0 ? pr.precio : 0;
      if (!precio) { const g = sinPrecio[pn] || (sinPrecio[pn] = { modelo: f.modelo || '', pn, pallets: 0 }); g.pallets++; return; }
      const m = (f.quantity || 0) * precio;
      total += m;
      if (f.status === 'SHIPPED') seg.cargado += m; else if (f.status === 'READY_TO_SHIP') seg.recibido += m; else seg.proceso += m;
    });
    activo = { id: act.id, folio: folioEmb(act), destino: act.destino || 'DALLAS', total, seg, sinPrecio: Object.values(sinPrecio) };
  }
  // Pallets aprobados por QC que siguen en piso: sin embarque abierto (o en el último PL cerrado sin cargarse)
  let piso = [];
  try {
    const palSnap = await getDocs(query(collection(db, 'shipqr_pallets'), where('status', 'in', ['QC_APPROVED', 'READY_TO_SHIP'])));
    const enAbierto = new Set();
    actSnap.docs.forEach(d => (d.data().lotes || []).forEach(x => enAbierto.add(x)));
    const cerrAll = cerrSnap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(e => e.closed_at && e.closed_at.toDate).map(e => ({ ...e, cierre: e.closed_at.toDate() })).sort((a, b) => a.cierre - b.cierre);
    const ultC = cerrAll[cerrAll.length - 1];
    const enCerrado = {};
    cerrAll.forEach(e => (e.lotes || []).forEach(x => { enCerrado[x] = e; }));
    palSnap.docs.forEach(d => {
      if (enAbierto.has(d.id)) return;
      const pa = d.data(), ce = enCerrado[d.id];
      if (ce && (!ultC || ce.id !== ultC.id)) return; // PL cerrados viejos: no se consideran
      const pcs = pa.quantity || 0;
      if (!(pcs > 0)) return;
      const pn = String(pa.part_number || '').trim().toUpperCase();
      const pr = precios[pn], precio = pr && pr.precio > 0 ? pr.precio : 0;
      piso.push({ id: d.id, lote: pa.lot_number || '', modelo: pa.modelo || '', pn, pallet: (pa.pallet_numero || '?') + '/' + (pa.total_pallets || '?'), pcs, precio, monto: pcs * precio, cerrado: !!ce, pl: ce ? folioEmb(ce) : '', diferido: pa.diferido === true });
    });
    piso.sort((a, b) => (a.cerrado === b.cerrado ? b.monto - a.monto : a.cerrado ? -1 : 1));
  } catch (e) { console.error('Montos: pallets en piso', e); }
  return { metas, cerrados, activo, piso };
}
